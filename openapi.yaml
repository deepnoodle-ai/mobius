    CreateAPIKeyRequest:
      type: object
      required:
      - name
      additionalProperties: false
      description: Request shape for creating an organization API key. Pass `principal_id`
        to bind the key to an existing machine principal — the key authenticates as that principal,
        and permissions are managed by assigning roles to the principal rather than to the
        key. Omit `principal_id` to bind the key to the permanent organization principal;
        the chosen system `role` is stored as the credential scope.
      properties:
        name:
          type: string
          description: Human-readable label, unique within the organization.
        principal_id:
          type: string
          description: Principal this key authenticates as. Omit to use the permanent organization
            principal with the requested role as a mandatory scope.
        scope_role_id:
          type: string
          description: Optional role whose permissions cap this key below its principal's
            full grants. Only applicable when `principal_id` is set.
        allow_unassigned_principal:
          type: boolean
          default: false
          description: Allow minting a key for a principal with no role assignments. The resulting
            key cannot access org resources until a role is assigned. Omit this for normal
            onboarding so a missing assignment fails with `principal_has_no_roles`. Only applicable
            when `principal_id` is set.
        role:
          type: string
          enum:
          - Owner
          - Admin
          - User
          - Viewer
          default: Admin
          description: Mandatory scope role when `principal_id` is omitted. The permanent
            organization principal holds Owner, and this credential scope can only narrow
            it. Defaults to `Admin`. `Owner` grants full control (including billing and org
            deletion); `Admin` covers organization administration and team resource posture,
            plus billing reads; `User` can use reachable resources and build private configuration;
            `Viewer` is read-only. `Worker` is not selectable here — org-level keys are barred
            from the job endpoints, so it would be inert. For a narrower cap, such as use-only
            automation, bind the key to a principal and set `scope_role_id` to a custom role.
            Ignored when `principal_id` is set.
        expires_at:
          type: string
          format: date-time
          description: Optional hard expiry. Omit for a non-expiring key.
        tags:
          $ref: '#/components/schemas/TagMap'
          description: Labels to apply to the new API key.
      example:
        name: CI worker
        principal_id: svc_7q2v9x6m3n8p5r4t
        tags:
          owner: product
    ActionAnnotationsRequest:
      type: object
      additionalProperties: false
      description: Request hints that describe the safe-use properties of the action. Used
        by the engine and tooling to decide retry behavior, dry-run eligibility, etc. Unknown
        request properties are rejected.
      properties:
        idempotent:
          type: boolean
          description: The action produces the same result when called with the same inputs;
            safe to retry automatically.
        destructive:
          type: boolean
          description: The action has irreversible side effects (deletion, financial transactions,
            etc.). Surfaced as a warning in UI.
        read_only:
          type: boolean
          description: The action has no side effects; safe to call in dry-run scenarios.
    ActionAnnotations:
      type: object
      additionalProperties: true
      description: Response hints that describe the safe-use properties of the action. Response
        annotations are forward-compatible so the server can add response-only hints without
        breaking strict clients.
      properties:
        idempotent:
          type: boolean
          description: The action produces the same result when called with the same inputs;
            safe to retry automatically.
        destructive:
          type: boolean
          description: The action has irreversible side effects (deletion, financial transactions,
            etc.). Surfaced as a warning in UI.
        read_only:
          type: boolean
          description: The action has no side effects; safe to call in dry-run scenarios.
    ActionEndpointKind:
      type: string
      enum:
      - http
      - worker
      description: Backing kind for a custom action. `http` actions POST to a registered endpoint.
        `worker` actions dispatch jobs to connected workers that advertise the registered
        action name.
    ActionInvocationFormat:
      type: string
      enum:
      - legacy
      - signed_context_v1
      description: Outbound request-body contract for an HTTP action. `legacy` sends the unversioned
        `{step_key, parameters}` body. `signed_context_v1` sends a versioned envelope whose
        org, action, actor, and origin claims are derived by Mobius and covered by the existing
        HMAC signature. Worker-backed actions must use `legacy`.
    ActionInvocationV1:
      type: object
      additionalProperties: true
      description: Signed HTTP action request body for `signed_context_v1`. Receivers must
        verify the HMAC over the exact raw body before parsing this envelope. Unknown fields
        are permitted for forward compatibility.
      required:
      - mobius
      - parameters
      properties:
        mobius:
          $ref: '#/components/schemas/ActionInvocationContextV1'
        parameters:
          type: object
          additionalProperties: true
          description: Caller-supplied action parameters. These are not an authorization identity.
    ActionInvocationContextV1:
      type: object
      additionalProperties: true
      required:
      - schema_version
      - scope
      - action
      - actor
      - origin
      properties:
        schema_version:
          type: integer
          enum:
          - 1
        scope:
          $ref: '#/components/schemas/ActionInvocationScopeV1'
        action:
          $ref: '#/components/schemas/ActionInvocationActionV1'
        actor:
          $ref: '#/components/schemas/ActionInvocationActorV1'
        origin:
          $ref: '#/components/schemas/ActionInvocationOriginV1'
    ActionInvocationScopeV1:
      type: object
      additionalProperties: true
      required:
      - org_id
      properties:
        org_id:
          type: string
    ActionInvocationActionV1:
      type: object
      additionalProperties: true
      required:
      - id
      - name
      properties:
        id:
          type: string
        name:
          type: string
    ActionInvocationActorV1:
      type: object
      additionalProperties: true
      required:
      - principal_id
      - principal_type
      properties:
        principal_id:
          type: string
        principal_type:
          type: string
          enum:
          - human
          - agent
          - service
          - system
        agent_id:
          type: string
          nullable: true
          description: Required for agent principals and forbidden for all other principal
            types.
    ActionInvocationOriginV1:
      type: object
      additionalProperties: true
      required:
      - kind
      properties:
        kind:
          type: string
          enum:
          - agent_tool_call
          - loop_action_step
          - direct_action_invoke
          - server_internal
        channel_exchange_id:
          type: string
          nullable: true
        step_key:
          type: string
          nullable: true
        agent_turn_id:
          type: string
          nullable: true
        session_id:
          type: string
          nullable: true
        tool_call_id:
          type: string
          nullable: true
    CreateActionRequest:
      type: object
      additionalProperties: false
      description: Registers an org-owned custom action agents can call as a tool.
      required:
