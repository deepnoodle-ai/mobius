  /v1/organization/oauth-return-origins:
    get:
      operationId: getOAuthReturnOrigins
      tags:
      - organizations
      x-public: true
      summary: Get the org's OAuth return-origin allowlist
      description: Returns the active organization's allowlist of exact HTTPS origins that
        an embedded partner may name as a `return_url` when starting a provider connection.
        An empty list means embedded return is disabled for the organization. Requires `Admin`
        or `Owner` membership.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthReturnOrigins'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: replaceOAuthReturnOrigins
      tags:
      - organizations
      x-public: true
      summary: Replace the org's OAuth return-origin allowlist
      description: Full-replace of the active organization's OAuth return-origin allowlist.
        Each entry must be an exact HTTPS origin (scheme, host, and optional non-default port);
        it is normalized to lowercase host with default ports stripped, and duplicates are
        collapsed. At most 20 origins are accepted. Sending an empty list disables embedded
        return. Requires `Admin` or `Owner` membership.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutOAuthReturnOriginsRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthReturnOrigins'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/organization/context:
    get:
      operationId: getOrgContext
      tags:
      - organizations
      x-public: true
      summary: Get the organization's shared context
      description: 'Returns the organization context: background on the business that every
        agent in the organization receives in its system prompt, on every turn, whether the
        agent is used in chat, invoked by an application, run by a routine, or reached through
        a messaging channel. Any member of the organization may read it.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgContext'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: replaceOrgContext
      tags:
      - organizations
      x-public: true
      summary: Replace the organization's shared context
      description: 'Full-replace of the organization context. The content is stored as written
        apart from normalization: line endings collapse to LF and trailing whitespace is dropped.
        It must be valid UTF-8 without NUL bytes and at most 16384 bytes; an empty string
        clears it. The new text reaches every agent in the organization on its next turn.
        Requires `Admin` or `Owner` membership.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutOrgContextRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgContext'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/interactions:
    post:
