  /v1/sessions/{session_id}/attachments:
    post:
      operationId: createSessionAttachment
      tags:
      - sessions
      summary: Create session attachment
      description: |-
        Uploads one document or image into server-managed artifact storage and binds it immutably to this session. DOCX, XLSX, and PPTX uploads start asynchronous Markdown conversion through the document service. The returned `content_block` is the canonical block callers append in a session message or turn input.

        Phase 1 accepts PDF (up to 5 MiB and 50 pages), DOCX, XLSX, or PPTX (up to 5 MiB), Markdown or plain text (up to 100 KiB), and PNG, JPEG, WebP, or GIF images (up to 5 MiB). Mobius detects the media type from the bytes and does not trust the multipart MIME declaration. The feature must be enabled for the organization.
      parameters:
      - $ref: '#/components/parameters/SessionIdParam'
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
          maxLength: 255
        description: Optional retry key, scoped to this session and caller. An identical retry
          returns the original attachment. Reusing the key with different file bytes, filename,
          or MIME hint is rejected with a conflict.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateSessionAttachmentRequest'
      responses:
        '200':
          description: Existing attachment returned for an idempotent retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAttachmentResponse'
        '201':
          description: Attachment uploaded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAttachmentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The idempotency key was reused with different file bytes, filename,
            or MIME hint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Attachment exceeds its per-type size, Office safety, or PDF page limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Artifact storage is unavailable (`artifact_storage_unavailable`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/sessions/{session_id}/attachments/{artifact_id}:
