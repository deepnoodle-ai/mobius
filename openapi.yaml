  /v1/blueprints/apply:
    post:
      operationId: applyBlueprint
      tags:
      - blueprints
      summary: Apply a blueprint to an org
      description: 'Creates missing resources, updates resources Mobius manages on behalf
        of the blueprint, adopts matching uniquely-named resources where safe, and reports
        the resulting changes and bindings. With `mode: preview`, the request validates and
        returns a plan without mutating anything. Re-apply converges because each blueprint
        resource is persisted with its binding.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyBlueprintRequest'
            example:
              namespace: support
              blueprint_key: triage
              blueprint_version: '1'
              mode: apply
              resources:
                actions:
                - key: notify
                  name: support.notify
