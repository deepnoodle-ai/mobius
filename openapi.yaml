openapi: 3.0.3
info:
  title: Mobius API
  version: 0.1.0
  contact:
    name: Mobius
    url: https://mobiusops.com
  description: |-
    Mobius is an agent platform for mixed teams of humans, systems, and AI agents. This is the HTTP API behind the `mobius` CLI and the official client SDKs.

    **Base URL.** Production is `https://api.mobiusops.com`. Every route is prefixed with the stable major version `/v1`; breaking changes ship under a new prefix, not in place. The `version` field above tracks revisions of this specification, independent of the `/v1` URL version.

    **Authentication.** Send a credential in the `Authorization: Bearer <credential>` header. **API keys** (prefix `mbx_`) authenticate as a machine principal in one org and are issued from the Mobius app or the API-key endpoints; **CLI credentials** (prefix `mbc_`) are issued by the device-authorization flow on behalf of a user. See the `BearerAuth` security scheme for details.

    **Conventions.** Collections return a cursor-paginated envelope (`items` / `has_more` / `next_cursor`); single resources return the bare object. Errors use a shared envelope with a stable machine-readable `error.code`. Timestamps are ISO-8601 UTC.
servers:
- url: https://api.mobiusops.com
  description: Production
- url: http://localhost:8080
  description: Local development
security:
- BearerAuth: []
tags:
- name: resources
  x-displayName: Resources
  description: Resources API operations.
- name: api-keys
  x-displayName: API Keys
  description: Organization API keys used for programmatic authentication.
- name: actions
  x-displayName: Actions
  description: Org and catalog actions invoked by agents and loop steps.
- name: catalog
  x-displayName: Catalog
  description: Catalog API operations.
- name: jobs
  x-displayName: Jobs
  description: The worker WebSocket protocol used by customer-side workers to claim, run,
    and report jobs.
- name: billing
  x-displayName: Billing
  description: Organization subscription, invoice, and billing portal endpoints.
- name: permissions
  x-displayName: Permissions
  description: Permission definitions and presets used to build org roles.
- name: roles
  x-displayName: Roles
  description: System and custom roles plus user role assignments.
- name: organizations
  x-displayName: Organizations
  description: Organization metadata, membership administration, and the current-org control
    plane.
- name: interactions
  x-displayName: Interactions
  description: Structured requests between users and agents (request information, approval,
    review).
- name: agents
  x-displayName: Agents
  description: Agent identities, presence, and lifecycle administration.
- name: sessions
  x-displayName: Sessions
  description: Durable conversation sessions, their transcripts, and direct agent invocation.
- name: routines
  x-displayName: Routines
  description: Scheduled work in an originating session.
- name: skills
  x-displayName: Skills
  description: Org-local and system skill templates used to shape agent behavior and requested
    tools.
- name: blueprints
  x-displayName: Blueprints
  description: Blueprints API operations.
- name: principals
  x-displayName: Principals
  description: Principals API operations.
- name: tables
  x-displayName: Tables
  description: Agent-readable and -writable org tables.
- name: artifacts
  x-displayName: Artifacts
  description: Files produced by agents during loop runs and stored for later inspection.
paths:
  /v1/resources/{resource_type}/{resource_id}/ownership:
    patch:
      operationId: updateResourceOwnership
      x-public: true
      tags:
      - resources
      summary: Update a resource's custody or audience
      description: Shares, un-shares, hands custody to the team, transfers custody to a person,
        or detaches a narrowing agent container. Audience-expanding changes require an explicit
        confirmation. Un-sharing is refused while the resource remains delegated to a wider
        agent audience.
      parameters:
      - name: resource_type
        in: path
        required: true
        schema:
          type: string
          enum:
          - action
          - artifact
          - environment
          - routine
          - secret
          - session
          - skill
          - table
          - webhook
      - $ref: '#/components/parameters/IDParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceOwnershipTransitionRequest'
      responses:
        '200':
          description: Updated ownership state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceOwnershipState'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/api-keys:
    post:
      operationId: createAPIKey
      tags:
      - api-keys
      summary: Create API key
      description: Creates an API key for the active organization. Pass `principal_id` to
        bind the key to an existing machine principal — it authenticates as that principal
        and inherits its role assignments (optionally capped by `scope_role_id`). Omit `principal_id`
        to use the permanent organization principal with the chosen system `role` (defaults
        to `Admin`) as a mandatory key scope. The raw key value is returned in `key` and is
        never retrievable again after this response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAPIKeyRequest'
            example:
              name: CI worker
              principal_id: svc_7q2v9x6m3n8p5r4t
              expires_at: '2026-09-15T14:30:00Z'
              tags:
                owner: product
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIKeyCreateResult'
              example:
                id: cred_1jz8q2m7xp9vn4kt
                name: CI worker
                key_prefix: mbx_7q2v
                principal_id: svc_7q2v9x6m3n8p5r4t
                expires_at: '2026-09-15T14:30:00Z'
                tags:
                  owner: product
                created_at: '2026-06-15T14:30:00Z'
                updated_at: '2026-06-15T14:30:00Z'
                key: mbx_7q2v9k1m_redacted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    get:
      operationId: listAPIKeys
      tags:
      - api-keys
      summary: List API keys
      description: Returns the active organization's API keys, including pagination metadata.
      parameters:
      - $ref: '#/components/parameters/LimitParam'
      - $ref: '#/components/parameters/CursorParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIKeyListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/api-keys/{resource_id}:
    get:
      operationId: getAPIKey
      tags:
      - api-keys
      summary: Get API key
      description: Returns metadata for a single API key without exposing the raw secret.
      parameters:
      - $ref: '#/components/parameters/IDParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIKey'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteAPIKey
      tags:
      - api-keys
      summary: Delete API key
      description: Revokes the key. In-flight requests using this key will immediately start
        receiving 401 while credential metadata remains available for audit history.
      parameters:
      - $ref: '#/components/parameters/IDParam'
      responses:
        '204':
          description: No Content
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/actions:
    post:
      operationId: createAction
      tags:
      - actions
      summary: Create action
      description: Registers an org-owned custom action definition. HTTP actions require `endpoint_url`
        and receive a signing secret. Worker-backed actions omit `endpoint_url`; compatible
        workers make the registered action ready by advertising its name when connected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateActionRequest'
            example:
              name: review-pr
              title: Review PR
              description: Review a pull request and return findings.
              endpoint_kind: http
              invocation_format: signed_context_v1
              endpoint_url: https://hooks.example.com/mobius/review-pr
              input_schema:
                type: object
                required:
                - pull_request_url
                properties:
                  pull_request_url:
                    type: string
              annotations:
                idempotent: true
                read_only: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Action'
              example:
                id: act_8m4x9q2v7p5n3r6t
                name: review-pr
                title: Review PR
                description: Review a pull request and return findings.
                endpoint_kind: http
                invocation_format: signed_context_v1
                endpoint_url: https://hooks.example.com/mobius/review-pr
                input_schema:
                  type: object
                  required:
                  - pull_request_url
                  properties:
                    pull_request_url:
                      type: string
                annotations:
                  idempotent: true
                  destructive: false
                  read_only: true
                tags:
                  owner: product
                signing_secret: whsec_redacted
                owner:
                  kind: person
                  id: user_2f9s3k4m5n6p7q8r
                visibility: private
                posture: only_you
                created_at: '2026-06-15T14:30:00Z'
                updated_at: '2026-06-15T14:30:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/actions/{action_name}:
    patch:
      operationId: updateAction
      tags:
      - actions
      summary: Update action
      description: Updates action metadata, schemas, annotations, tags, or the HTTP endpoint
        URL. Worker-backed actions cannot set an endpoint URL.
      parameters:
      - $ref: '#/components/parameters/ActionNameParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateActionRequest'
            example:
              title: Review PR
              description: Review a pull request and return prioritized findings.
              tags:
                owner: product
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Action'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      operationId: deleteAction
      tags:
      - actions
      summary: Delete action
      description: Deletes an org-owned custom action definition. An action retained by a
        protected blueprint blocks deletion with `409 Conflict` until the protection is lifted.
      parameters:
      - $ref: '#/components/parameters/ActionNameParam'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/actions/{action_name}/secret/rotate:
    post:
      operationId: rotateActionSecret
      tags:
      - actions
      summary: Rotate signing secret
      description: Rotates the signing secret for an HTTP-backed custom action. Worker actions
        do not have signing secrets and return a validation error.
      parameters:
      - $ref: '#/components/parameters/ActionNameParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RotateSecretResult'
              example:
                secret_version: 2
                signing_secret: whsec_redacted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/action-invocations:
    get:
      operationId: listActionInvocations
      tags:
      - actions
      summary: List invocations
      description: Lists recent action invocation audit records from agents, direct invocations,
        and job-backed execution.
      parameters:
      - $ref: '#/components/parameters/CursorParam'
      - $ref: '#/components/parameters/LimitParam'
      - name: job_id
        in: query
        description: Filter to invocations from a specific job.
        schema:
          type: string
      - name: environment_id
        in: query
        description: Filter to invocations executed in a specific environment.
        schema:
          type: string
      - name: action_name
        in: query
        description: Filter to invocations of a specific action.
        schema:
          type: string
      - name: action_id
        in: query
        description: Filter to an immutable custom Action ID.
        schema:
          type: string
      - name: definition_scope
        in: query
        description: Filter by the scope that owned the selected definition.
        schema:
          type: string
          enum:
          - platform
          - custom
      - name: secret_version
        in: query
        description: Filter to deliveries signed with a specific secret version.
        schema:
          type: integer
          format: int64
          minimum: 1
      - name: delivery_id
        in: query
        description: Filter to a signed delivery identity.
        schema:
          type: string
      - name: correlation_id
        in: query
        description: Filter to the request or dispatch correlation identity.
        schema:
          type: string
      - name: status
        in: query
        description: Filter by terminal status (e.g. "success", "failed").
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionInvocationListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/actions/{action_name}/invoke:
    post:
      operationId: invokeAction
      tags:
      - actions
      summary: Invoke action
      description: Invokes a catalog action through the same job-backed execution surface
        an agent's tool call uses. HTTP and managed platform actions are dispatched to Mobius
        server workers; worker-backed custom actions are dispatched to compatible customer
        workers.
      parameters:
      - $ref: '#/components/parameters/ActionNameParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvokeActionRequest'
            example:
              input:
                channel: '#product'
                text: Deployment finished.
              timeout_seconds: 30
              dry_run: false
      responses:
        '200':
          description: OK — invocation completed synchronously
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionInvocationResult'
              example:
                status: completed
                job_id: job_2m7x9q5v8p3n4r6t
                output:
                  message_ts: '1718461800.000100'
        '202':
          description: Accepted — asynchronous invocation is still active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionInvocationResult'
              example:
                status: active
                job_id: job_2m7x9q5v8p3n4r6t
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/catalog/events:
    get:
      operationId: listCatalogEvents
      tags:
      - catalog
      summary: List events
      description: Returns triggerable event sources for this org, including built-in platform
        sources and connected integration providers. Each source lists its active event types,
        readiness, and any reserved matcher prefixes the authoring UI should recognize.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventCatalogResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/catalog/actions:
    get:
      operationId: listCatalogActions
      tags:
      - catalog
      summary: List actions
      description: 'Returns the full catalog of actions available to this org: org-owned HTTP
        actions and platform-provided integration actions (Slack, GitHub, etc.). The `available`
        flag indicates whether the action can currently be invoked. Custom HTTP actions are
        created and managed on the `/actions` resource.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionCatalogListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/catalog/actions/{action_name}:
    get:
      operationId: getCatalogAction
      tags:
      - catalog
      summary: Get action
      description: Returns availability status, schemas, and metadata for a single catalog
        entry.
      parameters:
      - $ref: '#/components/parameters/ActionNameParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionCatalogEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/catalog/models:
    get:
      operationId: listCatalogModels
      tags:
      - catalog
      summary: List models
      description: Returns assignable agent models grouped by provider. Providers appear only
        when the org has usable credentials, either from BYOK integration state or platform-managed
        configuration.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelCatalogResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/catalog/worker-models:
    get:
      operationId: listCatalogWorkerModels
      tags:
      - catalog
      summary: List worker models
      description: Returns local LLM models currently advertised by online org workers. Each
        item includes the exact `model_route` object to assign to an agent. Matching is exact
        on `provider` and `model`; queues are not part of the standard local LLM path.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerModelCatalogListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/workers/socket:
    get:
      operationId: openWorkerSocket
      tags:
      - jobs
      summary: Open worker WebSocket
      description: Upgrades to the worker WebSocket protocol. Workers authenticate with normal
        org credentials, send `worker.register`, then exchange typed JSON frames for claim,
        heartbeat, report, cancellation, and generation streaming.
      responses:
        '101':
          description: WebSocket upgrade accepted.
        '200':
          description: Placeholder response for OpenAPI tooling; successful clients receive
            a 101 upgrade.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerSocketFrame'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/billing/usage-events:
    get:
      operationId: listBillingUsageEvents
      tags:
      - billing
      x-public: true
      summary: List usage events
      description: 'Returns org-scoped usage evidence rows for credit attribution and burndown
        investigation. By default rows are ordered newest first. Supplying `recorded_after`
        selects the durable incremental contract: the lower bound is inclusive and rows are
        ordered oldest first by `(recorded_at, id)`. Consumers should replay a bounded overlap
        and deduplicate by stable event ID. Aggregate totals cover the complete filtered result
        set before cursor pagination, repeat on every page, and may grow as matching rows
        arrive; incremental mirrors should sum the exact per-event `credit_cost_milli` values
        instead. Cursors are bound to their ordering mode, so every incremental page must
        resend `recorded_after`. Filters never broaden beyond the authenticated organization.'
      parameters:
      - name: period_start
        in: query
        required: false
        description: Filter to usage events in this billing period.
        schema:
          type: string
          format: date-time
      - name: recorded_after
        in: query
        required: false
        description: Inclusive lower bound on `recorded_at`. When present, results and cursors
          use chronological `(recorded_at, id)` order for durable incremental mirroring.
        schema:
          type: string
          format: date-time
      - name: counter
        in: query
        required: false
        description: Filter to one usage counter.
        schema:
          type: string
      - name: source_type
        in: query
        required: false
        description: Filter to one usage source type.
        schema:
          type: string
      - name: source_id
        in: query
        required: false
        description: Filter to one source identifier.
        schema:
          type: string
      - name: job_id
        in: query
        required: false
        description: Filter to usage attributed to one job.
        schema:
          type: string
      - name: api_key_id
        in: query
        required: false
        description: Filter to usage recorded for one API key.
        schema:
          type: string
      - $ref: '#/components/parameters/LimitParam'
      - $ref: '#/components/parameters/CursorParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingUsageEventListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/permissions:
    get:
      operationId: listOrgPermissions
      tags:
      - permissions
      summary: List org permissions
      description: Returns the canonical permission definitions, role presets, and action
        execution permission groups available when building org roles. Use this endpoint to
        source the permission IDs accepted by the role creation and update endpoints.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionCatalogResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/roles:
    get:
      operationId: listRoles
      tags:
      - roles
      summary: List roles
      description: Returns system-defined roles plus custom roles scoped to this org.
      parameters:
      - $ref: '#/components/parameters/LimitParam'
      - $ref: '#/components/parameters/CursorParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createRole
      tags:
      - roles
      summary: Create role
      description: Creates a custom role scoped to the org. Only system-defined roles exist
        at the platform/global tier and are created automatically by the platform.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoleRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
