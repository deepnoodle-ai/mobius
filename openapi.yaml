        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/sessions/{session_id}/turns/{turn_id}/live:
    get:
      operationId: getSessionTurnLive
      tags:
      - sessions
      summary: Get live session turn snapshot
      description: Returns the process-local, live-only transcript preview frames currently
        known for an in-flight turn. This is an ephemeral recovery primitive for SSE reconnects
        and `live_sequence` gaps; it is not a durable event log replay endpoint and may return
        an empty frame list after process handoff or once the durable transcript has caught
        up.
      parameters:
      - $ref: '#/components/parameters/SessionIdParam'
      - $ref: '#/components/parameters/TurnIdParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionLiveSnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/sessions/{session_id}/turns/{turn_id}/cancel:
    post:
      operationId: cancelTurn
      tags:
      - sessions
      summary: Cancel a session turn
      description: |-
        Idempotently cancels one dispatcher-owned agent turn in the session. The first request that wins marks the turn terminal, retires its pending waits, interactions, nudges, and jobs, and emits `turn.cancelled` once. Later requests return the current terminal row without another lifecycle transition. Cancellation is cooperative: already-performed model, tool, and external effects are not rolled back. Committed transcript rows are retained, while live-only uncommitted preview content is discarded.

        A cancelled turn cannot be resumed. Reusing its invocation idempotency key returns the same cancelled turn; retrying the task requires a new invocation and may repeat external effects. Stream cursors resume observation only. Requires the `mobius.resource.use` permission (or the agent's own backing principal).
      parameters:
      - $ref: '#/components/parameters/SessionIdParam'
      - $ref: '#/components/parameters/TurnIdParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentTurn'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/sessions/{session_id}/transcript:
    get:
      operationId: getSessionTranscript
      tags:
      - sessions
      summary: Get the live transcript snapshot
      description: Returns the transcript tail and authoritative turn state consumed by SessionTranscriptReducer.
        Without a cursor this is a bootstrap tail; when older rows exist, next_page_token
        walks backward through them while resume_cursor remains fixed at the bootstrap head.
        With cursor it incrementally drains a fixed upper cut. In either mode, continue with
        next_page_token until has_more is false.
      parameters:
      - $ref: '#/components/parameters/SessionIdParam'
      - name: cursor
        in: query
        schema:
          type: string
        description: Opaque resume_cursor from a prior snapshot or stream.
      - name: page_token
        in: query
        schema:
          type: string
        description: Opaque fixed-cut continuation returned as next_page_token.
      - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Transcript snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionTranscriptSnapshot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/sessions/{session_id}/transcript/stream:
    get:
      operationId: streamSessionTranscript
      tags:
      - sessions
      summary: Stream authoritative transcript upserts
      description: Resumable SSE view of the transcript snapshot. The explicit cursor query
        parameter takes precedence over Last-Event-ID. State-frame ids are delivered watermarks
        and never regress.
      parameters:
      - $ref: '#/components/parameters/SessionIdParam'
      - name: cursor
        in: query
        schema:
          type: string
        description: Opaque resume cursor.
      - name: Last-Event-ID
        in: header
        schema:
          type: string
        description: Opaque resume cursor from the last delivered state frame.
      responses:
        '200':
          description: Authoritative transcript SSE stream.
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/SessionTranscriptFrame'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/sessions/{session_id}/stream:
    get:
      operationId: streamSession
      tags:
      - sessions
      summary: Stream a session's activity
      description: |-
        Opens a long-lived Server-Sent Events stream that is a live view over the session's one durable conversation log (its transcript messages). It is the single streaming surface for a session.

        The transcript messages with `sequence > after_sequence` are replayed first — covering any turn that committed between the client's last read and the stream open — then the in-flight turn is tailed live. Each committed message is framed as `event: <type>` (`user.message`, `agent.message`, or the non-terminal `compaction.created`) with a `data:` line carrying the message payload and an `id:` line carrying the message `sequence`. The cursor is therefore the same `sequence` the messages API uses: reconnect with `?after_sequence=N` (or the `Last-Event-ID` header) to resume exactly where you left off, with no separate event cursor.

        The stream follows the session's active turn and closes once the session is idle — no queued or running turn — after the active turn's committed rows and a terminal `turn.completed` / `turn.failed` / `turn.cancelled` frame have been delivered. A later turn is a new activity tail; open a new stream for it or use the streaming `POST .../turns` response.

        Live-only `generation.delta`, `session.message.preview`, `session.resync`, `tool.call`, and `tool.result` frames carry no `id:`, are interleaved best-effort for low-latency rendering, and are never persisted or replayed — on reconnect the durable message frames are the source of truth.
      parameters:
      - $ref: '#/components/parameters/SessionIdParam'
      - $ref: '#/components/parameters/AfterSequenceParam'
      - $ref: '#/components/parameters/LastEventIDParam'
      responses:
        '200':
          description: 'A Server-Sent Events stream of session activity. Each frame is `event:
            <event type>` followed by a `data:` line carrying the JSON-encoded payload. Durable
            message frames carry an `id:` line with the message `sequence` for `Last-Event-ID`
            resume; live-only frames (`generation.delta`, `session.message.preview`, `session.resync`,
            `tool.call`, `tool.result`) do not carry `id:` and cannot be replayed.'
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/SessionStreamFrame'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/sessions/{session_id}/cancel:
    post:
      operationId: cancelSession
      tags:
      - sessions
      summary: Cancel the session's active turn
      description: Idempotently cancels active dispatcher-owned turns in the session and retires
        their pending waits, interactions, nudges, and jobs. Each turn's terminal `turn.cancelled`
        transition is emitted once. Cancellation is cooperative and does not roll back effects
        that already happened. Committed transcript rows remain; live-only preview content
        is discarded. Cancelled turns cannot be resumed, and stream cursors resume observation
        only. Returns the updated session. Requires the `mobius.resource.use` permission (or
        the agent's own backing principal).
      parameters:
      - $ref: '#/components/parameters/SessionIdParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/sessions/{session_id}/compact:
    post:
      operationId: compactSession
      tags:
      - sessions
      summary: Compact the session transcript now
      description: Compact messages appended since the last compaction immediately, regardless
        of the configured strategy or token threshold. This is a no-op when there is nothing
        new to compact. Returns the updated session.
      parameters:
      - $ref: '#/components/parameters/SessionIdParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/routines:
    get:
      operationId: listRoutines
      tags:
      - routines
      summary: List reachable routines
      description: 'Returns the routines the caller can reach, most recently created first.
        Pagination is keyset on (created_at, id): pass next_cursor back as cursor, and keep
        going while has_more is true. A page may hold fewer than limit rows once unreachable
        routines are dropped; has_more, not the row count, says whether more remain.'
      parameters:
      - name: owner_id
        in: query
        schema:
          type: string
      - name: agent_id
        in: query
        schema:
          type: string
      - name: origin_session_id
        in: query
        description: Filter to routines proposed in one conversation. Provenance only; it
          is not where they run.
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - name: cursor
        in: query
        schema:
          type: string
        description: next_cursor from the previous page.
      responses:
        '200':
          description: Reachable routines.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutineList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createRoutine
      tags:
      - routines
      summary: Create a routine owned by the authenticated human
      description: Creates scheduled work in an existing reachable conversation for the authenticated
        human owner.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoutineCreateRequest'
      responses:
        '201':
          description: Routine created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Routine'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/routines/occurrences:
    get:
      operationId: listRoutineOccurrences
      tags:
      - routines
      summary: List the occurrence ledger
      description: 'Returns durable occurrence outcomes across every routine the caller can
        reach, most recently scheduled first. Set routine_id to narrow it to one routine.
        Pagination is keyset on (scheduled_at, id): pass next_cursor back as cursor, and keep
        going while has_more is true. A page may hold fewer than limit rows once unreachable
        routines are dropped; has_more, not the row count, says whether more remain.'
      parameters:
      - name: routine_id
        in: query
        schema:
          type: string
        description: Narrow to one routine. This is what the deleted nested route was.
      - name: owner_id
        in: query
        schema:
          type: string
        description: Narrow to routines one person is the custodian of. Team-custody routines
          have no owner and never match.
      - name: status
        in: query
        schema:
          type: array
          items:
            type: string
            enum:
            - pending
            - admitted
            - completed
            - failed
            - skipped
            - missed
        explode: false
        style: form
        description: Narrow to these occurrence statuses.
      - name: since
        in: query
        schema:
          type: string
          format: date-time
        description: Only occurrences scheduled at or after this time.
      - name: until
        in: query
        schema:
          type: string
          format: date-time
        description: Only occurrences scheduled before this time.
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - name: cursor
        in: query
        schema:
          type: string
        description: next_cursor from the previous page.
      responses:
        '200':
          description: Occurrences.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutineOccurrenceList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/routines/{routine_id}:
    get:
      operationId: getRoutine
      tags:
      - routines
      summary: Get a routine
      description: Returns one reachable routine and its current schedule and lifecycle state.
      parameters:
      - $ref: '#/components/parameters/RoutineID'
      responses:
        '200':
          description: Routine.
