      - agents
      summary: List agent members
      description: |-
        Returns the audience of a `restricted` or `private` agent.

        The member list itself is returned only to callers who may manage the agent — an org admin, or the agent's creator while they remain a member. Every other member sees `count` alone, which is enough to answer "who else can see this" without turning the audience into a directory. An `organization` agent has no members and returns zero.
      parameters:
      - $ref: '#/components/parameters/IDParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentMemberListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: addAgentMembers
      tags:
      - agents
      summary: Add agent members
      description: |-
        Adds principals to a `restricted` agent's audience. Idempotent: adding a principal who is already a member changes nothing.

        A new member reads the ENTIRE shared layer, including everything promoted before they joined. Adding a second member to a `private` agent is refused — share it by changing its visibility to `restricted`. An agent parked `inactive` for having no audience reactivates when a member is added.
      parameters:
      - $ref: '#/components/parameters/IDParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddAgentMembersRequest'
      responses:
        '200':
          description: The audience after the add.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentMemberListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    put:
      operationId: replaceAgentMembers
      tags:
      - agents
      summary: Replace agent members
      description: Sets the audience to exactly the supplied principals. A `private` agent
        takes exactly one; a `restricted` agent at least one.
      parameters:
      - $ref: '#/components/parameters/IDParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceAgentMembersRequest'
      responses:
        '200':
          description: The audience after the replacement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentMemberListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/agents/{resource_id}/members/{principal_id}:
    delete:
      operationId: removeAgentMember
      tags:
      - agents
      summary: Remove an agent member
      description: |-
        Drops one principal from the audience. They lose reach on their next request.

        Nothing they wrote is deleted: their private partition on this agent is retained and readable only by org admins, and anything they promoted stays, because promotion made it the group's. Removing the LAST member parks the agent as `inactive`, visible to org admins who may reassign or delete it — it is never silently reopened to the org.
      parameters:
      - $ref: '#/components/parameters/IDParam'
      - name: principal_id
        in: path
        required: true
        description: The principal to remove from the audience.
        schema:
          type: string
      responses:
        '204':
          description: Removed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/agents/{resource_id}/visibility-impact:
