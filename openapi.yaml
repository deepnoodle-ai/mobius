  /v1/interactions/{resource_id}/respond:
    post:
      operationId: respondToInteraction
      tags:
      - interactions
      summary: Respond to interaction
      description: |-
        Canonical response endpoint for every interaction kind. `action` defaults to `submit`; lifecycle operations beyond submit are not part of the launch model.

        The request body is intentionally the same envelope for every kind: `action`, `value`, and `comment`. Kind-specific behavior is selected from the interaction itself, not from separate request-body shapes.
      parameters:
      - $ref: '#/components/parameters/IDParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RespondToInteractionRequest'
            examples:
              approval:
                summary: Approve interaction
                value:
                  action: submit
                  value: true
                  comment: Approved for publication.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Interaction'
              example:
                id: iact_6x2m8q5v9p3n7r4t
                kind: request_approval
                status: completed
                title: Approve publishing the April billing report?
                context:
                  report_id: rpt_2026_04
                  amount_usd: 12850
                spec:
                  mode: confirm
                  default_confirmed: false
                target_user_ids:
                - user_2f9s3k4m5n6p7q8r
                owner:
                  kind: person
                  id: user_2f9s3k4m5n6p7q8r
                visibility: private
                posture: only_you
                responder:
                  user_id: user_2f9s3k4m5n6p7q8r
                resolving_response_id: iresp_3v7q2m9x5p8n4r6t
                responses:
                - id: iresp_3v7q2m9x5p8n4r6t
                  interaction_id: iact_6x2m8q5v9p3n7r4t
                  response_kind: response
                  state: submitted
                  responder_user_id: user_2f9s3k4m5n6p7q8r
                  value: true
                  comment: Approved for publication.
                  responded_at: '2026-04-24T14:42:00Z'
                  created_at: '2026-04-24T14:42:00Z'
                  updated_at: '2026-04-24T14:42:00Z'
                outcome: true
                resolved_by: any_of
                expires_at: '2026-04-25T14:30:00Z'
                completed_at: '2026-04-24T14:42:00Z'
                created_at: '2026-04-24T14:30:00Z'
                updated_at: '2026-04-24T14:42:00Z'
                require_all: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/interactions/{resource_id}/review:
    post:
      operationId: reviewInteraction
      tags:
      - interactions
      summary: Accept or send back submitted work
      description: |-
        Records an acceptance decision on an interaction in `in_review`.

        `accept` resolves the interaction with the outcome that was submitted and resumes any waiting consumer — for a reviewed interaction, this is the moment the workflow moves on. `request_changes` returns the interaction to `pending` under a new review round with the reviewer's feedback attached, and the consumer keeps waiting; a send-back is not a workflow outcome. The retracted submission stays in `responses` for audit, tagged with the round it belonged to.

        Only a principal named by `resolution_policy.review.reviewer_user_ids` may call this, or the interaction's creator when that list is empty. Assignees cannot accept their own work.
      parameters:
      - $ref: '#/components/parameters/IDParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewInteractionRequest'
            examples:
              accept:
                summary: Accept submitted work
                value:
                  action: accept
                  comment: Findings check out; ticket closed.
              request_changes:
                summary: Send work back
                value:
                  action: request_changes
                  comment: The import log for 2026-04-19 is missing — please attach it.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Interaction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/interactions/{resource_id}/cancel:
    post:
      operationId: cancelInteraction
      tags:
      - interactions
      summary: Cancel open interaction
      description: 'Cancels an open interaction — `pending` or `in_review` — recording who
        cancelled and an optional reason. Work awaiting acceptance is cancellable too: a requester
        who no longer needs the result should not have to accept it first. Whatever was waiting
        on the interaction is told it was cancelled so it can route to a fallback. Only humans
        may cancel by default — agents must request cancellation through an interaction.'
      parameters:
      - $ref: '#/components/parameters/IDParam'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelInteractionRequest'
            example:
              reason: Superseded by a revised approval request.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Interaction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/agents:
    post:
      operationId: createAgent
      tags:
      - agents
      summary: Create agent
      description: |-
        Creates an agent. An agent IS a principal (principals.kind = agent): its backing identity row is created atomically with the agent — there is no separate machine-identity side record. The agent principal is for identity, ownership, and attribution; an agent's tools come from its own `tool_selectors`, not from roles.

        By default (`if_exists: error`, the default), a duplicate `name` or `external_ref` returns 409. Set `if_exists: adopt` together with `external_ref` to make the call safely retryable: when a live agent already carries that `external_ref`, it is returned unchanged with `200` instead of erroring — mutable fields are ignored, since no write happens. `external_ref` is required to use `adopt`; omitting it returns 400. A soft-deleted agent still owns its `external_ref`: it is never resurrected and never replaced, so a match against a deleted agent returns 409 even with `adopt`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentRequest'
            example:
              name: PR reviewer
              description: Reviews pull requests for risky changes.
              color: teal
              model: claude-sonnet-4-6
              tool_presentation: flat
              tags:
                owner: product
      responses:
        '200':
          description: 'The existing agent, adopted by `external_ref` (`if_exists: adopt`).
            No fields were written.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
              example:
                id: agent_5n8p2q7m4x9r3v6t
                principal_id: agent_5n8p2q7m4x9r3v6t
                name: PR reviewer
                description: Reviews pull requests for risky changes.
                color: teal
                model: claude-sonnet-4-6
                tool_presentation: flat
                memory_enabled: true
                status: active
                tags:
                  owner: product
                owner:
                  kind: person
                  id: user_2f9s3k4m5n6p7q8r
                visibility: private
                posture: only_you
                created_by: user_2f9s3k4m5n6p7q8r
                updated_by: user_2f9s3k4m5n6p7q8r
                created_at: '2026-06-15T14:30:00Z'
                updated_at: '2026-06-15T14:30:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    get:
      operationId: listAgents
      tags:
      - agents
      summary: List agents
      description: Returns active and inactive agents with computed presence. Deleted agents
        are excluded. Filter by exact name or principal_id to resolve a configured agent without
        copying its Mobius ID into application state. Follow `next_cursor` while `has_more`
        is true to enumerate every match.
      parameters:
      - name: name
        in: query
        description: Filter to the org-unique agent with this exact name.
        schema:
          type: string
      - name: principal_id
        in: query
        description: Filter to the agent backed by this principal.
        schema:
          type: string
      - name: status
        in: query
        description: Filter by administrative status (active/inactive), independent of presence.
        schema:
          $ref: '#/components/schemas/AgentStatus'
      - $ref: '#/components/parameters/CursorParam'
      - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/agents/{resource_id}:
    get:
      operationId: getAgent
      tags:
