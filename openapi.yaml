        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/agents/{resource_id}/memory:
    get:
      operationId: getAgentMemory
      tags:
      - agents
      summary: Get agent memory
      description: 'Returns a summary of the agent''s private memory: how many entries it
        holds, a breakdown by kind, and when it last changed. Each agent has its own durable
        memory; only that agent reads or writes it during runs, but org members can observe
        and edit it here.'
      parameters:
      - $ref: '#/components/parameters/IDParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentMemory'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/agents/{resource_id}/memory/entries:
    get:
      operationId: listAgentMemoryEntries
      tags:
      - agents
      summary: List agent memory entries
      description: Lists durable entries across the agent's shared and user-private memory
        partitions. Pass `query` to search over keys, kinds, summaries, and content; choose
        keyword, semantic, or hybrid ranking with `search_mode`; and use `kind` to filter
        to one kind. With no non-blank `query`, this is always a normal browse/list operation
        and `search_mode` is ignored. Returns an empty page when the agent has no memory yet.
      parameters:
      - $ref: '#/components/parameters/IDParam'
      - name: query
        in: query
        description: Optional search over entry keys, kinds, summaries, and content. Omit
          to list.
        schema:
          type: string
      - name: search_mode
        in: query
        description: Search ranking mode for a non-blank `query`. Omit for backwards-compatible
          keyword search. Semantic and hybrid search can return `503 memory_semantic_search_unavailable`
          when the embedding or search-index service is unavailable; callers may retry or
          fall back to `keyword`.
        schema:
          $ref: '#/components/schemas/MemorySearchMode'
      - name: kind
        in: query
        description: Optional filter to a single memory kind.
        schema:
          $ref: '#/components/schemas/MemoryKind'
      - $ref: '#/components/parameters/CursorParam'
      - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentMemoryEntryListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/agents/{resource_id}/memory/changes:
    get:
      operationId: listAgentMemoryChanges
      tags:
      - agents
      summary: List agent memory changes
      description: Returns the content-free, append-only change feed for this agent's shared
        and user-private memory partitions. Consumers use the opaque cursor to resume after
        the last observed mutation. If the cursor has expired, relist current entries and
        start a new feed traversal without `after`.
      parameters:
      - $ref: '#/components/parameters/IDParam'
      - name: after
        in: query
        description: Opaque cursor returned as `next_cursor` by the previous response. Omit
          on the first request to read retained changes oldest-first. When no retained changes
          exist, the empty response still returns a stable bootstrap cursor that observes
          future mutations.
        schema:
          type: string
      - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentMemoryChangeListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          description: The supplied change cursor is older than retained history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/agents/{resource_id}/memory/entries/{memory_key}:
    put:
      operationId: saveAgentMemoryEntry
      tags:
      - agents
      summary: Save memory entry
      description: Saves the memory entry identified by `memory_key` in the requested partition,
        creating it when it does not exist. Omit `user_id` to write shared memory. A non-empty
        `user_id` must identify a current human member of the organization. Runtime user turns
        always write their private partition.
      parameters:
      - $ref: '#/components/parameters/IDParam'
      - $ref: '#/components/parameters/MemoryKeyParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveAgentMemoryEntryRequest'
            example:
              content: The production database runs in us-east-1.
              summary: Production database region
              kind: fact
              importance: 80
              user_id: user_2f9s3k4m5n6p7q8r
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentMemoryEntry'
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentMemoryEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      operationId: deleteAgentMemoryEntry
      tags:
      - agents
      summary: Delete a memory entry
      description: 'Deletes the memory entry identified by `memory_key` from the requested
        partition. Omit `user_id` to target shared memory. Idempotent: succeeds even if no
        such entry exists.'
      parameters:
      - $ref: '#/components/parameters/IDParam'
      - $ref: '#/components/parameters/MemoryKeyParam'
      - $ref: '#/components/parameters/MemoryUserIDParam'
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/agents/{resource_id}/memory/entries/{memory_key}/promotion:
    post:
      operationId: promoteAgentMemoryEntry
      tags:
      - agents
      summary: Promote a memory entry to the shared layer
      description: |-
        Copies one entry from a private partition into the same agent's shared layer, where everyone who can reach the agent reads it. The private entry stays where it was.

        This is the only path from a person's private memory into the shared layer: the model has no tool that writes it during a human-initiated turn, so nothing you tell your assistant becomes the team's by accident. Performed by the partition's owner or by an org admin. The resulting entry carries a change row with reason `promoted` and the acting principal, and the act is reversible with `DELETE` on the same path.

        A key already present in the shared layer is a `409` unless `replace` is set; the replacement is recorded as a versioned update.
      parameters:
      - $ref: '#/components/parameters/IDParam'
      - $ref: '#/components/parameters/MemoryKeyParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromoteAgentMemoryEntryRequest'
            example:
              user_id: user_2f9s3k4m5n6p7q8r
      responses:
        '200':
          description: The promoted shared entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentMemoryEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: revertAgentMemoryPromotion
      tags:
      - agents
      summary: Reverse a promotion
      description: Removes a promoted entry from the shared layer. It touches nothing in the
        private partition it was copied from, and it is its own change row (reason `promotion_reverted`),
        so the ledger records both directions of the act. Available to the promoter and to
        org admins. Idempotent.
      parameters:
      - $ref: '#/components/parameters/IDParam'
      - $ref: '#/components/parameters/MemoryKeyParam'
      responses:
        '204':
          description: Reverted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/agents/invoke:
    post:
      operationId: invokeAgent
      tags:
      - sessions
      summary: Invoke an agent
      description: |-
        One compound runtime call for hosted apps: it resolves an agent, resolves or creates a session by `session_key`, appends the caller's input message, and starts an agent turn — collapsing the create-or-resolve-session plus start-turn sequence into a single retryable request. This is the entry point a product backend (an embedded app, a Slack handler, a Telegram bot) calls per inbound message; the lower-level session and turn APIs remain available for finer control.

        Agents always run from their stored definition. A newly created session may set `session.model_override` to keep that conversation on one model. For a one-shot timeout override, send `operation.timeout_seconds` with a value of at least one; it applies only to the newly admitted turn.

        By default it returns `202 Accepted` immediately with a durable `after_sequence` stream cursor; the turn keeps running even if the caller disconnects. When the request sets `Accept: text/event-stream`, the response is `200 OK` and the turn's activity is streamed inline on the same connection, identical to the `POST /v1/sessions/{session_id}/turns` stream. A repeated call with the same `input.idempotency_key` resolves the same session and returns the existing invocation without restarting it or writing new input, so a webhook handler can acknowledge fast and retry safely. Requires the `mobius.resource.use` permission (or the agent's own backing principal).

        Only one direct invocation may be nonterminal in a session. A distinct input while a turn is queued, running, or waiting returns `409` with `error.code = session_turn_active` and `error.details = {turn_id, status}` before the new input is appended. Use the session nudge endpoint explicitly to steer a running or waiting turn; Mobius never converts a second send into a nudge implicitly.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvokeAgentRequest'
            example:
              agent_ref:
                id: agent_5n8p2q7m4x9r3v6t
              session:
                mode: continue_or_create
                session_key: app:acct_123:user_456:slack:support:thread_789
                title: Support in Slack
                model_override: claude-sonnet-4-6
                metadata:
                  account_id: acct_123
                  user_id: user_456
              operation:
                timeout_seconds: 120
              input:
                content:
                - type: text
                  text: Can you summarize my open tickets?
                idempotency_key: slack:evt_0a1b2c3d
              channel_context:
                provider: slack
                workspace_id: T123
                channel_id: C123
                thread_id: '1700000000.123'
      responses:
        '200':
          description: 'Server-sent event stream of the turn''s activity, returned when the
            request sets `Accept: text/event-stream`. Framing matches `GET /v1/sessions/{session_id}/stream`.'
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/SessionStreamFrame'
        '202':
          description: The turn was accepted and is running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TurnAck'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: A distinct direct invocation is already queued, running, or waiting.
            The `session_turn_active` error details contain its `turn_id` and `status`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/sessions:
    get:
      operationId: listSessions
      tags:
      - sessions
      summary: List sessions
      description: Returns durable conversation sessions for the org, newest activity first.
        Pass `agent_id` or `agent_name` to scope the list to one agent's remembered conversations.
      parameters:
      - name: agent_id
        in: query
        description: Filter to sessions owned by this agent.
        schema:
          type: string
      - name: agent_name
        in: query
        description: Filter to sessions owned by the org-unique agent with this exact name.
          Mutually exclusive with `agent_id`.
        schema:
          type: string
      - name: session_key
        in: query
        description: Look up the session with this exact routing key — a read-only deterministic
          lookup that avoids a create-or-resolve round trip, returning the one matching session
          or an empty list. Requires exactly one of `agent_id` or `agent_name`, since session
          keys are scoped to an agent.
        schema:
          type: string
      - name: status
        in: query
        description: Filter by session status.
        schema:
          $ref: '#/components/schemas/SessionStatus'
      - name: scope
        in: query
        description: Filter by session scope.
        schema:
          $ref: '#/components/schemas/SessionScope'
      - name: provider
        in: query
        description: Filter messaging sessions by provider metadata, e.g. `slack` or `telegram`.
        schema:
          type: string
      - name: integration_id
        in: query
        description: Filter to sessions created by this integration, e.g. agent sessions started
          from a connected provider.
        schema:
          type: string
      - name: since
        in: query
        description: Only include sessions with activity after this timestamp.
        schema:
          type: string
          format: date-time
      - $ref: '#/components/parameters/CursorParam'
      - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: createSession
      tags:
      - sessions
      summary: Create or resolve a session
      description: 'Resolves a durable conversation session for an agent by policy and returns
        it. With `mode: continue_or_create` (the default) an existing session for the given
        `session_key` is returned, or a new one is created; `mode: new` always creates a fresh
        session; `mode: continue` resolves an existing session and fails if none exists. This
        is the entry point an application calls before sending input events.'
      requestBody:
        required: true
