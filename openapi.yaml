        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableRow'
              example:
                id: row_5p9x2q7m4n8v3r6t
                table_id: table_2x7q5m9v3p8r4n6t
                data:
                  pull_request_url: https://github.com/deepnoodle-ai/mobius-cloud/pull/123
                  severity: medium
                  summary: Add a regression test for the error path.
                version: 1
                created_at: '2026-06-15T14:30:00Z'
                updated_at: '2026-06-15T14:30:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateTableRow
      tags:
      - tables
      summary: Update row
      description: Update one row by validating the supplied fields and preserving fields
        not included in the request. If `version` is provided, it must match the current row
        version.
      parameters:
      - $ref: '#/components/parameters/TableIDParam'
      - name: row_id
        in: path
        required: true
        description: Table row ID.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRowRequest'
            example:
              data:
                severity: high
              version: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableRow'
              example:
                id: row_5p9x2q7m4n8v3r6t
                table_id: table_2x7q5m9v3p8r4n6t
                data:
                  pull_request_url: https://github.com/deepnoodle-ai/mobius-cloud/pull/123
                  severity: high
                  summary: Add a regression test for the error path.
                version: 2
                created_at: '2026-06-15T14:30:00Z'
                updated_at: '2026-06-15T14:36:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
