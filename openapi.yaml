                $ref: '#/components/schemas/SessionNudgeAck'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/sessions/{session_id}/nudges/{nudge_id}:
    get:
      operationId: getSessionNudge
      tags:
      - sessions
      summary: Get a session nudge
      description: Returns one durable nudge queue entry.
      parameters:
      - $ref: '#/components/parameters/SessionIdParam'
      - $ref: '#/components/parameters/NudgeIdParam'
      responses:
