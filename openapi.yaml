      summary: Set blueprint resource protection
      description: Protects or unprotects every resource definition managed by one named blueprint.
        Protected resources can still be changed by Blueprint Apply or removed by deleting
        the blueprint, but ordinary resource update and delete operations return `blueprint_resource_protected`.
      parameters:
      - name: blueprint_key
        in: path
        required: true
