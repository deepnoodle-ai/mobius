          description: Input parameters passed to the action.
        output_summary:
          type: object
          additionalProperties: true
          description: Truncated or summarized action output for audit purposes.
        status:
          type: string
          description: Terminal invocation status ("success", "failed", etc.).
        retry_count:
          type: integer
          description: Number of retry attempts before this terminal status was reached.
        started_at:
          type: string
          format: date-time
          description: Timestamp when this invocation started.
        finished_at:
          type: string
          format: date-time
          description: Timestamp when this invocation completed.
        error_type:
          type: string
          description: Machine-readable error classification when status is "failed".
        error_message:
          type: string
          description: Human-readable error detail when status is "failed".
    ActionInvocationListResponse:
      type: object
      additionalProperties: false
      description: Paginated list of action invocation telemetry records.
      required:
      - items
      - has_more
      properties:
        items:
          type: array
          description: The list of results for this page.
          items:
            $ref: '#/components/schemas/ActionInvocationEntry'
        next_cursor:
          type: string
          description: Opaque cursor to pass as `cursor` on the next request. Absent when
            `has_more` is false.
        has_more:
          type: boolean
          description: Whether additional pages are available.
    EventCatalogResponse:
      type: object
      additionalProperties: false
      required:
      - items
      - reserved_prefixes
      description: The triggerable event catalog available to an org.
      properties:
        items:
          type: array
          description: Event sources available for authoring triggers.
          items:
            $ref: '#/components/schemas/EventCatalogSource'
        reserved_prefixes:
          type: array
          description: Platform namespaces that are recognized but are not triggerable event
            sources. Authoring UIs use these to distinguish a recognized-but-unsupported matcher
            prefix from a wholly unknown one.
          items:
            $ref: '#/components/schemas/EventCatalogReservedPrefix'
    EventCatalogSource:
      type: object
      additionalProperties: false
      required:
      - prefix
      - kind
      - readiness
      - display_name
      - event_types
      description: One event source rooted at a top-level dotted prefix. Integration sources
        are open-set (any `<prefix>.<resource>.<event>` matches); `event_types` lists the
        currently-active, documented members.
      properties:
        prefix:
          type: string
          description: Top-level dotted segment that names the source (`table`, `github`).
        kind:
          type: string
          enum:
          - integration
          - capability
          description: '`integration` for provider event sources; `capability` for built-in
            Mobius platform event sources.'
        display_name:
          type: string
          description: Human-readable source name for UI pickers.
        description:
          type: string
          description: Short explanation of what emits events under this prefix.
        readiness:
          $ref: '#/components/schemas/CapabilityReadiness'
          description: Whether this source can trigger work now. `capability` sources are
            always `ready`. `integration` sources are `ready` only when the org has an active,
            usable connection for the provider.
        readiness_reason:
          $ref: '#/components/schemas/CapabilityReadinessReason'
          description: Why an `integration` source is `needs_setup`. Omitted when `readiness`
            is `ready` and for `capability` sources.
        event_types:
          type: array
          description: Concrete event types currently documented for this source.
          items:
            $ref: '#/components/schemas/EventCatalogEventType'
    EventCatalogEventType:
      type: object
      additionalProperties: false
      required:
      - name
      description: One concrete event type exposed by an event catalog source.
      properties:
        name:
          type: string
          description: Dotted event-type identifier (`table.row.inserted`, `github.pull_request.opened`).
        description:
          type: string
          description: Human-readable explanation of when this event fires.
        event_schema:
          type: object
          additionalProperties: true
          description: JSON Schema for the normalized event data available to event-trigger
            runs at `${{ event.* }}` and to event conditions/mappings at `event.*`. Absent
            only when the event payload is intentionally open-ended and the provider has not
            registered an authoring schema.
        meta_schema:
          type: object
          additionalProperties: true
          description: JSON Schema for normalized routing metadata available to event-trigger
            runs at `${{ meta.* }}` and to event conditions/mappings at `meta.*`.
    EventCatalogReservedPrefix:
      type: object
      additionalProperties: false
      required:
      - prefix
      - kind
      description: A recognized event namespace that is not itself triggerable.
      properties:
        prefix:
          type: string
          description: Reserved top-level event prefix.
        kind:
          type: string
          enum:
          - capability
          - utility
          description: Whether the prefix names a platform capability or an authoring utility
            namespace.
    ModelCatalogResponse:
      type: object
      additionalProperties: false
      description: Models a platform agent can be assigned in this org, grouped by available
        provider.
      required:
      - default_model
      - items
      properties:
        default_model:
          type: string
          description: Model id assigned when an agent specifies no model.
        items:
          type: array
          description: Available providers in display order. Providers with no configured
            credentials are omitted.
          items:
            $ref: '#/components/schemas/ModelProviderGroup'
        reason:
          type: string
          enum:
          - platform_funding_denied
          - credentials_unavailable
          description: Present when `items` is empty because the request was denied rather
            than because no catalog exists. `platform_funding_denied` means Mobius-managed
            provider credentials are gated by billing or plan state; `credentials_unavailable`
            means no usable provider credentials were available.
    ModelProviderGroup:
      type: object
      additionalProperties: false
      required:
      - provider
      - display_name
      - source
      - models
      description: Available model choices for one provider.
      properties:
        provider:
          type: string
          description: Canonical provider id (`anthropic`, `openai`, `openrouter`, `gemini`,
            `xai`).
        display_name:
          type: string
          description: Human-readable provider label.
        source:
          type: string
          enum:
          - byok
          - platform
          description: Where credentials come from — an org integration (`byok`) or a platform-managed
            key (`platform`).
        models:
          type: array
          description: Models offered by this provider in display order.
          items:
            $ref: '#/components/schemas/ModelOption'
    ModelOption:
      type: object
      additionalProperties: false
      description: One selectable LLM model in the org model catalog.
      required:
      - id
      - provider
      - label
      - context_window_tokens
      properties:
        id:
          type: string
          description: Model id assigned to an agent's `model` field. Some catalog ids, such
            as OpenRouter slugs, include `/`.
        provider:
          type: string
          description: Canonical provider id this model belongs to.
        label:
          type: string
          description: Human-readable model label for UI.
        description:
          type: string
          description: Short guidance about when to use this model.
        context_window_tokens:
          type: integer
          format: int64
          minimum: 1
          description: Maximum input context used to resolve model-relative compaction presets.
        recommended:
          type: boolean
          description: Whether this is the suggested default for its provider.
    WorkerModelCatalogListResponse:
      type: object
      additionalProperties: false
      required:
      - items
      description: Local LLM models advertised by online org workers.
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WorkerModelCatalogItem'
    WorkerModelCatalogItem:
      type: object
      additionalProperties: false
      required:
      - provider
      - model
      - worker_count
      - route
      description: One exact local model route available through online workers.
      properties:
        provider:
          type: string
          description: Worker-advertised provider id, matched exactly by `model_route.provider`.
        model:
          type: string
          description: Worker-advertised model id, matched exactly by `model_route.model`.
        worker_count:
          type: integer
          minimum: 1
          description: Number of online workers currently advertising this exact provider/model
            pair.
        route:
          $ref: '#/components/schemas/WorkerModelRoute'
    WorkerModelRoute:
      type: object
      additionalProperties: false
      required:
      - mode
      - provider
      - model
      description: Assign this route to use a local worker model.
      properties:
        mode:
          type: string
          enum:
          - worker
          description: Model route mode. Worker catalog routes always use `worker`.
        provider:
          type: string
          description: Provider id advertised by the local worker.
        model:
          type: string
          description: Model identifier advertised by the local worker.
    WorkerSocketModelCapability:
      type: object
      additionalProperties: false
      required:
      - provider
      - model
      properties:
        provider:
          type: string
          description: LLM provider identifier, such as `ollama`.
        model:
          type: string
          description: Provider-local model name.
    WorkerSocketFrame:
      oneOf:
      - $ref: '#/components/schemas/WorkerSocketRegisterFrame'
      - $ref: '#/components/schemas/WorkerSocketRegisteredFrame'
      - $ref: '#/components/schemas/WorkerSocketReadyFrame'
      - $ref: '#/components/schemas/WorkerSocketJobsClaimFrame'
      - $ref: '#/components/schemas/WorkerSocketJobsClaimedFrame'
      - $ref: '#/components/schemas/WorkerSocketWorkAvailableFrame'
      - $ref: '#/components/schemas/WorkerSocketJobHeartbeatFrame'
      - $ref: '#/components/schemas/WorkerSocketJobHeartbeatAckFrame'
      - $ref: '#/components/schemas/WorkerSocketJobReportFrame'
      - $ref: '#/components/schemas/WorkerSocketJobReportAckFrame'
      - $ref: '#/components/schemas/WorkerSocketGenerationDeltaFrame'
      - $ref: '#/components/schemas/WorkerSocketGenerationDeltaAckFrame'
      - $ref: '#/components/schemas/WorkerSocketJobCancelFrame'
      - $ref: '#/components/schemas/WorkerSocketWorkerDrainingFrame'
      - $ref: '#/components/schemas/WorkerSocketWorkerDrainingAckFrame'
      - $ref: '#/components/schemas/WorkerSocketWorkerDrainFrame'
      - $ref: '#/components/schemas/WorkerSocketKeepaliveFrame'
      - $ref: '#/components/schemas/WorkerSocketErrorFrame'
      description: Typed JSON frame exchanged over `/workers/socket`. WebSocket traffic is
        not ordinary request/response HTTP, but the frame schemas are included in the public
        OpenAPI contract so SDKs can share a wire format.
    WorkerSocketMessageID:
      type: string
      description: Client-supplied correlation and short-window deduplication key. When present
        on a client frame, the server echoes it on the response frame.
    WorkerSocketLeaseConfig:
      type: object
      additionalProperties: false
      required:
      - lease_duration_seconds
      - heartbeat_cadence_seconds
      properties:
        lease_duration_seconds:
          type: integer
          minimum: 1
          description: Per-job lease duration stamped on claims.
        heartbeat_cadence_seconds:
          type: integer
          minimum: 1
          description: Recommended heartbeat cadence while a job is running.
    WorkerSocketCancelDirective:
      type: object
      additionalProperties: false
      required:
      - job_id
      properties:
        job_id:
          type: string
        reason:
          type: string
        requested_at:
          type: string
          format: date-time
    WorkerSocketProtocolError:
      type: object
      additionalProperties: false
      required:
      - code
      - message
      properties:
        code:
          type: string
          description: Stable protocol error code. `worker_instance_conflict` is emitted when
            a duplicate live `worker_instance_id` registers and should be treated as a terminal
            worker startup failure.
        message:
          type: string
    WorkerSocketRegisterFrame:
      type: object
      additionalProperties: false
      required:
      - type
      - worker_instance_id
      properties:
        type:
          type: string
          enum:
          - worker.register
        message_id:
          $ref: '#/components/schemas/WorkerSocketMessageID'
        worker_instance_id:
          type: string
          description: Stable process identity reported by the worker SDK.
        worker_session_token:
          type: string
          description: Previously issued session token used on reconnect; omitted on first
            register.
        concurrency_limit:
          type: integer
          minimum: 1
          description: Maximum jobs this worker process will hold concurrently.
        available_slots:
          type: integer
          minimum: 0
          description: Currently available capacity. Defaults to `concurrency_limit`.
        name:
          type: string
        version:
          type: string
        environment_id:
          type: string
          description: Environment this worker is running inside, when the worker was started
            by Mobius in a Sprite or other managed environment.
        capabilities:
          type: array
          items:
            type: string
          description: Coarse capability labels reserved for future routing.
        queues:
          type: array
          items:
            type: string
          description: Queue names this worker can claim. Empty means all org queues.
        action_names:
          type: array
          items:
            type: string
          description: Action names this worker can execute. Empty means every locally registered
            action.
        models:
          type: array
          items:
            $ref: '#/components/schemas/WorkerSocketModelCapability'
          description: Provider/model pairs this worker can generate with.
    WorkerSocketRegisteredFrame:
      type: object
      additionalProperties: false
      required:
      - type
      - worker_session_token
      - lease
      properties:
        type:
          type: string
          enum:
          - worker.registered
        message_id:
          $ref: '#/components/schemas/WorkerSocketMessageID'
        worker_session_token:
          type: string
          description: Server-issued per-session token to reuse after reconnects.
        lease:
          $ref: '#/components/schemas/WorkerSocketLeaseConfig'
    WorkerSocketReadyFrame:
      type: object
      additionalProperties: false
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - worker.ready
        message_id:
          $ref: '#/components/schemas/WorkerSocketMessageID'
        available_slots:
          type: integer
          minimum: 0
        queues:
          type: array
          items:
            type: string
        action_names:
          type: array
          items:
            type: string
        models:
          type: array
          items:
            $ref: '#/components/schemas/WorkerSocketModelCapability'
    WorkerSocketJobsClaimFrame:
      type: object
      additionalProperties: false
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - jobs.claim
        message_id:
          $ref: '#/components/schemas/WorkerSocketMessageID'
        available_slots:
          type: integer
          minimum: 0
        queues:
          type: array
          items:
            type: string
        action_names:
          type: array
          items:
            type: string
        models:
          type: array
          items:
            $ref: '#/components/schemas/WorkerSocketModelCapability'
    WorkerSocketClaimedJob:
      type: object
      additionalProperties: false
      required:
      - id
      - kind
      - origin
      - executor_kind
      - queue
      - spec
      - lease_token
      - claim_attempt
      - lease_duration_seconds
      - heartbeat_cadence_seconds
      properties:
        id:
          type: string
          description: Job ID.
        kind:
          type: string
          enum:
          - action_execution
          - llm_generation
        origin:
          type: string
          enum:
          - loop_action_step
          - agent_tool_call
          - agent_llm_call
          - conversation_tool_call
          - conversation_llm_call
          - direct_action_invoke
          - server_internal
        executor_kind:
          type: string
          enum:
          - customer_worker
          - server_worker
        queue:
          type: string
        action_name:
          type: string
          description: Present for `action_execution` jobs.
        environment_id:
          type: string
          description: Present when the job is pinned to a managed environment worker.
        provider:
          type: string
          description: Present for `llm_generation` jobs.
        model:
          type: string
          description: Present for `llm_generation` jobs.
        agent_turn_id:
          type: string
        session_id:
          type: string
        tool_call_id:
          type: string
        spec:
          type: object
          additionalProperties: true
          description: Worker-specific action or generation payload. For `kind=llm_generation`,
            this object follows `WorkerSocketLLMGenerationSpec`.
        lease_token:
          type: string
          description: Opaque per-job lease fence returned by claim.
        claim_attempt:
          type: integer
          minimum: 1
        lease_duration_seconds:
          type: integer
          minimum: 1
        heartbeat_cadence_seconds:
          type: integer
          minimum: 1
    WorkerSocketJobsClaimedFrame:
      type: object
      additionalProperties: false
      required:
      - type
      - jobs
      properties:
        type:
          type: string
          enum:
          - jobs.claimed
        message_id:
          $ref: '#/components/schemas/WorkerSocketMessageID'
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/WorkerSocketClaimedJob'
    WorkerSocketWorkAvailableFrame:
      type: object
      additionalProperties: false
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - work.available
    WorkerSocketJobHeartbeatFrame:
      type: object
      additionalProperties: false
      required:
      - type
      - job_id
      - lease_token
      properties:
        type:
          type: string
          enum:
          - job.heartbeat
        message_id:
          $ref: '#/components/schemas/WorkerSocketMessageID'
        job_id:
          type: string
        lease_token:
          type: string
          description: Opaque per-job lease fence returned by claim.
    WorkerSocketJobHeartbeatAckFrame:
      type: object
      additionalProperties: false
      required:
      - type
      - job_id
      properties:
        type:
          type: string
          enum:
          - job.heartbeat.ack
        message_id:
          $ref: '#/components/schemas/WorkerSocketMessageID'
        job_id:
          type: string
        cancel:
          $ref: '#/components/schemas/WorkerSocketCancelDirective'
    WorkerSocketJobReportFrame:
      type: object
      additionalProperties: false
      required:
      - type
      - job_id
      - lease_token
      properties:
        type:
          type: string
          enum:
          - job.report
        message_id:
          $ref: '#/components/schemas/WorkerSocketMessageID'
        job_id:
          type: string
        lease_token:
          type: string
          description: Opaque per-job lease fence returned by claim.
        status:
          type: string
          enum:
          - completed
          - failed
          - cancelled
          default: completed
        result:
          type: object
          additionalProperties: true
          description: Terminal result payload. For `llm_generation` jobs, this object must
            follow `WorkerSocketLLMGenerationResult`; plain text fallback results are not
            accepted.
        error_type:
          type: string
        error_message:
          type: string
    WorkerSocketJobReportAckFrame:
      type: object
      additionalProperties: false
      required:
      - type
      - job_id
      properties:
        type:
          type: string
          enum:
          - job.report.ack
        message_id:
          $ref: '#/components/schemas/WorkerSocketMessageID'
        job_id:
          type: string
        duplicate:
          type: boolean
          description: True when an identical terminal report was already accepted for this
            lease.
    WorkerSocketGenerationDeltaFrame:
      type: object
      additionalProperties: false
      required:
      - type
      - job_id
      - lease_token
      - sequence
      - delta
      properties:
        type:
          type: string
          enum:
          - generation.delta
        message_id:
          $ref: '#/components/schemas/WorkerSocketMessageID'
        job_id:
          type: string
        lease_token:
          type: string
          description: Opaque per-job lease fence returned by claim.
        sequence:
          type: integer
          format: int64
          minimum: 0
          description: Worker-local monotonically increasing sequence for this generation.
        delta:
          type: object
          additionalProperties: true
          description: Provider-neutral streaming delta payload.
    WorkerSocketGenerationDeltaAckFrame:
      type: object
      additionalProperties: false
      required:
      - type
      - job_id
      - received_sequence
      properties:
        type:
          type: string
          enum:
          - generation.delta.ack
        message_id:
          $ref: '#/components/schemas/WorkerSocketMessageID'
        job_id:
          type: string
        received_sequence:
          type: integer
          format: int64
    WorkerSocketJobCancelFrame:
      type: object
      additionalProperties: false
      required:
      - type
      - job_id
      properties:
        type:
          type: string
          enum:
          - job.cancel
        message_id:
          $ref: '#/components/schemas/WorkerSocketMessageID'
        job_id:
          type: string
        reason:
          type: string
        requested_at:
          type: string
          format: date-time
    WorkerSocketWorkerDrainingFrame:
      type: object
      additionalProperties: false
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - worker.draining
        message_id:
          $ref: '#/components/schemas/WorkerSocketMessageID'
    WorkerSocketWorkerDrainingAckFrame:
      type: object
      additionalProperties: false
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - worker.draining.ack
        message_id:
          $ref: '#/components/schemas/WorkerSocketMessageID'
    WorkerSocketWorkerDrainFrame:
      type: object
      additionalProperties: false
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - worker.drain
        message_id:
          $ref: '#/components/schemas/WorkerSocketMessageID'
    WorkerSocketKeepaliveFrame:
      type: object
      additionalProperties: false
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - keepalive
        message_id:
          $ref: '#/components/schemas/WorkerSocketMessageID'
    WorkerSocketErrorFrame:
      type: object
      additionalProperties: false
      required:
      - type
      - error
      properties:
        type:
          type: string
          enum:
          - error
        message_id:
          $ref: '#/components/schemas/WorkerSocketMessageID'
        error:
          $ref: '#/components/schemas/WorkerSocketProtocolError'
    BillingUsageEvent:
      type: object
      additionalProperties: false
      required:
      - id
      - api_key_id
      - period_start
      - counter
      - raw_quantity
      - credit_cost
      - credit_cost_milli
      - credit_weight_version
      - zero_credits
      - source_type
      - source_id
      - idempotency_key
      - job_id
      - agent_turn_id
      - provider
      - model
      - model_class
      - metadata
      - occurred_at
      - recorded_at
      - created_at
      properties:
        id:
          type: string
        api_key_id:
          type: string
        period_start:
          type: string
          format: date-time
        counter:
          type: string
        raw_quantity:
          type: integer
          format: int64
        credit_cost:
          type: number
          format: double
          description: Credits charged for this event (up to 3 decimal places).
        credit_cost_milli:
          type: integer
          format: int64
          description: Exact credits charged in milli-credits; authoritative for accounting.
        credit_weight_version:
          type: integer
        zero_credits:
          type: boolean
        source_type:
          type: string
        source_id:
          type: string
        idempotency_key:
          type: string
        job_id:
          type: string
          description: Job the usage was attributed to. Empty string when the event has no
            job attribution.
        agent_turn_id:
          type: string
          description: Agent turn the usage was attributed to. Empty string when the event
            has no agent-turn attribution.
        provider:
          type: string
          description: Model provider that produced the usage. Empty string when not applicable.
        model:
          type: string
          description: Model that produced the usage. Empty string when not applicable.
        model_class:
          type: string
          description: Model class that produced the usage. Empty string when not applicable.
        metadata:
          type: object
          additionalProperties: true
        occurred_at:
          type: string
          format: date-time
        recorded_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    BillingUsageEventListResponse:
      type: object
      additionalProperties: false
      required:
      - items
      - has_more
      - total_raw_quantity
      - total_credit_cost
      - total_credit_cost_milli
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BillingUsageEvent'
        has_more:
          type: boolean
          description: Whether additional pages are available.
        next_cursor:
          type: string
          description: Opaque cursor to pass as `cursor` on the next request with the same
            ordering mode. Absent when `has_more` is false.
        total_raw_quantity:
          type: integer
          format: int64
          description: Total raw quantity for the complete filtered result set before cursor
            pagination; not a page-local sum.
        total_credit_cost:
          type: number
          format: double
          description: Rounded credit total for the complete filtered result set before cursor
            pagination; not a page-local sum.
        total_credit_cost_milli:
          type: integer
          format: int64
          description: Exact milli-credit total for the complete filtered result set before
            cursor pagination; not a page-local sum.
    PermissionDefinition:
      type: object
      additionalProperties: false
      required:
      - id
      - label
      - description
      - scope
      - category
      - risk
      - assignable
      - user_kinds
      properties:
        id:
          type: string
          description: Stable permission ID stored on roles.
        label:
          type: string
          description: Human-readable label for product UI.
        description:
          type: string
          description: Short explanation of what the permission grants.
        scope:
          type: string
          enum:
          - org
          - platform
          - action
        category:
          type: string
          enum:
          - resource
          - org
          - job
          - billing
          - platform
        risk:
          type: string
          enum:
          - low
          - medium
          - high
          - critical
        assignable:
          type: boolean
          description: Whether this permission should be selectable in the current org role
            builder.
        user_kinds:
          type: array
          minItems: 1
          maxItems: 4
          uniqueItems: true
          items:
            type: string
            enum:
            - human
            - agent
            - service
            - system
          description: User kinds this permission is intended for.
    PermissionPreset:
      type: object
      additionalProperties: false
      required:
      - id
      - label
      - description
      - scope
      - permissions
      properties:
        id:
          type: string
        label:
          type: string
        description:
          type: string
        scope:
          type: string
          enum:
          - org
          - platform
          - action
        permissions:
          type: array
          maxItems: 64
          items:
            type: string
    ActionPermissionGroup:
      type: object
      additionalProperties: false
      required:
      - id
      - label
      - source
      - children
      properties:
        id:
          type: string
          description: Wildcard permission ID, for example `actions.execute.slack.*`.
        label:
          type: string
        source:
          type: string
          enum:
          - platform
          - integration
          - custom
        children:
          type: array
          maxItems: 200
          items:
            type: string
          description: Concrete action execution permission IDs included in this group.
    PermissionCatalogResponse:
      type: object
      additionalProperties: false
      required:
      - items
      - presets
      - action_groups
      properties:
        items:
          type: array
          maxItems: 64
          items:
            $ref: '#/components/schemas/PermissionDefinition'
        presets:
          type: array
          maxItems: 32
          items:
            $ref: '#/components/schemas/PermissionPreset'
        action_groups:
          type: array
          maxItems: 64
          items:
            $ref: '#/components/schemas/ActionPermissionGroup'
    Role:
      type: object
      additionalProperties: false
      description: Named bundle of permissions assignable to human or machine principals.
        Roles let admins grant agent, org, and integration capabilities consistently without
        editing every user individually.
      required:
      - id
      - name
      - permissions
      - system_defined
      - created_at
      - updated_at
      properties:
        id:
          type: string
          description: Unique identifier for this role.
        name:
          type: string
          description: Human-readable role name, unique within org scope.
        description:
          type: string
          description: Optional human-readable description of what this role grants.
        permissions:
          type: array
          items:
            type: string
          description: Permission strings granted by this role. Source allowed values from
            `GET /v1/permissions`; legacy IDs or values not present in that catalog are rejected.
        system_defined:
          type: boolean
          description: True for built-in platform roles that cannot be modified or deleted.
        tags:
          $ref: '#/components/schemas/TagMap'
        created_at:
          type: string
          format: date-time
          description: Timestamp when this role was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when this role was last updated.
    RoleAssignment:
      type: object
      additionalProperties: false
      description: Binding between a principal and a role in one org. Use assignments to explain
        why a principal (human or machine) has access and to audit who granted it.
      required:
      - id
      - principal_id
      - role_id
      - role_name
      - created_at
      properties:
        id:
          type: string
          description: Unique identifier for this role assignment.
        principal_id:
          type: string
          description: Principal ID receiving the role.
        role_id:
          type: string
          description: ID of the assigned role.
        role_name:
          type: string
          description: Name of the assigned role.
        granted_by:
          type: string
          description: Principal ID of the caller who created this assignment.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this assignment was created.
    RoleListResponse:
      type: object
      additionalProperties: false
      required:
      - items
      - has_more
      properties:
        items:
          type: array
          description: The list of results for this page.
          items:
            $ref: '#/components/schemas/Role'
        next_cursor:
          type: string
          description: Opaque cursor to pass as `cursor` on the next request. Absent when
            `has_more` is false.
        has_more:
          type: boolean
          description: Whether additional pages are available.
    RoleAssignmentListResponse:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          description: The list of results for this page.
          items:
            $ref: '#/components/schemas/RoleAssignment'
    CreateRoleRequest:
      type: object
      additionalProperties: false
      required:
      - name
      - permissions
      properties:
        name:
          type: string
          description: Unique name within the org.
        description:
          type: string
          description: Optional human-readable description of what this role grants.
        permissions:
          type: array
          items:
            type: string
          description: Permission strings to include. Source allowed values from `GET /v1/permissions`;
            legacy IDs or values not present in that catalog are rejected.
        tags:
          $ref: '#/components/schemas/TagMap'
    UpdateRoleRequest:
      type: object
      additionalProperties: false
      properties:
        description:
          type: string
          description: Replacement description.
        permissions:
          type: array
          items:
            type: string
          description: Replaces the existing permissions array entirely. Source allowed values
            from `GET /v1/permissions`; legacy IDs or values not present in that catalog are
            rejected.
        tags:
          $ref: '#/components/schemas/TagMap'
    CreateRoleAssignmentRequest:
      type: object
      additionalProperties: false
      required:
      - principal_id
      oneOf:
      - required:
        - role_id
      - required:
        - role_name
      properties:
        principal_id:
          type: string
          description: Principal ID to assign the role to (human or machine).
        role_id:
          type: string
          description: Mutually exclusive with `role_name`.
        role_name:
          type: string
          description: Resolved to a role ID server-side. Mutually exclusive with `role_id`.
    OAuthReturnOrigins:
      type: object
      additionalProperties: false
      description: The organization's allowlist of exact HTTPS origins an embedded partner
        may name as an OAuth connect `return_url`. Origins are stored normalized (lowercase
        host, default ports stripped). An empty list disables embedded return for the organization.
      required:
      - origins
      properties:
        origins:
          type: array
          maxItems: 20
          description: Normalized exact HTTPS return origins (for example `https://app.partner.example`).
          items:
            type: string
    PutOAuthReturnOriginsRequest:
      type: object
      additionalProperties: false
      description: Full-replace body for the organization's OAuth return-origin allowlist.
        Each entry must be an exact HTTPS origin; entries are normalized and de-duplicated.
        At most 20 origins are accepted.
      required:
      - origins
      properties:
        origins:
          type: array
          maxItems: 20
          description: Exact HTTPS return origins to allow. An empty array disables embedded
            return.
          items:
            type: string
    OrgContext:
      type: object
      additionalProperties: false
      description: 'The organization''s shared context: background on the business that every
        agent in the organization carries in its system prompt. It belongs to the organization
        rather than to any one agent or person — administrators write it, every member can
        read it, and every agent receives it on every turn.'
      required:
      - content
      - max_bytes
      properties:
        content:
          type: string
          description: The context as stored, in Markdown. Empty when the organization has
            not written one.
        max_bytes:
          type: integer
          description: The largest content the server accepts, in bytes of UTF-8. The content
            rides in every agent turn, so the cap is a per-turn budget rather than a storage
            limit.
        updated_at:
          type: string
          format: date-time
          description: When the content last changed. Absent until it is first written.
    PutOrgContextRequest:
      type: object
      additionalProperties: false
      description: Full-replace body for the organization context. An empty string clears
        it.
      required:
      - content
      properties:
        content:
          type: string
          maxLength: 16384
          description: The new context, in Markdown. At most 16384 bytes of UTF-8.
    InteractionMode:
      type: string
      enum:
      - confirm
      - select
      - multi_select
      - input
      description: Declarative UI/input primitive for collecting the response. This is a portable
        rendering contract, not executable code. Values are `confirm`, `select`, `multi_select`,
        and `input`.
    InteractionOption:
      type: object
      required:
      - value
      - label
      additionalProperties: false
      description: Selectable option for `select` and `multi_select` modes.
      properties:
        value:
          type: string
          description: Machine-readable value submitted when this option is chosen.
        label:
          type: string
          description: Human-readable label displayed for this option.
        description:
          type: string
          description: Optional additional context shown beneath the label.
    InteractionSpec:
      type: object
      required:
      - mode
      additionalProperties: false
      description: |-
        Declarative dialog contract for rendering and validating an interaction. Used at both authoring time and runtime (persisted on an interaction). Protocol kind is decoupled from input shape: each kind declares which spec modes are *allowed*, not which is *implied*. An approval may now legitimately use `select` mode (approve/deny/defer), for example.

        Allowed combinations:
        * `request_approval` → `confirm`, `select`
        * `request_review` → `select`, `input`
        * `request_information` → `select`, `multi_select`, `input`
      properties:
        mode:
          $ref: '#/components/schemas/InteractionMode'
          description: UI/input mode used to render and validate the response.
        options:
          type: array
          maxItems: 100
          description: Required for `select` and `multi_select` modes.
          items:
            $ref: '#/components/schemas/InteractionOption'
        default_value:
          type: string
          description: Default selected option for `select` mode.
        default_values:
          type: array
          maxItems: 100
          description: Default selected options for `multi_select` mode.
          items:
            type: string
        default_text:
          type: string
          description: Initial text value for `input` mode.
        default_confirmed:
          type: boolean
          description: Initial yes/no value for `confirm` mode.
        placeholder:
          type: string
          description: Hint text shown for `input` mode.
        multiline:
          type: boolean
          description: When true, render `input` mode as a multiline text area.
    InteractionKind:
      type: string
      enum:
      - request_information
      - request_approval
      - request_review
      - assign_work
      description: |-
        Protocol kind of the interaction:
        * `request_information` — a data-collection protocol with structured
        or free-form input
        * `request_approval` — a decision protocol (yes/no, optionally
        yes/no/defer)
        * `request_review` — a judgment protocol that evaluates supplied
        material
        * `assign_work` — assigned work performed by a user or agent, which
        submits the result. Pair it with `resolution_policy.review` when the
        result must be accepted before the interaction resolves.

        The first three are *answered*; `assign_work` is *worked*. Kind does not by itself decide when an interaction closes — the resolution policy does.
    InteractionStatus:
      type: string
      enum:
      - pending
      - in_review
      - completed
      - expired
      - cancelled
      description: |-
        Lifecycle state of the interaction.
        * `pending` — open; the assigned users still need to act.
        * `in_review` — a result was submitted and an acceptance reviewer must
        accept it or send it back. Only interactions whose resolution policy
        carries a `review` block enter this state.
        * `completed` — resolved; the outcome is final.
        * `expired` — the deadline passed before resolution.
        * `cancelled` — deliberately stopped.

        `pending` and `in_review` are the *open* states: some actor still owes an action and any waiting consumer has not been resumed.
    InteractionValue:
      description: Free-form JSON payload. Used both for responder-supplied values and for
        policy-derived values (e.g. `Interaction.outcome`, `ResolutionPolicy.proposal`); each
        consumer documents which.
      anyOf:
      - type: object
        nullable: true
        description: Null when no interaction value has been supplied yet.
        additionalProperties: true
      - type: array
        items: {}
      - type: string
      - type: number
      - type: boolean
    InteractionResponder:
      type: object
      required:
      - user_id
      additionalProperties: false
      description: Identifies the principal who answered an interaction. Agents answer through
        their agent principal ID.
      properties:
        user_id:
          type: string
          description: Responder user ID.
    InteractionReference:
      type: object
      additionalProperties: false
      required:
      - kind
      description: Pointer to the work item, artifact, external ticket, or Mobius entity this
        interaction is about.
      properties:
        kind:
          type: string
          enum:
          - external_url
          - mobius_entity
        url:
          type: string
          format: uri
          description: Required when kind is `external_url`.
        entity_type:
          type: string
          description: Required when kind is `mobius_entity`.
        entity_id:
          type: string
          description: Required when kind is `mobius_entity`.
        relation:
          type: string
          description: Relationship such as `subject`, `evidence`, or `related`.
        label:
          type: string
          description: User-facing label for display.
    Delivery:
      type: object
      additionalProperties: false
      required:
      - channels
      description: Optional per-interaction delivery override. When absent, each participant
        is notified via the app inbox only.
      properties:
        channels:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/DeliveryChannel'
    DeliveryChannel:
      type: object
      additionalProperties: false
      required:
      - kind
      description: A single delivery destination. `inbox_only` carries no payload; `email`
        requires the `email` variant.
      properties:
        kind:
          type: string
          enum:
          - inbox_only
          - email
        email:
          type: object
          allOf:
          - $ref: '#/components/schemas/EmailDelivery'
          nullable: true
          description: Email delivery payload when `kind=email`; null for inbox-only delivery.
    EmailDelivery:
      type: object
      additionalProperties: false
      required:
      - to
      properties:
        to:
          type: array
          minItems: 1
          items:
            type: string
            format: email
    Consumer:
      type: object
      additionalProperties: false
      required:
      - kind
      description: 'Polymorphic identifier of what is waiting on this interaction''s resolution.
        `http_subscriber` requires `secret_ref` and enqueues a durable callback dispatch to
        `callback_url` when the interaction resolves; the canonical string `v1.{delivery_id}.{unix_timestamp}.{raw_body}`
        is signed with HMAC-SHA256 against the resolved org signing key and the signed dispatch
        carries `X-Mobius-Signature`, `X-Mobius-Secret-Version` and `X-Mobius-Timestamp`.
        Signed dispatches also carry `X-Mobius-Signature-Version: v1`. Every durable dispatch
        also carries the stable outbox row id in `X-Mobius-Delivery-Id` and `Idempotency-Key`;
        retries reuse the same value. Verifiers should recompute the signature over the exact
        raw body, reject stale timestamps (for example, older than five minutes), deduplicate
        by delivery id, and check the signing headers.'
      properties:
        kind:
          type: string
          enum:
          - agent_tool
          - http_subscriber
          - none
        agent_tool:
          type: object
          allOf:
          - $ref: '#/components/schemas/AgentToolConsumer'
          nullable: true
          description: Agent tool continuation target when `kind=agent_tool`; null for other
            consumer kinds.
        http_subscriber:
          type: object
          allOf:
          - $ref: '#/components/schemas/HttpSubscriberConsumer'
          nullable: true
          description: HTTP callback target when `kind=http_subscriber`; null for other consumer
            kinds.
    AgentToolConsumer:
      type: object
      additionalProperties: false
      required:
      - invocation_id
      - tool_call_id
      properties:
        invocation_id:
          type: string
        tool_call_id:
          type: string
        session_id:
          type: string
          description: Session whose turn raised this interaction, when session-scoped.
    HttpSubscriberConsumer:
      type: object
      additionalProperties: false
      required:
      - callback_url
      properties:
        callback_url:
          type: string
          format: uri
          description: Absolute http(s) URL the server POSTs to when the interaction resolves.
            The body is a JSON object with the interaction id, kind, status, outcome value,
            comment, responder, and `resolved_by`. Delivery is enqueued as a `source_events`
            dispatch so the worker can retry failed attempts instead of dropping them inline
            with interaction resolution.
    ConsumerInput:
      type: object
      additionalProperties: false
      required:
      - kind
      properties:
        kind:
          type: string
          enum:
          - agent_tool
          - http_subscriber
          - none
        agent_tool:
          $ref: '#/components/schemas/AgentToolConsumer'
        http_subscriber:
          $ref: '#/components/schemas/HttpSubscriberConsumerInput'
    HttpSubscriberConsumerInput:
      type: object
      additionalProperties: false
      required:
      - callback_url
      - signing_secret
      properties:
        callback_url:
          type: string
          format: uri
          description: Absolute public http(s) callback URL.
        signing_secret:
          type: string
          writeOnly: true
          minLength: 1
          description: HMAC signing secret stored in the interaction-owned vault and never
            returned.
    InteractionResponse:
      type: object
      additionalProperties: false
      description: One persisted answer artifact for an interaction. The response that triggered
        resolution is referenced from `Interaction.resolving_response_id`.
      required:
      - id
      - interaction_id
      - response_kind
      - state
      - responder_user_id
      - value
      - responded_at
      - created_at
      - updated_at
      properties:
        id:
          type: string
          description: Unique identifier for this response.
        interaction_id:
          type: string
          description: ID of the interaction this response belongs to.
        response_kind:
          type: string
          enum:
          - response
          description: Answer response.
        state:
          type: string
          enum:
          - submitted
          description: Lifecycle state for this response row.
        responder_user_id:
          type: string
          description: User ID that submitted this response.
        value:
          $ref: '#/components/schemas/InteractionValue'
          description: JSON value supplied by this participant.
        comment:
          type: string
          nullable: true
          description: Optional free-text comment from this responder.
        responded_at:
          type: string
          format: date-time
          description: Timestamp when this response was submitted.
        attempt:
          type: integer
          nullable: true
          description: Review round this response was submitted under, matching the interaction's
            `review_round` at submission time. Null or absent for the first round. Only responses
            whose `attempt` equals the interaction's current `review_round` count toward resolution;
            earlier rounds are retained as audit history.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ReviewPolicy:
      type: object
      additionalProperties: false
      description: |-
        Optional acceptance gate on a resolution policy. Its presence — not the interaction's kind — is what makes an interaction reviewable, so the gate stays opt-in and ordinary approvals and input requests are unaffected.

        With a review block, satisfying the resolution rule moves the interaction to `in_review` instead of resolving it, and any waiting consumer stays suspended. A reviewer then calls the review endpoint to accept (resolve and resume) or request changes (return to `pending` under a new review round, consumer still waiting).
      properties:
        reviewer_user_ids:
          type: array
          items:
            type: string
          description: Principals who may accept or send back submitted work. When omitted
            or empty, the interaction's creator is the reviewer. Assignees are never implied
            reviewers — self-acceptance would make the gate decorative. Required when the
            interaction has no creator.
    ResolutionPolicy:
      type: object
      additionalProperties: false
      required:
      - type
      description: Declarative resolution rule attached to an Interaction. Determines how
        participant responses become a final outcome, and whether that outcome needs acceptance
        before it is final.
      properties:
        type:
          type: string
          enum:
          - any_of
          - all_of
          - quorum
          description: Resolution rule. `any_of` resolves on the first acceptable response.
            `all_of` waits for every assigned participant. `quorum` resolves once `threshold`
            distinct participants respond.
        threshold:
          type: integer
          minimum: 1
          description: Required when `type` is `quorum`. Number of distinct eligible participants
            that must respond before the interaction resolves. Must be `>= 1` and `<=` the
            participant count.
        review:
          type: object
          allOf:
          - $ref: '#/components/schemas/ReviewPolicy'
          nullable: true
          description: Optional acceptance gate. Null (the default) means responses resolve
            the interaction directly.
    InteractionLifecycleEvent:
      type: object
      additionalProperties: false
      required:
      - at
      - status
      - action
      description: One entry in an interaction's status history. Entries are append-only and
        written in the same transaction as the transition they describe, so the timeline can
        never disagree with the interaction's `status`.
      properties:
        at:
          type: string
          format: date-time
          description: When the transition happened.
        status:
          $ref: '#/components/schemas/InteractionStatus'
          description: The interaction's status *after* the transition.
        action:
          type: string
          enum:
          - created
          - submitted_for_review
          - accepted
          - changes_requested
          - resolved
          - cancelled
          - expired
          description: What happened.
        actor_id:
          type: string
          nullable: true
          description: Principal that caused the transition. Null for system-driven transitions
            such as expiry.
        comment:
          type: string
          nullable: true
          description: Reviewer feedback, cancel reason, or responder comment, depending on
            `action`.
        round:
          type: integer
          nullable: true
          description: Review round the transition belongs to. Zero for the first pass.
    Interaction:
      type: object
      additionalProperties: false
      description: Human or agent interaction request and its current response state.
      required:
      - id
      - kind
      - status
      - title
      - owner
      - visibility
      - posture
      - target_user_ids
      - created_at
      - updated_at
      properties:
        id:
          type: string
          description: Unique identifier for this interaction.
        created_by:
          type: string
          nullable: true
          description: Canonical principal ID of the human or agent that created the interaction;
            null for legacy/system-created rows.
        owner:
          $ref: '#/components/schemas/ResourceOwner'
          description: Interactions are team-governed; their explicit targets are the audience
            boundary.
        visibility:
          $ref: '#/components/schemas/ResourceVisibility'
        container:
          $ref: '#/components/schemas/ResourceContainer'
        posture:
          $ref: '#/components/schemas/ResourcePosture'
        kind:
          $ref: '#/components/schemas/InteractionKind'
          description: Protocol kind of the interaction.
        status:
          $ref: '#/components/schemas/InteractionStatus'
          description: Current lifecycle state of the interaction.
        title:
          type: string
          minLength: 1
          description: Short non-empty title shown to the responder.
        description:
          type: string
          nullable: true
          description: Optional longer responder-facing detail or instructions.
        subject:
          type: object
          allOf:
          - $ref: '#/components/schemas/InteractionReference'
          nullable: true
          description: Primary work item or artifact the interaction is about; null when no
            subject was supplied.
        references:
          type: array
          items:
            $ref: '#/components/schemas/InteractionReference'
          description: Supporting links and related entities.
        context:
          type: object
          additionalProperties: true
          nullable: true
          description: Additional key-value context surfaced in the UI alongside the title
            and description when supplied.
        tags:
          $ref: '#/components/schemas/TagMap'
        properties:
          type: object
          additionalProperties: true
          nullable: true
          description: Free-form structured metadata attached to the interaction; null when
            no metadata is attached.
        spec:
          $ref: '#/components/schemas/InteractionSpec'
          description: Response controls and validation rules rendered to the recipient.
        target_user_ids:
          type: array
          items:
            type: string
          description: Resolved user IDs targeted by the interaction.
        responder:
          type: object
          allOf:
          - $ref: '#/components/schemas/InteractionResponder'
          nullable: true
          description: User or agent that completed the interaction; null until completion.
        resolving_response_id:
          type: string
          nullable: true
          description: ID of the response that triggered resolution. Null while the interaction
            is pending, cancelled, or expired. Look up the response in `responses` for the
            full payload.
        responses:
          type: array
          items:
            $ref: '#/components/schemas/InteractionResponse'
          description: All response artifacts recorded against this interaction in arrival
            order.
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: Timestamp when this interaction expires if not responded to.
        completed_at:
          type: string
          format: date-time
          nullable: true
          description: Timestamp when the interaction received a terminal response.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this interaction was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when this interaction was last updated.
        require_all:
          type: boolean
          description: When true, all target users must respond before completion.
        resolution_policy:
          type: object
          allOf:
          - $ref: '#/components/schemas/ResolutionPolicy'
          nullable: true
          description: Declarative resolution rule attached at creation time. Legacy `require_all`
            inputs are synthesized into an equivalent policy at create time when present.
            Newer rows typically include this field; nullability covers historical rows and
            callers that omit it.
        consumer:
          type: object
          allOf:
          - $ref: '#/components/schemas/Consumer'
          nullable: true
          description: Polymorphic identifier of what is waiting on this interaction's resolution.
        delivery:
          type: object
          allOf:
          - $ref: '#/components/schemas/Delivery'
          nullable: true
          description: Optional per-interaction delivery override. When absent, the dispatcher
            delivers to the app inbox only.
        outcome:
          $ref: '#/components/schemas/InteractionValue'
          description: Final outcome selected by the resolution policy. Omitted while the
            interaction is still pending.
        resolved_by:
          type: string
          nullable: true
          description: Short audit string identifying which policy rule fired. Null until
            the interaction reaches a resolved state.
        cancel_reason:
          type: string
          nullable: true
          description: Reason recorded when the interaction was cancelled.
        review_round:
          type: integer
          nullable: true
          description: Number of completed send-backs. Zero on the first pass. Responses record
            the round they answered in their `attempt` field, and only the current round's
            responses count toward resolution.
        submitted_at:
          type: string
          format: date-time
          nullable: true
          description: When the interaction most recently entered `in_review`. Null for interactions
            that have never been submitted for acceptance.
        review_feedback:
          type: string
          nullable: true
          description: The reviewer's most recent send-back note. Survives the return to `pending`
            so the assignee can see why the work came back.
        reviewer:
          type: object
          allOf:
          - $ref: '#/components/schemas/InteractionResponder'
          nullable: true
          description: Principal whose accept or send-back was recorded last; null until a
            review decision is made. Distinct from `responder`, which names whoever submitted
            the work.
        lifecycle:
          type: array
          items:
            $ref: '#/components/schemas/InteractionLifecycleEvent'
          description: Append-only status history, oldest first. Rendered as the detail view's
            timeline.
    InteractionListResponse:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          description: The list of results for this page.
          items:
            $ref: '#/components/schemas/Interaction'
        has_more:
          type: boolean
          description: Whether additional pages are available.
        next_cursor:
          type: string
          description: Opaque cursor to pass as `cursor` on the next request. Absent when
            `has_more` is false.
    CreateInteractionRequest:
      type: object
      additionalProperties: false
      required:
      - kind
      - title
      - target_user_ids
      description: Creates an interaction. `consumer` names what is waiting on its resolution;
        when omitted, completion records the response and nothing else acts on it.
      properties:
        target_user_ids:
          type: array
          items:
            type: string
          minItems: 1
          description: Resolved user IDs to target directly. At least one target is required
            — every interaction needs someone who can answer it, even when a machine consumer
            is waiting on the outcome. Agents use their agent principal IDs.
        kind:
          $ref: '#/components/schemas/InteractionKind'
          description: Protocol kind.
        title:
          type: string
          minLength: 1
          description: Short non-empty title shown to the responder.
        description:
          type: string
          description: Optional longer responder-facing detail or instructions.
        subject:
          $ref: '#/components/schemas/InteractionReference'
          description: Primary work item or artifact the interaction is about.
        references:
          type: array
          items:
            $ref: '#/components/schemas/InteractionReference'
          description: Supporting links and related entities.
        context:
          type: object
          additionalProperties: true
          description: Additional key-value context surfaced in the UI alongside the title
            and description.
        tags:
          $ref: '#/components/schemas/TagMap'
        properties:
          type: object
          additionalProperties: true
          description: Free-form structured metadata to attach to the interaction.
        spec:
          $ref: '#/components/schemas/InteractionSpec'
          description: Response controls and validation rules rendered to the recipient.
        require_all:
          type: boolean
          description: When true, all target users must respond before the interaction is
            considered complete. Defaults to false when omitted. Mutually exclusive with `resolution_policy`;
            prefer the policy form for new code.
        resolution_policy:
          $ref: '#/components/schemas/ResolutionPolicy'
          description: Declarative resolution rule. When supplied the policy evaluator drives
            completion.
        consumer:
          $ref: '#/components/schemas/ConsumerInput'
          description: Polymorphic identifier of what is waiting on this interaction's resolution.
        delivery:
          $ref: '#/components/schemas/Delivery'
          description: Optional per-interaction delivery override.
        expires_at:
          type: string
          format: date-time
          description: Timestamp after which this interaction expires if not responded to.
    RespondToInteractionRequest:
      type: object
      additionalProperties: false
      properties:
        action:
          type: string
          enum:
          - submit
          description: Operation to perform through the canonical response endpoint. `submit`
            answers the interaction.
        value:
          $ref: '#/components/schemas/InteractionValue'
          description: JSON value supplied by the responder. Required for `submit`.
        comment:
          type: string
          description: Optional free-text comment accompanying the action. Available on every
            interaction kind and never gated by the spec; the responder may always attach
            reasoning, caveats, or follow-up notes alongside `value`.
    ReviewInteractionRequest:
      type: object
      additionalProperties: false
      required:
      - action
      description: Acceptance decision on submitted work.
      properties:
        action:
          type: string
          enum:
          - accept
          - request_changes
          description: '`accept` resolves the interaction and resumes any waiting consumer.
            `request_changes` returns it to `pending` for another round.'
        comment:
          type: string
          description: The reviewer's reasoning. Required for `request_changes` — work sent
            back without a reason gives the assignee nothing to act on. Optional for `accept`,
            where it is recorded as an acceptance note.
    CancelInteractionRequest:
      type: object
      additionalProperties: false
      description: Optional payload accompanying a cancel request. The reason is recorded
        on the interaction and forwarded in the cancellation signal so the waiting consumer
        can route to a fallback.
      properties:
        reason:
          type: string
          description: Free-text reason recorded on the interaction.
    AgentMember:
      type: object
      additionalProperties: false
      description: |-
        One principal in a restricted or private agent's audience. Membership is pure visibility and carries no role.

        A new member reads the ENTIRE shared layer, including everything promoted before they joined. That is inherent to a shared store; the member list's `added_at` is what makes it legible.
      required:
      - principal_id
      - kind
      - added_at
      properties:
        principal_id:
          type: string
          description: The human or agent principal in this agent's audience.
        kind:
          type: string
          enum:
          - human
          - agent
          - service
          - system
          description: Principal kind, so a picker can distinguish a person from a coordinator
            agent.
        display_name:
          type: string
          description: Human-readable name of the principal, when resolvable.
        added_at:
          type: string
          format: date-time
          description: When this principal was added to the audience.
        added_by:
          type: string
          description: Principal who granted this membership.
    AgentMemberListResponse:
      type: object
      additionalProperties: false
      required:
      - count
      properties:
        items:
          type: array
          description: The current audience. Returned only to callers who may manage the agent;
            other members receive `count` alone.
          items:
            $ref: '#/components/schemas/AgentMember'
        count:
          type: integer
          description: How many principals are in this agent's audience.
    ReplaceAgentMembersRequest:
      type: object
      additionalProperties: false
      required:
      - principal_ids
      properties:
        principal_ids:
          type: array
          description: 'The exact audience after this call. A private agent takes exactly
            one; a restricted agent at least one. An empty list on a restricted or private
            agent is rejected: an empty audience means nobody, never everyone.'
          items:
            type: string
          minItems: 1
          maxItems: 200
    AddAgentMembersRequest:
      type: object
      additionalProperties: false
      required:
      - principal_ids
      properties:
        principal_ids:
          type: array
          description: Principals to add. Each must be a live principal in this org. Adding
            a principal who is already a member is a no-op.
          items:
            type: string
          maxItems: 200
    AgentVisibilityImpact:
      type: object
      additionalProperties: false
      description: What a pending visibility change would do, so a client can confirm it in
        specific terms rather than as a dropdown edit.
      required:
      - agent_id
      - from
      - to
      - widening
      - shared_entry_count
      - affected_resources
      properties:
        agent_id:
          type: string
        from:
          $ref: '#/components/schemas/AgentVisibility'
        to:
          $ref: '#/components/schemas/AgentVisibility'
        widening:
          type: boolean
          description: 'True when the change exposes the shared memory layer to principals
            who could not read it before. Widening requires `confirm_visibility_change` and
            has no technical undo: republished knowledge cannot be un-read.'
        shared_entry_count:
          type: integer
          description: How many shared-layer memory entries the change republishes or restricts.
        dropped_members:
          type: array
          description: Member rows a widening change deletes.
          items:
            type: string
        stranded_principals:
          type: array
          description: Principals who hold a memory partition or a session on this agent and
            fall outside the new audience.
          items:
            type: string
        stranded_partitions:
          type: integer
        stranded_sessions:
          type: integer
        affected_resources:
          type: array
          description: Delegated or contained root resources whose effective audience would
            grow. Every item requires one matching disposition on the update request; omission
            aborts the change.
          items:
            $ref: '#/components/schemas/AgentVisibilityAffectedResource'
    AgentVisibilityAffectedResource:
      type: object
      additionalProperties: false
      required:
      - resource_type
      - resource_id
      - resource_class
      - relationship
      - visibility
      - allowed_actions
      properties:
        resource_type:
          type: string
          enum:
          - artifact
          - session
          - skill
          - table
        resource_id:
          type: string
        name:
          type: string
          description: Configuration name. Omitted for conversations and outputs.
        resource_class:
          type: string
          enum:
          - configuration
          - conversation
          - output
        relationship:
          type: string
          enum:
          - delegation
          - container
        visibility:
          $ref: '#/components/schemas/ResourceVisibility'
        allowed_actions:
          type: array
          minItems: 2
          maxItems: 2
          items:
            type: string
            enum:
            - revoke
            - make_private
            - keep_and_widen
    AgentAudienceResourceDisposition:
      type: object
      additionalProperties: false
      required:
      - resource_type
      - resource_id
      - action
      properties:
        resource_type:
          type: string
          enum:
          - artifact
          - session
          - skill
          - table
        resource_id:
          type: string
        action:
          type: string
          enum:
          - revoke
          - make_private
          - keep_and_widen
    PromoteAgentMemoryEntryRequest:
      type: object
      additionalProperties: false
      required:
      - user_id
      properties:
        user_id:
          type: string
          description: 'The private partition the entry is copied out of. Required: promotion
            always has an owner, and the shared layer is not a source.'
          maxLength: 200
        replace:
          type: boolean
          default: false
          description: Allow overwriting a shared entry that already holds this key. Without
            it a collision is a `409`, so a promotion never silently rewrites what the group
            already knows.
    UpdateMemoryContextPolicy:
      type: object
      additionalProperties: false
      description: Replacement automatic memory delivery policy. Send an empty object to clear
        the stored override and restore the bounded index default. Otherwise `mode` is required
        (`index`, `full`, or `off`) and `max_bytes` is optional.
      properties:
        mode:
          $ref: '#/components/schemas/MemoryContextMode'
        max_bytes:
          type: integer
          minimum: 0
          maximum: 245760
          description: UTF-8 byte budget. Omit or send `0` for the selected mode's default.
            Off mode ignores this field.
    AgentMessagingDMPolicy:
      type: string
      enum:
      - open
      - allowlist
      - disabled
      description: 'Direct-message access policy: `open`, `allowlist`, or `disabled`.'
    AgentMessagingReplyMode:
      type: string
      enum:
      - auto
      description: Reply mode for built-in messaging; currently `auto`.
    AgentMessagingProvider:
      type: string
      enum:
      - slack
      - telegram
      - linear
      description: 'Provider supported by built-in agent messaging: `slack`, `telegram`, or
        `linear` (Linear agent sessions).'
    AgentMessagingBinding:
      type: object
      additionalProperties: false
      description: Messaging provider account that an agent can answer from.
      required:
      - id
      - agent_id
      - provider
      - integration_id
      - enabled
      - dms
      - mentions
      - all_messages
      - channels
      - dm_policy
      - sender_allow
      - reply_mode
      - created_at
      - updated_at
      properties:
        id:
          type: string
          description: Messaging binding identifier.
        agent_id:
          type: string
          description: Agent this binding belongs to.
        provider:
          $ref: '#/components/schemas/AgentMessagingProvider'
          description: 'Messaging provider for this binding: `slack` or `telegram`.'
        integration_id:
          type: string
          description: Connected integration account this binding applies to.
        enabled:
          type: boolean
          description: Whether the agent can currently answer on this account.
        dms:
          type: boolean
          description: Whether direct messages are accepted.
        mentions:
          type: boolean
          description: Whether channel/group mentions activate the agent.
        all_messages:
          type: boolean
          description: Whether every message in the allowed conversations activates the agent.
        channels:
          type: array
          description: Optional provider conversation allowlist. Empty means any conversation
            on the integration.
          items:
            type: string
        dm_policy:
          $ref: '#/components/schemas/AgentMessagingDMPolicy'
          description: 'Who may direct-message this agent: `open`, `allowlist`, or `disabled`.'
        sender_allow:
          type: array
          description: Optional provider sender allowlist. Empty means any sender.
          items:
            type: string
        reply_mode:
          $ref: '#/components/schemas/AgentMessagingReplyMode'
          description: How the agent replies to inbound provider messages.
        model_route:
          $ref: '#/components/schemas/AgentModelRoute'
          description: Optional model route override used for replies through this binding.
        compaction_policy:
          $ref: '#/components/schemas/SessionCompactionPolicy'
          description: Optional compaction policy applied to sessions created from this binding.
            Unset inherits the agent default.
        created_at:
          type: string
          format: date-time
          description: Time the binding was created.
        updated_at:
          type: string
          format: date-time
          description: Time the binding was last updated.
    AgentMessagingBindingRequest:
      type: object
      additionalProperties: false
      required:
      - provider
      - integration_id
      properties:
        provider:
          $ref: '#/components/schemas/AgentMessagingProvider'
          description: 'Messaging provider for this binding: `slack` or `telegram`.'
        integration_id:
          type: string
          description: ID of the connected integration that backs this binding.
        enabled:
          type: boolean
          default: false
          description: Whether the binding is active and the agent responds on this provider.
        replace_existing:
          type: boolean
          default: false
          description: When enabling this binding, disable any other active agent binding
            for the same provider account.
        dms:
          type: boolean
          default: true
          description: Respond to direct messages.
        mentions:
          type: boolean
          default: true
          description: Respond when the agent is @-mentioned.
        all_messages:
          type: boolean
          default: false
          description: Respond to every message in bound channels, not just mentions.
        channels:
          type: array
          items:
            type: string
          description: Channel IDs the binding is scoped to (empty means all channels).
        dm_policy:
          $ref: '#/components/schemas/AgentMessagingDMPolicy'
          description: 'Who may direct-message this agent: `open`, `allowlist`, or `disabled`.'
        sender_allow:
          type: array
          items:
            type: string
          description: Sender IDs allowed to trigger the agent (empty means no allowlist).
        reply_mode:
          $ref: '#/components/schemas/AgentMessagingReplyMode'
          description: Reply behavior for provider messages; currently `auto`.
        model_route:
          $ref: '#/components/schemas/AgentModelRoute'
          description: Optional model route override used for replies through this binding.
        compaction_policy:
          $ref: '#/components/schemas/SessionCompactionPolicy'
          description: Optional compaction policy applied to sessions created from this binding.
            Unset inherits the agent default.
    AgentMessagingBindingListResponse:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          description: Messaging bindings configured for this agent.
          items:
            $ref: '#/components/schemas/AgentMessagingBinding'
    SkillAssignment:
      type: object
      additionalProperties: false
      description: Assignment linking a skill to an agent.
      required:
      - agent_id
      - skill_id
      - enabled
      - position
      - created_at
      properties:
        agent_id:
          type: string
          description: Agent the skill is assigned to.
        skill_id:
          type: string
          description: Skill assigned to the agent.
        skill:
          $ref: '#/components/schemas/Skill'
          description: Expanded skill metadata for this assignment.
        enabled:
          type: boolean
          description: Whether the assignment is currently active.
        position:
          type: integer
          description: Ordering position of this assignment in the agent's skill list.
        created_at:
          type: string
          format: date-time
          description: Record creation timestamp.
    ReplaceSkillsRequest:
      type: object
      additionalProperties: false
      required:
      - skill_ids
      properties:
        skill_ids:
          type: array
          description: Full replace-set of skill IDs to assign to the agent, in desired order.
          items:
            type: string
    SkillAssignmentListResponse:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          description: Skill assignments for this agent, in position order.
          items:
            $ref: '#/components/schemas/SkillAssignment'
    SkillManifestEntry:
      type: object
      additionalProperties: false
      description: Skill metadata included in a resolved agent tool manifest. Full instructions
        are loaded at runtime through the invoke_skill tool.
      required:
      - id
      - name
      - active
      properties:
        id:
          type: string
          description: Skill ID this manifest entry resolved to.
        name:
          type: string
          description: Display name of the skill.
        description:
          type: string
          description: Markdown description of the skill's purpose.
        active:
          type: boolean
          description: Whether this skill is the one being simulated as invoked, i.e. it matched
            the `skill_name` parameter and its `allowed_tools` grant was applied to this manifest.
            False for every assigned skill when `skill_name` is omitted.
        missing_required:
          type: array
          description: Tool selectors the skill requires but that are not available to the
            agent.
          items:
            type: string
        missing_recommended:
          type: array
          description: Tool selectors the skill recommends but that are not available to the
            agent.
          items:
            type: string
    AgentManifestWarning:
      type: object
      additionalProperties: false
      description: Non-fatal warning produced while resolving an agent tool manifest.
      required:
      - code
      - message
      properties:
        code:
          type: string
          description: Machine-readable warning code.
        message:
          type: string
          description: Human-readable warning text.
        skill_id:
          type: string
          description: Skill the warning relates to, when applicable.
        tool:
          type: string
          description: Tool selector the warning relates to, when applicable.
        action:
          type: string
          description: Action name the warning relates to, when applicable.
    ResolvedActionGroup:
      type: object
      additionalProperties: false
      description: Action group expanded during manifest resolution.
      required:
      - name
      - members
      properties:
        name:
          type: string
          description: Canonical group name (e.g. `mobius.table.read`).
        members:
          type: array
          description: Action names the group expanded to during this resolution.
          items:
            type: string
    AgentToolManifest:
      type: object
      additionalProperties: false
      required:
      - agent_id
      - policy_hash
      - tools
      - skills
      - warnings
      description: 'The flat, resolved tool set visible to one agent. Replaces the prior Capability/Action
        split: every entry in `tools` is an action catalog entry the agent can invoke as its
        own named tool.'
      properties:
        agent_id:
          type: string
          description: Agent this manifest was resolved for.
        policy_hash:
          type: string
          description: Stable hash over the resolved tool + skill set; bumps when the agent's
            tool selectors or skills change.
        tools:
          type: array
          description: Catalog entries the agent can invoke. Each entry surfaces to the LLM
            as its own named tool. Built-in, integration, and custom-HTTP actions are intermingled
            here.
          items:
            $ref: '#/components/schemas/ActionCatalogEntry'
        groups_resolved:
          type: array
          description: Audit trail of group selectors that contributed to the resolved tool
            set. Operators see groups; the LLM only sees the flat `tools` list.
          items:
            $ref: '#/components/schemas/ResolvedActionGroup'
        skills:
          type: array
          description: Skills assigned to this agent, as resolved for this manifest. See each
            entry's `active` property for which one's grant was applied.
          items:
            $ref: '#/components/schemas/SkillManifestEntry'
        warnings:
          type: array
          description: Non-fatal issues encountered while resolving the manifest.
          items:
            $ref: '#/components/schemas/AgentManifestWarning'
    CreateAgentRequest:
      type: object
      additionalProperties: false
      required:
      - name
      properties:
        name:
          type: string
          description: Unique name for this agent. Free-form human-readable label, 1-63 characters.
          minLength: 1
          maxLength: 63
        external_ref:
          type: string
          minLength: 1
          maxLength: 200
          description: 'Client-owned durable identity key. Unique within the org when present.
            Treat this as assign-once: create requests may set it; update requests may set
            it only while the agent has no existing external_ref, or repeat the current value
            idempotently. Required when `if_exists` is `adopt`.'
        if_exists:
          $ref: '#/components/schemas/IfExists'
        description:
          type: string
          description: Optional human-readable description.
          maxLength: 500
        color:
          type: string
          description: Display color for this agent (Mantine palette key, e.g. `indigo`).
            Optional; empty falls back to a hash-derived color.
          maxLength: 24
        model:
          type: string
          description: Model identifier for agents. Any id from `GET /v1/catalog/models`,
            including slash-bearing OpenRouter catalog ids, or an optionally `provider/`-prefixed
            id (e.g. `xai/grok-4`); bare known ids (e.g. `claude-sonnet-4-6`) are auto-detected.
            Empty falls back to the platform default.
        model_route:
          $ref: '#/components/schemas/AgentModelRoute'
          description: Default route for model calls made by this agent.
        tool_presentation:
          $ref: '#/components/schemas/AgentToolPresentation'
          description: Omit to use the create-time default, `flat`.
        tool_selectors:
          type: array
          description: The agent's tool grant. Omit for an agent with no granted actions;
            its intrinsic tools are unaffected.
          items:
            $ref: '#/components/schemas/ActionSelector'
        integration_access:
          type: array
          description: Per-provider connection rules. Omit for the defaults.
          items:
            $ref: '#/components/schemas/AgentIntegrationAccess'
        system_prompt:
          type: string
          description: Custom system prompt for agents. Empty uses the generated default.
        timeout_seconds:
          type: integer
          format: int64
          minimum: 0
          description: Per-turn execution timeout in seconds for this agent. Omit or `0` to
            use the platform default (600s / 10 minutes); a request's `operation.timeout_seconds`
            overrides it for that turn.
        compaction_policy:
          $ref: '#/components/schemas/SessionCompactionPolicy'
          description: Default session-compaction policy new sessions inherit from this agent.
        memory_enabled:
          type: boolean
          default: true
          description: Hard gate for runtime memory. When false, memory tools and automatic
            memory context are absent. Defaults to true.
        memory_context:
          $ref: '#/components/schemas/MemoryContextPolicy'
          description: Automatic memory delivery policy. Omit for the bounded index default.
        thinking_effort:
          $ref: '#/components/schemas/ThinkingEffort'
          description: Default reasoning-effort level new sessions inherit from this agent.
        tags:
          $ref: '#/components/schemas/TagMap'
          description: Initial labels used for filtering, ownership, or automation.
        owner:
          $ref: '#/components/schemas/ResourceOwner'
          description: Who governs this agent's configuration. Omit to use the creating human
            for a private agent; choose team deliberately for a restricted or organization
            agent.
        visibility:
          $ref: '#/components/schemas/AgentVisibility'
          description: Who this agent is for. Omit for `private` on the employee API.
        members:
          type: array
          description: |-
            The audience for a `restricted` or `private` agent, written in the same transaction as the agent row.

            Creating a `private` agent makes the caller its member unless the caller is an org admin and names another principal. Creating a `restricted` agent takes a list; the caller is added unless they are an org admin and omit themselves. Ignored for `organization`, which carries no member rows.
          items:
            type: string
          maxItems: 200
      example:
        name: PR reviewer
        description: Reviews pull requests for risky changes.
        color: teal
        model: claude-sonnet-4-6
        tool_presentation: flat
        tags:
          owner: product
    UpdateAgentRequest:
      type: object
      additionalProperties: false
      description: 'Mutable agent fields. The agent''s backing identity (`principal_id`, the
        machine principal created atomically with the agent) is intentionally absent: it is
        immutable. Reassigning identity is delete-and-recreate.'
      properties:
        name:
          type: string
          description: Free-form human-readable label, 1-63 characters; must be unique within
            the org.
          minLength: 1
          maxLength: 63
        external_ref:
          type: string
          minLength: 1
          maxLength: 200
          description: Assign-once client identity key, unique within the org. Accepted when
            the agent has no external_ref, or when it repeats the current value idempotently.
            Changing an already-set value returns 409.
        description:
          type: string
          description: Replacement description.
          maxLength: 500
        color:
          type: string
          description: Replacement display color (Mantine palette key, e.g. `indigo`). Pass
            empty string to clear and fall back to a hash-derived color.
          maxLength: 24
        model:
          type: string
          description: Replacement model identifier for agents (any id from `GET /v1/catalog/models`,
            including slash-bearing OpenRouter catalog ids, or an optionally `provider/`-prefixed
            id).
        model_route:
          $ref: '#/components/schemas/AgentModelRoute'
          description: Replacement default route for model calls made by this agent.
        tool_presentation:
          $ref: '#/components/schemas/AgentToolPresentation'
          description: Replacement tool presentation used by this agent's turns and channel
            replies.
        integration_access:
          type: array
          description: Replacement per-provider connection rules, as a whole. Omit to leave
            them untouched; send an empty array to clear them.
          items:
            $ref: '#/components/schemas/AgentIntegrationAccess'
        tool_selectors:
          type: array
          description: Replacement tool grant, as a whole. Omit to leave the agent's current
            grant untouched; send an empty array to revoke it.
          items:
            $ref: '#/components/schemas/ActionSelector'
        system_prompt:
          type: string
          description: Replacement system prompt for agents.
        timeout_seconds:
          type: integer
          format: int64
          minimum: 0
          description: Replacement per-turn execution timeout in seconds for this agent. `0`
            resets to the platform default (600s / 10 minutes); a request's `operation.timeout_seconds`
            overrides it for that turn.
        status:
          type: string
          enum:
          - active
          - inactive
          description: 'Replacement agent status: `active` or `inactive`. Use DELETE to delete
            the agent.'
        compaction_policy:
          $ref: '#/components/schemas/SessionCompactionPolicy'
          description: Replacement default session-compaction policy. Send an empty object
            to clear the default and fall back to server defaults.
        memory_enabled:
          type: boolean
          description: Replacement runtime memory hard gate. It cannot be overridden at invocation
            time.
        memory_context:
          $ref: '#/components/schemas/UpdateMemoryContextPolicy'
        thinking_effort:
          $ref: '#/components/schemas/ThinkingEffort'
          description: Replacement default reasoning-effort level. Send `inherit` to clear
            the default and leave the provider default in place.
        tags:
          $ref: '#/components/schemas/TagMap'
          description: Replacement labels; send an empty object to clear all tags.
        visibility:
          $ref: '#/components/schemas/AgentVisibility'
          description: Replacement audience. Widening (toward `organization`) republishes
            the agent's shared memory layer to the new audience and requires `confirm_visibility_change`;
            there is no technical undo, because republished knowledge cannot be un-read. Narrowing
            that would strand rows requires `stranded_disposition`.
        members:
          type: array
          description: 'Replacement audience for a `restricted` or `private` agent: the exact
            set after this call. Omit to leave membership unchanged. Ignored when the resulting
            visibility is `organization`, which deletes the member rows outright — "org-visible
            with a leftover member list" is not a representable state.'
          items:
            type: string
          maxItems: 200
        confirm_visibility_change:
          type: boolean
          default: false
          description: Acknowledges that widening republishes the agent's shared memory layer
            to the new audience and drops the current member list. A widening change without
            it returns `409` naming both counts.
        affected_resource_dispositions:
          type: array
          description: Exactly one decision for every row returned by the visibility impact
            preview. Delegations may be revoked or explicitly widened; contained rows may
            be made private or explicitly widened. Extra, duplicate, and omitted rows are
            refused.
          items:
            $ref: '#/components/schemas/AgentAudienceResourceDisposition'
        stranded_disposition:
          type: string
          enum:
          - retain
          - delete
          description: |-
            What happens to the memory partitions and sessions of principals who fall outside a narrowed audience.

            `retain` keeps their partitions and sessions, readable only by org admins. `delete` additionally erases their private memory partitions, and only an org admin may choose it. A narrowing change that would strand rows and names neither returns `409`.
    MemoryKind:
      type: string
      enum:
      - fact
      - preference
      - episode
      - summary
      description: 'Classifies a memory entry. Kinds carry different retention and compaction
        semantics: facts and preferences are durable, episodes are the primary input to compaction,
        and a summary is the compacted product of other entries.'
    MemorySearchMode:
      type: string
      enum:
      - keyword
      - semantic
      - hybrid
      description: Memory search ranking mode.
    MemorySearchCoverage:
      type: object
      additionalProperties: false
      required:
      - indexed_entries
      - total_entries
      - complete
      properties:
        indexed_entries:
          type: integer
          minimum: 0
          description: Number of this agent's current entries with a ready semantic search
            projection, before any `kind` filter.
        total_entries:
          type: integer
          minimum: 0
          description: Number of this agent's current entries, before any `kind` filter.
        complete:
          type: boolean
          description: Whether every current entry has a ready projection. When false, semantic
            and hybrid results rank only the indexed subset.
    AgentMemory:
      type: object
      additionalProperties: false
      description: 'Summary across an agent''s shared and user-private memory partitions:
        how many entries it holds, a breakdown by kind, and when it last changed.'
      required:
      - agent_id
      - entry_count
      - counts_by_kind
      properties:
        agent_id:
          type: string
          description: The agent that owns this memory.
        entry_count:
          type: integer
          description: Number of entries currently held.
        counts_by_kind:
          type: object
          additionalProperties:
            type: integer
          description: Entry counts keyed by memory kind.
        updated_at:
          type: string
          format: date-time
          description: When any entry was last changed, when there are entries.
    AgentMemoryEntry:
      type: object
      additionalProperties: false
      description: A single durable memory in an agent's shared or user-private partition,
        identified by a stable key within that partition.
      required:
      - key
      - user_id
      - kind
      - entry_id
      - importance
      - pinned
      - version
      - created_at
      - updated_at
      properties:
        key:
          type: string
          description: Stable identifier the agent chose for this memory.
        user_id:
          type: string
          description: User principal ID for private memory; empty for shared memory.
        kind:
          $ref: '#/components/schemas/MemoryKind'
        summary:
          type: string
          description: Short one-line summary shown in the agent's memory index.
        content:
          type: string
          description: The remembered content.
        metadata:
          type: object
          additionalProperties: true
          description: Structured metadata stored alongside the memory (provenance, tags,
            …).
        importance:
          type: integer
          description: Rank from 0 to 100; higher ranks sooner in recall and is kept longer
            under the memory cap.
        pinned:
          type: boolean
          description: Whether the entry is guaranteed in the memory index and exempt from
            the memory cap.
        entry_id:
          type: string
          description: Identifier of this memory entry.
        version:
          type: integer
          description: Monotonic version, incremented on each update.
        created_at:
          type: string
          format: date-time
          description: When the entry was first remembered.
        updated_at:
          type: string
          format: date-time
          description: When the entry was last updated.
    AgentMemoryEntryListResponse:
      type: object
      additionalProperties: false
      required:
      - items
      - has_more
      properties:
        items:
          type: array
          description: Memory entries in the current page.
          items:
            $ref: '#/components/schemas/AgentMemoryEntry'
        has_more:
          type: boolean
          description: Whether more entries follow this page.
        next_cursor:
          type: string
          description: Cursor to fetch the next page, when has_more is true.
        search_coverage:
          $ref: '#/components/schemas/MemorySearchCoverage'
          description: Present for semantic and hybrid search.
    AgentMemoryChangeOperation:
      type: string
      enum:
      - created
      - updated
      - deleted
    AgentMemoryChangeReason:
      type: string
      enum:
      - remembered
      - api
      - soft_cap
      - promoted
      - promotion_reverted
      description: Why an entry changed. `remembered` is a run writing memory, `api` a direct
        write, `soft_cap` an eviction. `promoted` and `promotion_reverted` are the two halves
        of the explicit, attributed promotion act — the only path from a person's private
        partition into the agent's shared layer, and its undo.
    AgentMemoryChange:
      type: object
      additionalProperties: false
      required:
      - id
      - agent_id
      - user_id
      - memory_entry_id
      - memory_key
      - operation
      - version
      - reason
      - created_at
      properties:
        id:
          type: string
        agent_id:
          type: string
        user_id:
          type: string
          description: User principal ID for the changed private partition; empty for shared
            memory.
        memory_entry_id:
          type: string
        memory_key:
          type: string
        operation:
          $ref: '#/components/schemas/AgentMemoryChangeOperation'
        version:
          type: integer
          minimum: 1
          description: Entry version at the time of this mutation, matching `AgentMemoryEntry.version`.
        reason:
          $ref: '#/components/schemas/AgentMemoryChangeReason'
        actor_id:
          type: string
        created_at:
          type: string
          format: date-time
    AgentMemoryChangeListResponse:
      type: object
      additionalProperties: false
      required:
      - items
      - has_more
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AgentMemoryChange'
        has_more:
          type: boolean
        next_cursor:
          type: string
          description: Feed position after this page. Always present, including when `items`
            is empty; pass it back as `after` on the next request.
    SaveAgentMemoryEntryRequest:
      type: object
      additionalProperties: false
      description: Content and partition for a memory entry. The key comes from the path.
      required:
      - content
      properties:
        user_id:
          type: string
          default: ''
          maxLength: 200
          description: User principal ID for private memory. It must identify a current human
            member of this organization. Omit or send empty for shared memory.
        content:
          type: string
          minLength: 1
          maxLength: 16384
          description: The content to remember.
        summary:
          type: string
          maxLength: 140
          description: Optional short one-line summary (≤140 chars) shown in the memory index.
        kind:
          $ref: '#/components/schemas/MemoryKind'
        metadata:
          type: object
          additionalProperties: true
          description: Optional structured metadata to store alongside the memory.
        importance:
          type: integer
          minimum: 0
          maximum: 100
          description: Optional importance from 0 to 100; higher is kept longer during compaction.
        pinned:
          type: boolean
          description: Pin to exempt this memory from compaction.
    ContextIncludeParam:
      type: string
      enum:
      - context
    SessionTextBlock:
      type: object
      additionalProperties: true
      required:
      - type
      - text
      description: Assistant or caller text.
      properties:
        type:
          type: string
          enum:
          - text
        text:
          type: string
          description: The text content.
    SessionThinkingBlock:
      type: object
      additionalProperties: true
      required:
      - type
      - thinking
      description: An extended-reasoning block produced by a reasoning model.
      properties:
        type:
          type: string
          enum:
          - thinking
        thinking:
          type: string
          description: The reasoning text.
        signature:
          type: string
          description: Provider signature for the reasoning block, when present.
    SessionResolvedAction:
      type: object
      additionalProperties: false
      required:
      - name
      - input
      description: Canonical action resolved by a catalog tool dispatch.
      properties:
        name:
          type: string
          description: Canonical action name, before provider-safe wire-name mangling.
        input:
          type: object
          additionalProperties: true
          description: Resolved action arguments. Meta-router command wrappers are removed.
    SessionToolUseBlock:
      type: object
      additionalProperties: true
      required:
      - type
      - id
      - name
      - input
      description: A tool call the agent issued.
      properties:
        type:
          type: string
          enum:
          - tool_use
        id:
          type: string
          description: Tool-call id; the matching tool_result references it.
        name:
          type: string
          description: Tool name.
        input:
          type: object
          additionalProperties: true
          description: Tool input arguments.
        status:
          type: string
          description: Known values are pending, running, ok, error, and cancelled; unknown
            values must be preserved.
        progress:
          type: object
          additionalProperties: true
          description: Latest in-flight progress snapshot. Absent on final transcript rows.
        resolved_action:
          $ref: '#/components/schemas/SessionResolvedAction'
    SessionContentBlock:
      oneOf:
      - $ref: '#/components/schemas/SessionTextBlock'
      - $ref: '#/components/schemas/SessionThinkingBlock'
      - $ref: '#/components/schemas/SessionToolUseBlock'
      - $ref: '#/components/schemas/SessionToolResultBlock'
      - $ref: '#/components/schemas/SessionImageBlock'
      - $ref: '#/components/schemas/SessionDocumentBlock'
      - $ref: '#/components/schemas/SessionReminderBlock'
      discriminator:
        propertyName: type
        mapping:
          text: '#/components/schemas/SessionTextBlock'
          thinking: '#/components/schemas/SessionThinkingBlock'
          tool_use: '#/components/schemas/SessionToolUseBlock'
          tool_result: '#/components/schemas/SessionToolResultBlock'
          image: '#/components/schemas/SessionImageBlock'
          document: '#/components/schemas/SessionDocumentBlock'
          reminder: '#/components/schemas/SessionReminderBlock'
      description: One content block in a session transcript message — the canonical, frozen
        JSON shape Mobius persists and replays, discriminated by `type`. The variants are
        `text`, `thinking`, `tool_use`, `tool_result`, `image`, and `document`, plus host-managed
        `reminder` blocks when caller runtime context is explicitly included. Each variant
        permits provider-specific extra fields (citations, signatures, cache hints, and the
        like), and unknown fields are preserved rather than rejected, so the transcript round-trips
        losslessly across providers.
    SessionToolResultBlock:
      type: object
      additionalProperties: true
      required:
      - type
      - tool_use_id
      description: The result of a tool call.
      properties:
        type:
          type: string
          enum:
          - tool_result
        tool_use_id:
          type: string
          description: The tool_use id this result answers.
        content:
          description: Result payload — a string, or an array of typed sub-blocks using the
            same canonical block shape as a transcript message.
          oneOf:
          - type: string
          - type: array
            items:
              $ref: '#/components/schemas/SessionContentBlock'
        is_error:
          type: boolean
          description: True when the tool reported a failure.
    SessionImageSource:
      type: object
      additionalProperties: true
      required:
      - type
      description: Canonical image source descriptor. Known source types are `base64` (`media_type`
        plus `data`), `url` (`url`), and Mobius-managed `artifact` (`artifact_id`). Provider-specific
        extensions are preserved.
      properties:
        type:
          type: string
          enum:
          - base64
          - url
          - artifact
        media_type:
          type: string
          description: MIME type for base64 content.
        data:
          type: string
          description: Base64 image payload.
        url:
          type: string
          format: uri
          description: Fetchable image URL for a URL source.
        artifact_id:
          type: string
          description: Mobius artifact id returned by the session attachment endpoint.
    SessionImageBlock:
      type: object
      additionalProperties: true
      required:
      - type
      description: An image block, e.g. multimodal caller input.
      properties:
        type:
          type: string
          enum:
          - image
        source:
          $ref: '#/components/schemas/SessionImageSource'
        media_type:
          type: string
          description: Server-detected MIME type for an artifact-backed image.
        title:
          type: string
          description: Original filename for an artifact-backed image.
        size_bytes:
          type: integer
          format: int64
          description: Server-observed byte size for an artifact-backed image.
    SessionDocumentSource:
      type: object
      additionalProperties: true
      required:
      - type
      description: Canonical document source descriptor. Known source types are `base64` (`media_type`
        plus `data`), `url` (`url`), `text` (`media_type` plus `data`), provider-managed `file`
        (`file_id`), and Mobius-managed `artifact` (`artifact_id`). Provider-managed file
        references are not portable across model providers; artifact sources are resolved
        only after re-checking their session binding.
      properties:
        type:
          type: string
          enum:
          - base64
          - url
          - text
          - file
          - artifact
          description: Source discriminator; known values are base64, url, text, file, and
            artifact.
        media_type:
          type: string
          description: MIME type for base64 or text content.
        data:
          type: string
          description: Base64 payload or literal text, depending on source type. Inline payloads
            are limited to 256 KiB after base64 decoding or as UTF-8 text; larger documents
            must use an artifact source created by the session attachment endpoint.
        url:
          type: string
          format: uri
          description: Fetchable document URL for a URL source.
        file_id:
          type: string
          description: Provider-managed file identifier for a file source.
        artifact_id:
          type: string
          description: Mobius artifact id returned by the session attachment endpoint.
    SessionDocumentBlock:
      type: object
      additionalProperties: true
      required:
      - type
      - source
      description: A canonical document block. Mobius persists this provider-neutral block
        after translating supported caller dialects such as OpenAI `input_file` and Chat Completions
        `file` blocks. Base64 data stays in `source.data`; clients must not render or log
        that field.
      properties:
        type:
          type: string
          enum:
          - document
        source:
          $ref: '#/components/schemas/SessionDocumentSource'
        title:
          type: string
          description: Human-readable filename or document title, when supplied.
        media_type:
          type: string
          description: Server-detected MIME type for an artifact-backed document.
        size_bytes:
          type: integer
          format: int64
          description: Server-observed byte size for an artifact-backed document.
        page_count:
          type: integer
          minimum: 1
          description: Parsed page count for an artifact-backed PDF.
        context:
          type: string
          description: Optional model-facing context for the document.
        citations:
          type: object
          additionalProperties: true
          description: Provider citation options, when supported.
    SessionReminderBlock:
      type: object
      additionalProperties: true
      required:
      - type
      - name
      - tier
      - content
      description: Host-managed runtime context returned only when the request explicitly
        includes caller-supplied context.
      properties:
        type:
          type: string
          enum:
          - reminder
        name:
          type: string
          description: Model-visible reminder name, including the `app-` namespace.
        tier:
          type: string
          enum:
          - contextual
          - operator
          description: Reminder authority tier.
        content:
          type: string
          description: Reminder content rendered to the model.
    SessionMessage:
      type: object
      additionalProperties: false
      description: One persisted message or compaction entry in a session transcript.
      required:
      - id
      - session_id
      - agent_id
      - role
      - content
      - entry_type
      - sequence
      - created_at
      properties:
        id:
          type: string
          description: Stable message identifier.
        session_id:
          type: string
          description: Session this message belongs to.
        agent_id:
          type: string
          description: Agent container executing the parent session.
        role:
          $ref: '#/components/schemas/SessionMessageRole'
          description: Role of this message in the transcript.
        content:
          type: array
          description: Ordered canonical content blocks (text, thinking, tool_use, tool_result,
            image, document).
          items:
            $ref: '#/components/schemas/SessionContentBlock'
        entry_type:
          $ref: '#/components/schemas/SessionMessageEntryType'
          description: Whether this row is a normal message or a compaction summary.
        covers_through_sequence:
          type: integer
          description: For `compaction` messages, the highest sequence number this summary
            covers.
        sequence:
          type: integer
          description: Monotonic per-session sequence number assigned at append time.
        turn_id:
          type: string
          description: AgentTurn that produced this message. Run, step, and channel identity
            for the message are read from this turn. Absent for compaction summaries and messages
            not tied to a turn.
        metadata:
          type: object
          additionalProperties: true
          description: Free-form caller metadata for this message.
        created_at:
          type: string
          format: date-time
          description: Server timestamp when the message was appended.
    SessionMessageListResponse:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          description: Messages in this page, ordered by `sequence` ascending.
          items:
            $ref: '#/components/schemas/SessionMessage'
        has_more:
          type: boolean
          description: True when more messages exist past this page in the query's scan direction.
        next_sequence:
          type: integer
          format: int64
          description: Sequence of the last (highest) item — pass back as `after_sequence`
            to page forward (newer).
        prev_sequence:
          type: integer
          format: int64
          description: Sequence of the first (lowest) item — pass back as `before_sequence`
            with `order=desc` to page backward (older). After paginating history, open the
            stream with `after_sequence=next_sequence` to receive the in-flight turn and everything
            after it — the stream and the messages API share one `sequence` cursor, so there
            is no overlap and no gap.
    Skill:
      type: object
      additionalProperties: false
      description: Reusable instruction bundle assignable to agents.
      required:
      - id
      - name
      - source
      - instructions
      - owner
      - visibility
      - container
      - posture
      - created_at
      - updated_at
      properties:
        id:
          type: string
          description: Skill ID.
        name:
          type: string
          description: Human-readable skill name.
        description:
          type: string
          description: Markdown description of the skill's purpose.
        source:
          type: string
          enum:
          - system
          - custom
          description: Ownership and mutability of the Skill. `system` is built-in and `custom`
            is user-managed.
        instructions:
          type: string
          description: Markdown instructions loaded when the skill is active.
        owner:
          $ref: '#/components/schemas/ResourceOwner'
        visibility:
          $ref: '#/components/schemas/ResourceVisibility'
        container:
          $ref: '#/components/schemas/ResourceContainer'
        posture:
          $ref: '#/components/schemas/ResourcePosture'
        allowed_tools:
          type: array
          description: |-
            Canonical action names, wildcard selectors, or group references naming the actions this skill needs. Uses the same selector vocabulary as agent tool grants.

            The grant takes effect when an agent invokes the skill, and lasts for the rest of that turn: calls to actions outside it are refused with an error naming the skill. Assigning a skill narrows nothing on its own, and an empty list declares nothing and narrows nothing. Skills invoked in the same turn compose as a union, so this keeps a skill on task rather than sandboxing it. Mobius memory and self-awareness tools are always exempt, and a skill can never widen an agent beyond its own tool selectors.
          items:
            type: string
        tags:
          $ref: '#/components/schemas/TagMap'
          description: Labels to apply to the skill.
        created_by:
          type: string
          description: ID of the principal who created this skill.
        updated_by:
          type: string
          description: ID of the principal who last updated this skill.
        created_at:
          type: string
          format: date-time
          description: Record creation timestamp.
        updated_at:
          type: string
          format: date-time
          description: Last update timestamp.
      example:
        id: skill_7n4q8x2m9p5v3r6t
        name: Pull request review
        description: Review pull requests for correctness and risk.
        source: custom
        instructions: Check the diff and leave concise findings.
        allowed_tools:
        - github.create_review_comment
        tags:
          owner: product
        created_by: user_2f9s3k4m5n6p7q8r
        updated_by: user_2f9s3k4m5n6p7q8r
        created_at: '2026-06-15T14:30:00Z'
        updated_at: '2026-06-15T14:30:00Z'
    AgentTurnErrorScope:
      type: string
      enum:
      - agent_turn
      description: Present when the overall agent-turn budget was exhausted.
    AgentTurnOutputSource:
      type: string
      enum:
      - tool
      - text
      description: 'Provenance of a completed turn''s structured `output`: `tool` when the
        agent submitted it through the reserved `mobius_submit_output` tool, or `text` when
        Mobius accepted a schema-valid final message as a fallback.'
    AgentTurn:
      type: object
      additionalProperties: false
      description: One attempt of an agent working on the session — the unit that produces
        a transcript. A turn is triggered by a direct send to the session or an inbound channel
        message (channel_exchange_id). Its messages are read via the turn's transcript endpoint.
      required:
      - id
      - agent_id
      - session_id
      - attempt
      - status
      - created_at
      - updated_at
      properties:
        id:
          type: string
          description: Stable turn identifier.
        agent_id:
          type: string
          description: Agent that ran this turn.
        session_id:
          type: string
          description: Session this turn's transcript was appended to.
        channel_exchange_id:
          type: string
          description: Inbound channel exchange that triggered this turn. Absent for direct
            sends.
        deferrable:
          type: boolean
          description: True for scheduled work that yields admission priority to direct turns.
        routine_name:
          type: string
          description: Display-only routine name for a scheduled turn's live state.
        attempt:
          type: integer
          description: 1-based attempt number; retries create new turns.
        status:
          $ref: '#/components/schemas/AgentTurnStatus'
          description: Current lifecycle status of the agent turn.
        seq:
          type: integer
          description: Per-session ordering hint (cosmetic; turns are ordered by creation
            time).
        error_type:
          type: string
          description: Machine-readable failure category when the turn failed.
        error_message:
          type: string
          description: Human-readable failure detail when the turn failed.
        error_scope:
          $ref: '#/components/schemas/AgentTurnErrorScope'
        output:
          type: object
          additionalProperties: true
          description: The validated structured output. Present only on a `completed` turn
            that declared an output schema. Read this instead of parsing the transcript.
        output_source:
          $ref: '#/components/schemas/AgentTurnOutputSource'
          description: 'Where `output` came from: a `mobius_submit_output` submission (`tool`)
            or the schema-valid final-text fallback (`text`).'
        usage:
          $ref: '#/components/schemas/AgentTurnUsage'
          description: Token usage recorded when the turn completed. Absent on turns that
            never reached the model and on turns that failed.
        effective_timeout_seconds:
          type: integer
          format: int64
          description: Authoritative active-execution budget selected for the turn.
        created_at:
          type: string
          format: date-time
          description: Time the turn was created.
        updated_at:
          type: string
          format: date-time
          description: Time the turn was last updated.
        completed_at:
          type: string
          format: date-time
          description: When the turn reached a terminal status.
    AgentTurnUsage:
      type: object
      additionalProperties: true
      description: Aggregate token accounting for one completed turn, summed over every LLM
        call the turn made. It is a usage report, not a bill — see the billing usage events
        for charged amounts.
      properties:
        input_tokens:
          type: integer
          description: Fresh (uncached) prompt tokens. Cache traffic is reported separately
            and is never folded in here.
        output_tokens:
          type: integer
          description: Tokens the model generated, including reasoning tokens.
        cache_read_input_tokens:
          type: integer
          description: Prompt tokens served from the provider's prompt cache. Omitted when
            zero.
        cache_creation_input_tokens:
          type: integer
          description: Prompt tokens written into the provider's prompt cache. Omitted when
            zero.
        reasoning_tokens:
          type: integer
          description: Hidden reasoning tokens billed as output but absent from the visible
            reply. Omitted when zero or unreported by the provider.
        calls:
          type: integer
          description: LLM calls folded into this turn's totals. Omitted when zero.
      example:
        input_tokens: 1840
        output_tokens: 412
        cache_read_input_tokens: 20480
        calls: 3
    AgentTurnListResponse:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          description: Turns in this session, ordered by creation time.
          items:
            $ref: '#/components/schemas/AgentTurn'
        has_more:
          type: boolean
          description: True when more turns exist past this page.
        next_cursor:
          type: string
          nullable: true
          description: Opaque cursor to pass as `cursor` on the next request. Null when `has_more`
            is false.
    SessionListResponse:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          description: The list of results for this page.
          items:
            $ref: '#/components/schemas/Session'
        has_more:
          type: boolean
          description: True when more sessions exist past this page.
        next_cursor:
          type: string
          nullable: true
          description: Opaque cursor for the next page — pass back as `cursor`. Null when
            `has_more` is false.
    UpdateSessionRequest:
      type: object
      additionalProperties: false
      description: Mutable display and lifecycle fields for a session.
      properties:
        title:
          type: string
          description: Human-readable session title.
        status:
          $ref: '#/components/schemas/SessionStatus'
          description: Lifecycle status. `active` restores archived sessions; `deleted` is
            terminal.
        compaction_policy:
          $ref: '#/components/schemas/SessionCompactionPolicy'
          description: Partial patch to the session's compaction policy. Only the supplied
            fields change; omitted fields keep their current values.
        thinking_effort:
          $ref: '#/components/schemas/ThinkingEffort'
          description: Reasoning-effort override for this session. Send a level to override,
            or `inherit` to clear it and fall back to the agent default. Omit to leave the
            current value unchanged.
    SessionTranscriptMessage:
      type: object
      additionalProperties: false
      required:
      - id
      - session_id
      - agent_id
      - role
      - content
      - entry_type
      - status
      - turn_index
      - sequence
      - created_at
      properties:
        id:
          type: string
        session_id:
          type: string
        agent_id:
          type: string
        turn_id:
          type: string
          nullable: true
        role:
          $ref: '#/components/schemas/SessionMessageRole'
        content:
          type: array
          items:
            $ref: '#/components/schemas/SessionContentBlock'
        entry_type:
          type: string
          description: Known values include message and compaction; unknown values must be
            preserved.
        status:
          type: string
          description: Known values are streaming and final; unknown values must be preserved.
        turn_index:
          type: integer
          nullable: true
        sequence:
          type: integer
          nullable: true
        covers_through_sequence:
          type: integer
          nullable: true
        metadata:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
    SessionTranscriptTurn:
      type: object
      additionalProperties: false
      required:
      - id
      - agent_id
      - session_id
      - attempt
      - status
      - created_at
      - updated_at
      properties:
        id:
          type: string
        agent_id:
          type: string
        session_id:
          type: string
        channel_exchange_id:
          type: string
        attempt:
          type: integer
        status:
          type: string
          description: Known AgentTurn status; unknown values must be preserved.
        seq:
          type: integer
        error_type:
          type: string
        error_message:
          type: string
        usage:
          $ref: '#/components/schemas/AgentTurnUsage'
          description: Token usage recorded when the turn completed. Identical to the `usage`
            on the turn resource, and identical on the bootstrap and cursored reads of this
            snapshot.
        output:
          type: object
          additionalProperties: true
          description: The validated structured output, delivered on the terminal `turn.upsert`
            frame. Present only on a `completed` turn that declared an output schema.
        output_source:
          $ref: '#/components/schemas/AgentTurnOutputSource'
          description: Where `output` came from (`tool` or `text`).
        wait:
          $ref: '#/components/schemas/SessionTranscriptWait'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
    SessionTranscriptSnapshot:
      type: object
      additionalProperties: false
      required:
      - messages
      - turns
      - interactions
      - has_more
      - resume_cursor
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/SessionTranscriptMessage'
        turns:
          type: array
          items:
            $ref: '#/components/schemas/SessionTranscriptTurn'
        interactions:
          type: array
          description: Pending interactions raised by agent tool calls in this session.
          items:
            $ref: '#/components/schemas/Interaction'
        has_more:
          type: boolean
          description: Whether next_page_token continues this fixed transcript cut.
        resume_cursor:
          type: string
        next_page_token:
          type: string
          description: Opaque continuation present when has_more is true.
    SessionTranscriptFrame:
      oneOf:
      - $ref: '#/components/schemas/MessageUpsertFrame'
      - $ref: '#/components/schemas/MessageBlockFrame'
      - $ref: '#/components/schemas/MessageBlockPatchFrame'
      - $ref: '#/components/schemas/MessageDeltaFrame'
      - $ref: '#/components/schemas/TurnUpsertFrame'
      - $ref: '#/components/schemas/InteractionUpsertFrame'
      - $ref: '#/components/schemas/StreamReadyFrame'
      - $ref: '#/components/schemas/StreamEndFrame'
      discriminator:
        propertyName: event_type
        mapping:
          message.upsert: '#/components/schemas/MessageUpsertFrame'
          message.block: '#/components/schemas/MessageBlockFrame'
          message.block.patch: '#/components/schemas/MessageBlockPatchFrame'
          message.delta: '#/components/schemas/MessageDeltaFrame'
          turn.upsert: '#/components/schemas/TurnUpsertFrame'
          interaction.upsert: '#/components/schemas/InteractionUpsertFrame'
          stream.ready: '#/components/schemas/StreamReadyFrame'
          stream.end: '#/components/schemas/StreamEndFrame'
    MessageUpsertFrame:
      allOf:
      - $ref: '#/components/schemas/SessionTranscriptMessage'
      - type: object
        required:
        - event_type
        properties:
          event_type:
            type: string
            enum:
            - message.upsert
    MessageBlockFrame:
      type: object
      additionalProperties: false
      required:
      - event_type
      - session_id
      - message_id
      - content_index
      - block
      properties:
        event_type:
          type: string
          enum:
          - message.block
        session_id:
          type: string
        message_id:
          type: string
        content_index:
          type: integer
          minimum: 0
        block:
          $ref: '#/components/schemas/SessionContentBlock'
    MessageBlockPatchFrame:
      type: object
      additionalProperties: false
      required:
      - event_type
      - session_id
      - message_id
      - content_index
      properties:
        event_type:
          type: string
          enum:
          - message.block.patch
        session_id:
          type: string
        message_id:
          type: string
        content_index:
          type: integer
          minimum: 0
        status:
          type: string
          description: Known values are pending, running, ok, error, and cancelled.
        progress:
          type: object
          nullable: true
          additionalProperties: true
        resolved_action:
          $ref: '#/components/schemas/SessionResolvedAction'
    MessageDeltaFrame:
      type: object
      additionalProperties: false
      required:
      - event_type
      - session_id
      - message_id
      - content_index
      properties:
        event_type:
          type: string
          enum:
          - message.delta
        session_id:
          type: string
        message_id:
          type: string
        content_index:
          type: integer
          minimum: 0
        text:
          type: string
        thinking:
          type: string
    TurnUpsertFrame:
      allOf:
      - $ref: '#/components/schemas/SessionTranscriptTurn'
      - type: object
        required:
        - event_type
        properties:
          event_type:
            type: string
            enum:
            - turn.upsert
    InteractionUpsertFrame:
      allOf:
      - $ref: '#/components/schemas/Interaction'
      - type: object
        required:
        - event_type
        properties:
          event_type:
            type: string
            enum:
            - interaction.upsert
    StreamReadyFrame:
      type: object
      additionalProperties: false
      required:
      - event_type
      - session_id
      - resume_cursor
      properties:
        event_type:
          type: string
          enum:
          - stream.ready
        session_id:
          type: string
        resume_cursor:
          type: string
    SessionStreamFrame:
      anyOf:
      - $ref: '#/components/schemas/SessionUserMessagePayload'
      - $ref: '#/components/schemas/AgentMessagePayload'
      - $ref: '#/components/schemas/CompactionStartedPayload'
      - $ref: '#/components/schemas/CompactionCreatedPayload'
      - $ref: '#/components/schemas/CompactionFailedPayload'
      - $ref: '#/components/schemas/TurnStartedPayload'
      - $ref: '#/components/schemas/TurnWaitingPayload'
      - $ref: '#/components/schemas/TurnCompletedPayload'
      - $ref: '#/components/schemas/TurnFailedPayload'
      - $ref: '#/components/schemas/TurnCancelledPayload'
      - $ref: '#/components/schemas/NudgeEventPayload'
      - $ref: '#/components/schemas/SessionMessagePreviewFrame'
      - $ref: '#/components/schemas/SessionResyncFrame'
      - $ref: '#/components/schemas/StreamEndFrame'
      - $ref: '#/components/schemas/ToolCallPayload'
      - $ref: '#/components/schemas/ToolResultPayload'
      - $ref: '#/components/schemas/GenerationDeltaFrame'
      description: |-
        JSON payload of a single `data:` line on the session SSE stream, paired with an `event: <event type>` line.

        The `event:` line is the authoritative frame selector. This union is reference-only: several payloads are structurally identical (e.g. `user.message` and `agent.message`) or permissive open objects, so the `data:` body alone cannot be shape-matched to a single variant. Consumers MUST dispatch on the `event:` name and decode the body as the corresponding payload — never validate the bare body against the union.

        Durable message frames (`user.message`, `agent.message`, `compaction.created`) are replayed from the transcript and carry an SSE `id: <sequence>` — that `sequence` is the only cursor a client persists for `after_sequence` / `Last-Event-ID` resume. Terminal `turn.*` frames mark the active turn settling. `session.message.preview`, `session.resync`, `nudge.queued`, `nudge.delivered`, `nudge.cancelled`, `tool.call`, `tool.result`, `compaction.started`, `compaction.failed`, and `generation.delta` frames are live-only and carry no `id:`. `stream.end` is the final envelope on every deliberate server-side close and also carries no `id:`.
    SessionMessagePreviewFrame:
      type: object
      additionalProperties: true
      required:
      - event_type
      - id
      - session_id
      - turn_id
      - role
      - entry_type
      - content
      - metadata
      description: Live-only, SessionMessage-compatible transcript preview for an in-flight
        agent response segment. It carries no durable `seq`, transcript `sequence`, or stable
        `message_id`; the committed row later replaces it by `turn_id` plus `metadata.response_message_index`.
      properties:
        event_type:
          type: string
          enum:
          - session.message.preview
        id:
          type: string
          description: Provisional live id. Do not persist or use as the durable message id.
        session_id:
          type: string
          description: Session this preview belongs to.
        agent_id:
          type: string
          description: Agent container executing the parent session, when known.
        turn_id:
          type: string
          description: Agent turn that produced the preview.
        live_sequence:
          type: integer
          format: int64
          description: Monotonic per-turn sequence across all live-only session frames; use
            to detect dropped live frames.
        role:
          $ref: '#/components/schemas/SessionMessageRole'
        entry_type:
          $ref: '#/components/schemas/SessionMessageEntryType'
        content:
          type: array
          description: Ordered content blocks using the same canonical block shape as SessionMessage.
          items:
            $ref: '#/components/schemas/SessionContentBlock'
        metadata:
          type: object
          additionalProperties: true
          description: Must include `response_message_index`, the handoff key shared with
            the durable transcript row.
        emitted_at:
          type: string
          format: date-time
          description: Server timestamp when this live preview frame was emitted.
    SessionLiveSnapshot:
      type: object
      additionalProperties: false
      required:
      - session_id
      - turn_id
      - frames
      - last_live_sequence
      - updated_at
      description: Ephemeral live transcript snapshot for an in-flight turn. Deployments with
        shared cache support make it available across backend replicas.
      properties:
        session_id:
          type: string
        turn_id:
          type: string
        frames:
          type: array
          description: Live-only frame payloads in live_sequence order. Each item has the
            same shape as its SSE `data:` payload.
          items:
            type: object
            additionalProperties: true
        last_live_sequence:
          type: integer
          format: int64
          description: Highest live_sequence included in `frames`, or 0 when no live frames
            are available.
        updated_at:
          type: string
          format: date-time
          description: Server timestamp when the snapshot was last updated.
    SessionResyncFrame:
      type: object
      additionalProperties: false
      required:
      - event_type
      - session_id
      - reason
      description: Live-only marker asking the client to reconcile the active turn from the
        live snapshot endpoint.
      properties:
        event_type:
          type: string
          enum:
          - session.resync
        session_id:
          type: string
        reason:
          type: string
          description: Machine-readable resync reason, e.g. `subscriber_overflow`.
    StreamEndFrame:
      type: object
      additionalProperties: false
      required:
      - event_type
      - session_id
      - reason
      description: Final envelope on a deliberate session-stream close. An idle close means
        no non-terminal turn remains; a rotate close asks the client to reconnect immediately
        with the same durable transcript cursor.
      properties:
        event_type:
          type: string
          enum:
          - stream.end
        session_id:
          type: string
        reason:
          type: string
          enum:
          - idle
          - rotate
    SessionUserMessagePayload:
      type: object
      additionalProperties: true
      required:
      - message_id
      - sequence
      - role
      - content
      description: 'Payload of a `user.message` content event: the durable encoding of one
        non-assistant transcript message — caller input, or a user-role message carrying tool
        results. It mirrors the transcript row exactly, carrying the message identity (`message_id`
        + `sequence`) and full content. Replaying these events reconstructs the same view
        as reading the messages API.'
      properties:
        message_id:
          type: string
          description: Id of the transcript message this event mirrors.
        sequence:
          type: integer
          format: int64
          description: The mirrored message's per-session transcript sequence.
        role:
          $ref: '#/components/schemas/SessionMessageRole'
          description: Transcript role of the message (e.g. `user`, `system`, or a user-role
            message carrying tool results); never `assistant`.
        content:
          type: array
          description: The message's full canonical content blocks (text, tool_result, …).
          items:
            $ref: '#/components/schemas/SessionContentBlock'
        turn_id:
          type: string
          description: The agent turn that produced this message, when applicable.
    TurnStartedPayload:
      type: object
      additionalProperties: true
      description: 'Payload of a `turn.started` event. Empty: the turn is identified by the
        envelope `turn_id`, so nothing is duplicated in the payload.'
    AgentMessagePayload:
      type: object
      additionalProperties: true
      required:
      - message_id
      - sequence
      - role
      - content
      description: 'Payload of an `agent.message` content event: the durable encoding of one
        assistant transcript message. Carries the message''s full structured content (text,
        thinking, tool_use) plus the message identity (`message_id` + `sequence`). Replaying
        these events reconstructs the same view as reading the messages API.'
      properties:
        message_id:
          type: string
          description: Id of the transcript message this event mirrors.
        sequence:
          type: integer
          format: int64
          description: The mirrored message's per-session transcript sequence.
        role:
          type: string
          enum:
          - assistant
          description: Always `assistant`.
        content:
          type: array
          description: The assistant message's full canonical content blocks (text, thinking,
            tool_use).
          items:
            $ref: '#/components/schemas/SessionContentBlock'
        turn_id:
          type: string
          description: The agent turn that produced this message.
    ToolCallPayload:
      type: object
      additionalProperties: true
      description: 'Payload of a live-only `tool.call` frame — an in-flight preview that a
        tool was invoked during the active turn. Never persisted and carries no sequence:
        the durable record of the call is the `tool_use` content block of the assistant message,
        delivered as an `agent.message` event when the turn commits.'
      properties:
        tool_call_id:
          type: string
        tool_name:
          type: string
        input:
          type: object
          additionalProperties: true
        live_sequence:
          type: integer
          format: int64
          description: Monotonic per-turn sequence across all live-only session frames; use
            to detect dropped live frames.
        emitted_at:
          type: string
          format: date-time
          description: Server timestamp when this live preview frame was emitted.
    ToolResultPayload:
      type: object
      additionalProperties: true
      description: 'Payload of a live-only `tool.result` frame — an in-flight preview that
        a tool returned during the active turn. Never persisted and carries no sequence: the
        durable record is the `tool_result` content block of the following transcript message,
        delivered as a `user.message` event when the turn commits.'
      properties:
        tool_call_id:
          type: string
        tool_name:
          type: string
        content:
          type: array
          description: 'The tool result as canonical content blocks (e.g. `[{ "type": "text",
            "text": "…" }]`), the same `SessionContentBlock` shape as the `tool_result` content
            of the durable transcript message — so the live preview and the committed record
            read identically. In practice the server collapses the result to a single `text`
            block.'
          items:
            $ref: '#/components/schemas/SessionContentBlock'
        display:
          type: string
        is_error:
          type: boolean
        error:
          type: string
        live_sequence:
          type: integer
          format: int64
          description: Monotonic per-turn sequence across all live-only session frames; use
            to detect dropped live frames.
        emitted_at:
          type: string
          format: date-time
          description: Server timestamp when this live preview frame was emitted.
    TurnWaitingPayload:
      type: object
      additionalProperties: true
      properties:
        turn_id:
          type: string
        reason:
          type: string
        wait:
          $ref: '#/components/schemas/SessionTranscriptWait'
    SessionTranscriptWait:
      type: object
      additionalProperties: false
      required:
      - kind
      - interaction_id
      - tool_call_id
      properties:
        kind:
          type: string
          enum:
          - interaction
        interaction_id:
          type: string
        tool_call_id:
          type: string
        expires_at:
          type: string
          format: date-time
    TurnCompletedPayload:
      type: object
      additionalProperties: true
      description: Payload of a `turn.completed` event — the terminal idle marker carrying
        token usage. The assistant output is not duplicated here; it is delivered as `agent.message`
        content events when the transcript commits. The same usage is readable after the fact
        on the turn resource, so a consumer that missed the pulse never has to replay the
        stream for it.
      properties:
        usage:
          $ref: '#/components/schemas/AgentTurnUsage'
    TurnFailedPayload:
      type: object
      additionalProperties: true
      properties:
        error:
          type: string
        error_type:
          type: string
    TurnCancelledPayload:
      type: object
      additionalProperties: true
      properties:
        reason:
          type: string
    NudgeEventPayload:
      type: object
      additionalProperties: true
      required:
      - nudge_id
      - turn_id
      - delivery
      - status
      description: Live reconciliation hint emitted for `nudge.queued`, `nudge.delivered`,
        and `nudge.cancelled`. Re-read the queue resource after receiving it; this pulse is
        not durable replay state.
      properties:
        nudge_id:
          type: string
        turn_id:
          type: string
        delivery:
          $ref: '#/components/schemas/SessionNudgeDelivery'
        status:
          $ref: '#/components/schemas/SessionNudgeStatus'
    CompactionTrigger:
      type: string
      enum:
      - auto
      - manual
      - append
      description: What started a compaction pass. `auto` is the threshold-gated pass that
        runs after a turn commits; `append` is the threshold-gated pass that runs inline on
        a message append; `manual` is an explicit compact request.
    CompactionStartedPayload:
      type: object
      additionalProperties: true
      description: 'Payload of a `compaction.started` event, emitted immediately before the
        summarizer call and only once every gate has passed — so receiving it means a pass
        is really running. Live-only: it is not replayed on reconnect, so a client that connects
        mid-pass reads the session''s `compaction` field instead. Every started pass is followed
        by exactly one `compaction.created` or `compaction.failed`.'
      properties:
        trigger:
          $ref: '#/components/schemas/CompactionTrigger'
        from_sequence:
          type: integer
          description: Lowest transcript sequence this pass is summarizing.
        through_sequence:
          type: integer
          description: Highest transcript sequence this pass is summarizing.
        message_count:
          type: integer
          description: Number of transcript messages this pass is folding into the summary.
        estimated_tokens:
          type: integer
          description: Estimated token size of the window being summarized.
        summary_model:
          type: string
          description: Model that will produce the summary.
    CompactionFailedPayload:
      type: object
      additionalProperties: true
      description: 'Payload of a `compaction.failed` event — the other terminal outcome of
        a started pass. It guarantees an indicator opened on `compaction.started` always comes
        down, instead of hanging on a pass that produced no summary. Live-only, like `compaction.started`:
        a failed pass appends nothing to the transcript, so there is no durable row to replay.
        The transcript is unchanged; the next pass recomputes from the same boundary.'
      properties:
        trigger:
          $ref: '#/components/schemas/CompactionTrigger'
        from_sequence:
          type: integer
          description: Lowest transcript sequence the failed pass was summarizing.
        through_sequence:
          type: integer
          description: Highest transcript sequence the failed pass was summarizing.
        error_type:
          type: string
          description: 'Machine-readable failure category. Currently `summarizer_error`, `timeout`,
            `empty_summary`, or `storage_error`. Treat it as an open string: new categories
            may be added, and a client that switches on it should fall through to a generic
            "compaction failed".'
        error_message:
          type: string
          description: Truncated failure detail. Diagnostics live in the server logs, not
            here.
    CompactionCreatedPayload:
      type: object
      additionalProperties: true
      description: 'Payload of a `compaction.created` event, emitted when the session transcript
        is summarized. The event is non-terminal: it never closes the session stream, so a
        live consumer observes a compaction landing inline.'
      properties:
        trigger:
          $ref: '#/components/schemas/CompactionTrigger'
        message_id:
          type: string
          description: Id of the compaction summary message appended to the transcript.
        sequence:
          type: integer
          format: int64
          description: The summary message's per-session transcript sequence.
        role:
          type: string
          description: Transcript role of the summary entry.
        content:
          type: array
          description: The summary's full canonical content blocks, so replaying the stream
            reconstructs the compaction entry exactly.
          items:
            $ref: '#/components/schemas/SessionContentBlock'
        covers_through_sequence:
          type: integer
          description: Highest message sequence the new summary covers — the before/after
            boundary.
        message_count:
          type: integer
          description: Number of transcript messages folded into this summary.
        summary_model:
          type: string
          description: Model that produced the summary.
    CreateSessionAttachmentRequest:
      type: object
      required:
      - file
      additionalProperties: false
      properties:
        file:
          type: string
          format: binary
          description: The document or image bytes. Multipart parts may arrive in any order.
        name:
          type: string
          maxLength: 256
          description: Optional display filename. Defaults to the multipart filename.
        mime:
          type: string
          description: Optional hint only; Mobius detects and validates PDF, DOCX, XLSX, PPTX,
            text, Markdown, and supported image types from the bytes.
        size_bytes:
          type: integer
          format: int64
          minimum: 0
          description: Optional declared byte size; when supplied it must match the uploaded
            bytes.
    SessionAttachmentResponse:
      type: object
      additionalProperties: false
      required:
      - artifact
      - content_block
      properties:
        artifact:
          $ref: '#/components/schemas/Artifact'
        content_block:
          $ref: '#/components/schemas/SessionContentBlock'
    AppendSessionMessagesRequest:
      type: object
      additionalProperties: false
      required:
      - messages
      properties:
        messages:
          type: array
          minItems: 1
          description: Messages to append to the session, in order.
          items:
            $ref: '#/components/schemas/AppendSessionMessage'
        token_input_total:
          type: integer
          minimum: 0
          description: Fresh (uncached) input tokens to add to this session's lifetime total.
        token_output_total:
          type: integer
          minimum: 0
          description: Output tokens to add to this session's lifetime total.
        cache_read_input_total:
          type: integer
          minimum: 0
          description: Prompt-cache-read input tokens to add to this session's lifetime total.
        cache_creation_input_total:
          type: integer
          minimum: 0
          description: Prompt-cache-write input tokens to add to this session's lifetime total.
        model:
          type: string
          description: Model that produced these messages.
        model_provider:
          type: string
          description: Provider for the supplied `model`.
    AppendSessionMessage:
      type: object
      additionalProperties: false
      description: Message payload to append to an existing durable session.
      required:
      - role
      - content
      properties:
        role:
          $ref: '#/components/schemas/SessionMessageRole'
          description: Role to store for this appended message.
        content:
          type: array
          description: Ordered content blocks (text, tool calls, tool results, images). Blocks
            of type `reminder` are host-managed runtime context and are rejected on this surface.
          items:
            type: object
            additionalProperties: true
        metadata:
          type: object
          additionalProperties: true
          description: Free-form caller metadata for this message.
        created_at:
          type: string
          format: date-time
          description: Caller-supplied creation timestamp. The server assigns one if absent.
    InvokeAgentRequest:
      type: object
      additionalProperties: false
      description: 'A single compound invocation: which stored agent to run, how to resolve
        the session, the caller''s input message, and optional channel routing context. `operation.timeout_seconds`
        must be at least one and takes precedence for this admitted turn.'
      required:
      - agent_ref
      - input
      properties:
        agent_ref:
          $ref: '#/components/schemas/AgentRef'
        session:
          $ref: '#/components/schemas/InvokeSessionSpec'
        operation:
          $ref: '#/components/schemas/AgentTurnOperationPolicy'
        input:
          $ref: '#/components/schemas/InvokeInput'
        output:
          $ref: '#/components/schemas/TurnOutputSpec'
          description: Optional structured-output contract for this turn. Read the validated
            value from the completed turn's `output`.
        channel_context:
          $ref: '#/components/schemas/ChannelContext'
    AgentTurnOperationPolicy:
      type: object
      additionalProperties: false
      description: Operational policy for this newly admitted turn only. It is not saved on
        the session. Its timeout takes precedence over the agent default and must be at least
        one second.
      properties:
        timeout_seconds:
          type: integer
          format: int64
          minimum: 1
          description: Overall active-execution budget for this logical turn.
    AgentRef:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Reference to an agent in this org. Supply exactly one of `id` (the agent
        identifier) or `name` (the org-unique agent name). A blueprint-binding reference form
        is reserved for a later release and is not resolvable yet.
      properties:
        id:
          type: string
          description: Agent identifier.
        name:
          type: string
          description: Org-unique agent name.
    InvokeSessionSpec:
      type: object
      additionalProperties: false
      description: 'How to resolve or create the session this invocation runs in. Mirrors
        the create-session policy: `mode` + `session_key` resolve a durable conversation for
        the agent, and the remaining fields seed a session that does not already exist (they
        are ignored when an existing session is resolved). Omit the whole object to use a
        single default session per agent in `continue_or_create` mode.'
      properties:
        mode:
          type: string
          enum:
          - new
          - continue
          - continue_or_create
          description: '`continue_or_create` (default) resolves an existing session for the
            `session_key` or creates one; `new` always creates a fresh session; `continue`
            resolves an existing session and fails if none exists.'
        session_key:
          type: string
          description: Stable key identifying the conversation within the agent.
        title:
          type: string
          description: Human-friendly title for a newly created session.
        owner:
          $ref: '#/components/schemas/ResourceOwner'
        visibility:
          $ref: '#/components/schemas/ResourceVisibility'
        model_override:
          type: string
          description: Model to use for a newly created session. Overrides the stored agent's
            model and is ignored when an existing session is resolved. Creating a session
            for a worker-routed agent returns `400 invalid_argument` with `details.argument
            = model_override`.
        compaction_policy:
          $ref: '#/components/schemas/SessionCompactionPolicy'
          description: Per-session compaction overrides applied when the session is first
            created. Merged over the agent's default policy and server defaults. Ignored when
            an existing session is resolved.
        retention:
          $ref: '#/components/schemas/SessionRetentionPolicy'
          description: Retention policy applied when the session is first created. Ignored
            when an existing session is resolved.
        thinking_effort:
          $ref: '#/components/schemas/ThinkingEffort'
          description: Reasoning-effort override applied when the session is first created.
            Overrides the agent default. Ignored when an existing session is resolved.
        metadata:
          type: object
          additionalProperties: true
          description: Free-form caller metadata stored on a newly created session.
    RuntimeContextItem:
      type: object
      additionalProperties: false
      required:
      - name
      - content
      properties:
        name:
          type: string
          pattern: ^[a-z][a-z0-9-]*$
          maxLength: 64
          description: Stable application-defined context name. Delivered to the model namespaced
            as `app-<name>`. Supply the application name without that namespace; for example,
            `app-board` is delivered as `app-app-board`.
        content:
          type: string
          minLength: 1
          maxLength: 8192
          description: Current value of this context, rendered verbatim to the model. OpenAPI
            `maxLength` counts Unicode code points; Mobius separately enforces an 8,192-byte
            UTF-8 limit server-side.
    RuntimeContext:
      type: array
      maxItems: 8
      description: |-
        Ordered application-owned runtime context for this turn. Send the full current value for each named item. Mobius records an item only on first use, material change, or after compaction removes its prior value from the active model window. Omitting a name leaves its last value standing; send an explicit value such as `none` to clear application state. Names must be unique within the request. Content is limited to 8,192 UTF-8 bytes per item and 16,384 bytes total.

        Context remains at contextual authority and cannot grant permissions. A retry using the same `idempotency_key` returns the original turn and ignores any newly supplied context.
      items:
        $ref: '#/components/schemas/RuntimeContextItem'
    TurnOutputSpec:
      type: object
      additionalProperties: false
      required:
      - schema
      description: 'Attaches a structured-output contract to a turn. When present, Mobius
        exposes a reserved submit tool whose input schema is the schema below, validates the
        submission server-side, and a turn that never produces a schema-valid object fails
        with `error_type: output_schema_unsatisfied` instead of completing. Read the validated
        value from the completed turn''s `output`. This is a per-turn contract, not agent
        identity, so it works with stored agents and may differ between turns of one session.'
      properties:
        schema:
          type: object
          additionalProperties: true
          description: 'JSON Schema the turn''s final output must satisfy. The root must be
            `type: object` and self-contained (no `$ref`); the serialized schema must not
            exceed 32 KiB. Mobius enforces the OpenAPI 3.0 subset: `required`, `enum`, `additionalProperties`,
            `minItems`/`maxItems`, `minLength`/`maxLength`, `pattern`, numeric bounds, nested
            objects/arrays, `oneOf`/`anyOf`/`allOf`, and `nullable`. Not supported: `$ref`/`$defs`,
            `if`/`then`/`else`, `const` (use a one-value `enum`), `patternProperties`, and
            `prefixItems`.'
    InvokeInput:
      type: object
      additionalProperties: false
      description: The caller input message that starts the agent turn.
      required:
      - content
      properties:
        content:
          type: array
          minItems: 1
          description: 'Ordered content blocks for the input message. Canonical documents
            use `{ "type": "document", "source": { "type": "base64", "media_type": "application/pdf",
            "data": "..." }, "title": "report.pdf" }` or a URL source. Mobius also translates
            supported OpenAI `input_file` and Chat Completions `file` blocks at ingestion.'
          items:
            type: object
            additionalProperties: true
        idempotency_key:
          type: string
          description: Dedup key scoped to the resolved session. A repeat call with the same
            key returns the existing invocation and writes nothing new; it never restarts
            a terminal turn. Derive it from the provider event id for Slack/Telegram webhook
            retries. Omitting it or sending a blank value disables retry deduplication.
        context:
          $ref: '#/components/schemas/RuntimeContext'
        metadata:
          type: object
          additionalProperties: true
          description: Free-form caller metadata attached to the input message.
    ChannelContext:
      type: object
      additionalProperties: false
      description: Optional messaging provider/channel routing context (Slack, Telegram, …).
        Persisted on the started turn's input-message metadata under a `channel_context` key
        so chat history and support views can trace a turn back to the provider thread it
        came from.
      properties:
        provider:
          type: string
          description: Messaging provider, e.g. `slack` or `telegram`.
        workspace_id:
          type: string
          description: Provider workspace/team identifier.
        channel_id:
          type: string
          description: Provider channel or chat identifier.
        thread_id:
          type: string
          description: Provider thread identifier within the channel.
    CreateSessionRequest:
      type: object
      additionalProperties: false
      description: Resolve-or-create policy for a session.
      required:
      - agent_id
      properties:
        agent_id:
          type: string
          description: Agent container that executes the session. The agent never owns it.
        mode:
          type: string
          enum:
          - new
          - continue
          - continue_or_create
          description: '`continue_or_create` (default) resolves an existing session for the
            `session_key` or creates one; `new` always creates a fresh session; `continue`
            resolves an existing session and fails if none exists.'
        session_key:
          type: string
          description: Stable key identifying the conversation within the agent.
        title:
          type: string
          description: Human-friendly session title.
        owner:
          $ref: '#/components/schemas/ResourceOwner'
        visibility:
          $ref: '#/components/schemas/ResourceVisibility'
        model_override:
          type: string
          description: Model to use for a newly created session. Overrides the stored agent's
            model. Ignored when an existing session is resolved. Creating a session for a
            worker-routed agent returns `400 invalid_argument` with `details.argument = model_override`.
        compaction_policy:
          $ref: '#/components/schemas/SessionCompactionPolicy'
          description: Per-session compaction overrides applied when the session is first
            created. Merged over the agent's default policy and server defaults. Ignored when
            an existing session is resolved.
        retention:
          $ref: '#/components/schemas/SessionRetentionPolicy'
          description: Retention policy applied when the session is first created. Ignored
            when an existing session is resolved.
        thinking_effort:
          $ref: '#/components/schemas/ThinkingEffort'
          description: Reasoning-effort override applied when the session is first created.
            Overrides the agent default. Ignored when an existing session is resolved.
        metadata:
          type: object
          additionalProperties: true
          description: Free-form caller metadata for the session.
    StartTurnRequest:
      type: object
      additionalProperties: false
      description: Caller input that starts an agent turn in a session. `operation.timeout_seconds`
        must be at least one and takes precedence for this admitted turn.
      required:
      - content
      properties:
        role:
          type: string
          enum:
          - user
          default: user
          description: Role of the input message. A turn carries caller input, so only `user`
            is accepted; defaults to `user` when omitted.
        content:
          type: array
          minItems: 1
          description: 'Ordered content blocks for the input message. Canonical documents
            use `{ "type": "document", "source": { "type": "base64", "media_type": "application/pdf",
            "data": "..." }, "title": "report.pdf" }` or a URL source. Mobius also translates
            supported OpenAI `input_file` and Chat Completions `file` blocks at ingestion.'
          items:
            type: object
            additionalProperties: true
        idempotency_key:
          type: string
          description: Dedup key scoped to the session. A repeat call with the same key returns
            the existing invocation and writes nothing new; it never restarts a terminal turn.
            Omitting it or sending a blank value disables retry deduplication.
        operation:
          $ref: '#/components/schemas/AgentTurnOperationPolicy'
        context:
          $ref: '#/components/schemas/RuntimeContext'
        output:
          $ref: '#/components/schemas/TurnOutputSpec'
          description: Optional structured-output contract for this turn. Read the validated
            value from the completed turn's `output`.
        metadata:
          type: object
          additionalProperties: true
          description: Free-form caller metadata attached to the input message.
    TurnAck:
      type: object
      additionalProperties: false
      description: Acknowledgement that a turn started, with a stream cursor.
      required:
      - session
      - turn
      - resume_cursor
      - after_sequence
      properties:
        session:
          $ref: '#/components/schemas/Session'
        turn:
          $ref: '#/components/schemas/AgentTurn'
        user_message:
          $ref: '#/components/schemas/SessionTranscriptMessage'
          description: Durable caller row created for this turn.
        resume_cursor:
          type: string
          minLength: 1
          description: Opaque stable v2 lower boundary for streaming and terminal settlement.
            It precedes every durable message owned by the returned turn and is safe for both
            fresh and deduplicated invocations. A deduplicated retry may replay already-observed
            frames.
        after_sequence:
          type: integer
          format: int64
          description: The transcript message `sequence` cursor to stream from. Pass it as
            `after_sequence` to `GET .../stream` to follow this turn.
        deduped:
          type: boolean
          description: True when a repeated idempotency key returned an existing turn without
            restarting it.
    NudgeSessionRequest:
      type: object
      additionalProperties: false
      required:
      - content
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 32768
          description: User direction to deliver at the next iteration boundary.
        idempotency_key:
          type: string
          maxLength: 255
          description: Dedup key scoped to the session. Reusing the key with identical content
            returns the original nudge request; different content conflicts.
        metadata:
          type: object
          additionalProperties: true
          description: Free-form caller metadata retained with the nudge request.
        wake:
          type: boolean
          default: false
          description: 'When true and the target turn is waiting on an interruptible agent
            tool, resolve that tool call with `{ "interrupted": true, "reason": "user_direction"
            }` and resume the same turn. Running and newly queued turns ignore this field.'
    SessionNudgeStatus:
      type: string
      enum:
      - pending
      - delivered
      - cancelled
      description: Durable nudge queue lifecycle status.
    SessionNudgeDelivery:
      type: string
      enum:
      - current_turn
      - new_turn
      description: '`current_turn` means the input targets an existing turn and will reach
        the agent as contextual runtime input at that turn''s next safe boundary. `new_turn`
        means the input was converted to a regular user message carried by a fresh direct-session
        turn (the same shape as a send); the nudge is `delivered` the moment that conversion
        commits. A nudge accepted as `current_turn` converts to `new_turn` if its target turn
        ends before absorbing it, so the durable record reflects how the input was ultimately
        routed — the acknowledgement reflects routing at admission time.'
    SessionNudgeTurn:
      type: object
      additionalProperties: false
      required:
      - id
      - status
      properties:
        id:
          type: string
        status:
          $ref: '#/components/schemas/AgentTurnStatus'
    SessionNudge:
      type: object
      additionalProperties: false
      required:
      - id
      - status
      - delivery
      - content
      - turn
      - sender_principal_id
      - created_at
      properties:
        id:
          type: string
          description: Stable nudge identifier.
        status:
          $ref: '#/components/schemas/SessionNudgeStatus'
        delivery:
          $ref: '#/components/schemas/SessionNudgeDelivery'
        content:
          type: string
          description: Exact user direction supplied when the nudge was queued.
        turn:
          $ref: '#/components/schemas/SessionNudgeTurn'
        sender_principal_id:
          type: string
          description: Principal that queued the nudge.
        created_at:
          type: string
          format: date-time
        delivered_at:
          type: string
          format: date-time
          nullable: true
        cancelled_at:
          type: string
          format: date-time
          nullable: true
    SessionNudgeListResponse:
      type: object
      additionalProperties: false
      required:
      - items
      - has_more
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SessionNudge'
        has_more:
          type: boolean
        next_cursor:
          type: string
          nullable: true
          description: Opaque continuation cursor, or null at the end.
    SessionNudgeAck:
      type: object
      additionalProperties: false
      required:
      - nudge_id
      - status
      - delivery
      - session
      - turn
      - after_sequence
      - deduped
      - woke_turn
      properties:
        nudge_id:
          type: string
          description: Stable id of the durable nudge mailbox row.
        status:
          $ref: '#/components/schemas/SessionNudgeStatus'
        delivery:
          $ref: '#/components/schemas/SessionNudgeDelivery'
        session:
          $ref: '#/components/schemas/Session'
        turn:
          $ref: '#/components/schemas/AgentTurn'
        after_sequence:
          type: integer
          format: int64
          description: Current transcript sequence cursor for following the target turn.
        deduped:
          type: boolean
          description: True when an existing idempotent nudge request was returned.
        woke_turn:
          type: boolean
          description: True when wake interrupted a waiting tool and requeued this turn.
    ArtifactConversionSummary:
      type: object
      description: Markdown-extraction state for an Office upload that requested conversion.
      required:
      - state
      additionalProperties: false
      properties:
        state:
          type: string
          enum:
          - converting
          - ready
          - failed
        error:
          type: string
          description: Failure reason when state is failed.
    Artifact:
      type: object
      description: Stored file or generated artifact metadata.
      required:
      - id
      - owner
      - visibility
      - posture
      - name
      - mime_type
      - size_bytes
      - created_at
      additionalProperties: false
      properties:
        id:
          type: string
          description: Unique artifact identifier.
        owner:
          $ref: '#/components/schemas/ResourceOwner'
        visibility:
          $ref: '#/components/schemas/ResourceVisibility'
        container:
          $ref: '#/components/schemas/ResourceContainer'
        posture:
          $ref: '#/components/schemas/ResourcePosture'
        name:
          type: string
          description: Display name or relative virtual path. Forward slash may be used to
            organize artifacts inside private or organization-visible space.
        mime_type:
          type: string
          description: MIME type recorded for the artifact content.
        size_bytes:
          type: integer
          format: int64
          description: Artifact content size in bytes.
        sha256:
          type: string
          description: SHA-256 digest of the artifact content, when available.
        created_at:
          type: string
          format: date-time
          description: Time the artifact metadata was created.
        created_by:
          type: string
          description: Principal ID of the actor who created this artifact. Empty for system-initiated
            writes.
        updated_at:
          type: string
          format: date-time
          description: Time the artifact metadata was last updated.
        updated_by:
          type: string
          description: Principal ID of the actor who last updated this artifact. Empty for
            system-initiated writes.
        metadata:
          type: object
          additionalProperties: true
          description: Caller-supplied artifact metadata. Mobius-owned storage metadata is
            not exposed.
        conversion:
          $ref: '#/components/schemas/ArtifactConversionSummary'
          description: Conversion summary for an Office artifact that requested conversion.
            Absent for artifacts with no conversion.
      example:
        id: art_2m7q9x5v3p8n4r6t
        owner:
          kind: team
        visibility: organization
        posture: team
        name: reports/review-findings.md
        mime_type: text/markdown
        size_bytes: 1842
        sha256: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        created_at: '2026-06-15T14:30:00Z'
        created_by: agent_5n8p2q7m4x9r3v6t
    RoutineKind:
      type: string
      enum:
      - invoke
      - notify
      description: V1 accepts invoke; notify is reserved and returns unsupported_routine_kind.
    RoutineOwnerKind:
      type: string
      enum:
      - person
      - team
      description: 'Whose the routine is. `person` pauses with its owner''s offboarding and
        runs on their connections. `team` belongs to the business: it has no `owner_id`, survives
        its creator''s departure, and must name at least one responsible person.'
    RoutineManagedBy:
      type: string
      enum:
      - team
      - named
      description: Who may change the routine. `team` is any member who can already reach
        it; `named` is the principals holding a `manager` row plus organization administrators.
        Defaults to `named`; only a person may change it, because `named` -> `team` turns
        "these people" into "anyone".
    RoutineRelationship:
      type: string
      enum:
      - follower
      - responsible
      - manager
      description: The relationship a principal holds to a routine. `follower` is opt-in attention,
        `responsible` is the person the routine waits on, `manager` may change it. One principal
        may hold more than one.
    RoutineFollowLevel:
      type: string
      enum:
      - all_results
      - failures_only
      description: Narrows what a follower is notified about. Ignored on the other relationships,
        which are always notified.
    RoutinePrincipal:
      type: object
      additionalProperties: false
      required:
      - principal_id
      - relationship
      - kind
      - added_at
      properties:
        principal_id:
          type: string
        relationship:
          $ref: '#/components/schemas/RoutineRelationship'
        level:
          $ref: '#/components/schemas/RoutineFollowLevel'
        kind:
          type: string
          enum:
          - human
          - agent
          - service
          - system
          description: The principal's kind, resolved from the principal record.
        display_name:
          type: string
        added_by:
          type: string
          description: Principal who wrote this row.
        added_at:
          type: string
          format: date-time
    RoutinePrincipalList:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RoutinePrincipal'
    AddRoutinePrincipalRequest:
      type: object
      additionalProperties: false
      required:
      - principal_id
      - relationship
      properties:
        principal_id:
          type: string
        relationship:
          $ref: '#/components/schemas/RoutineRelationship'
        level:
          $ref: '#/components/schemas/RoutineFollowLevel'
    RoutineSchedule:
      type: object
      additionalProperties: false
      properties:
        at:
          type: string
          format: date-time
        interval:
          type: string
          example: 24h
        cron:
          type: string
          example: 0 8 * * *
        timezone:
          type: string
          example: America/New_York
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        max_occurrences:
          type: integer
          minimum: 1
      description: Exactly one of at, interval, or cron is required.
    RoutineTrigger:
      type: string
      enum:
      - schedule
      - event
      description: What starts this routine's runs. `schedule` fires on the routine's schedule;
        `event` fires when a matching integration event arrives. Derived from whichever of
        `schedule` and `event` the routine carries, never stored.
    RoutineEventTrigger:
      type: object
      additionalProperties: false
      required:
      - event_type
      description: 'Runs the routine when a matching integration event arrives. Each matched
        event is one run on the ledger, one at a time per routine: an event arriving while
        a run is in flight waits behind it, and a run still waiting six hours later is closed
        `skipped` with `error_code` `stale`.'
      properties:
        event_type:
          type: string
          example: github.issues.opened
          description: 'The integration event to react to: a concrete type from the event
            catalog (`github.issues.opened`) or a wildcard on a prefix (`github.issues.*`,
            `github.*`). The first segment must name a registered integration provider; built-in
            Mobius events are not accepted here.'
        integration_id:
          type: string
          description: Optional. Only events from this connection start a run. Omitted, an
            event from any of the organization's connections for the provider does.
        condition:
          type: string
          example: event.repository.full_name == "acme/api"
          description: Optional expression over the event's `{event, meta}` envelope. The
            run starts only when it returns true. A condition that cannot be evaluated against
            an event records a `failed` run with `error_code` `trigger_condition_error` and
            starts nothing.
    RoutineCreateRequest:
      type: object
      additionalProperties: false
      required:
      - agent_id
      - instructions
      - per_occurrence_ceiling_milli
      - daily_ceiling_milli
      description: 'Exactly one of `schedule` and `event` is required: a routine runs on a
        schedule or when an event arrives, not both.'
      properties:
        session_id:
          type: string
          description: Optional conversation this routine was proposed in, kept as provenance.
            Occurrences run in their own sessions, so this never affects where results are
            delivered. Omitted for a routine created from the form.
        agent_id:
          type: string
        name:
          type: string
        instructions:
          type: string
        kind:
          $ref: '#/components/schemas/RoutineKind'
        schedule:
          $ref: '#/components/schemas/RoutineSchedule'
        event:
          $ref: '#/components/schemas/RoutineEventTrigger'
        per_occurrence_ceiling_milli:
          type: integer
          format: int64
          minimum: 1
        daily_ceiling_milli:
          type: integer
          format: int64
          minimum: 1
        owner_kind:
          allOf:
          - $ref: '#/components/schemas/RoutineOwnerKind'
          description: Defaults to `person`. `team` requires organization administration.
        managed_by:
          allOf:
          - $ref: '#/components/schemas/RoutineManagedBy'
          description: Defaults to `named`.
        responsible_principal_ids:
          type: array
          items:
            type: string
          description: The people the routine waits on. Required and non-empty when `owner_kind`
            is `team`; rejected otherwise. Each must be a person.
        follower_principal_ids:
          type: array
          items:
            type: string
          description: Principals who opt into the routine's results. The creator is added
            automatically.
    RoutineUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
        instructions:
          type: string
        schedule:
          allOf:
          - $ref: '#/components/schemas/RoutineSchedule'
          description: Makes this a scheduled routine, dropping any event trigger it had.
            Rejected together with `event`.
        event:
          allOf:
          - $ref: '#/components/schemas/RoutineEventTrigger'
          description: Makes this an event routine, dropping any schedule it had. Rejected
            together with `schedule`.
        per_occurrence_ceiling_milli:
          type: integer
          format: int64
          minimum: 1
          description: A person may move this either way. An agent may only lower it, so no
            agent widens the budget it runs under; raising it as an agent receives 403.
        daily_ceiling_milli:
          type: integer
          format: int64
          minimum: 1
          description: Must remain at least the per-occurrence ceiling. A person may move
            it either way; an agent may only lower it.
        managed_by:
          allOf:
          - $ref: '#/components/schemas/RoutineManagedBy'
          description: Only a person may change this. An agent manager receives 403.
    Routine:
      type: object
      additionalProperties: false
      required:
      - id
      - org_id
      - agent_id
      - owner_kind
      - managed_by
      - name
      - kind
      - trigger
      - timezone
      - status
      - occurrence_count
      - per_occurrence_ceiling_milli
      - daily_ceiling_milli
      - following
      - follower_count
      - created_at
      - updated_at
      properties:
        id:
          type: string
        org_id:
          type: string
        agent_id:
          type: string
        origin_session_id:
          type: string
          description: The conversation the routine was proposed in, kept as provenance and
            nothing more. Each occurrence runs in its own session, so this is absent for a
            form-created routine and for one whose conversation has since been deleted. Archiving
            it does not stop the routine.
        owner_id:
          type: string
          description: The custodian. Absent under team custody, which has no owner.
        owner_kind:
          $ref: '#/components/schemas/RoutineOwnerKind'
        managed_by:
          $ref: '#/components/schemas/RoutineManagedBy'
        responsible:
          type: array
          items:
            $ref: '#/components/schemas/RoutinePrincipal'
          description: The people this routine waits on. Non-empty under team custody.
        following:
          type: boolean
          description: Whether the calling principal follows this routine.
        unread:
          type: boolean
          description: Whether a recent run has landed since the calling principal last opened
            its session. Computed per caller from their session read marks, never stored,
            and always false on a routine they do not follow — following is what opts you
            into the indicator.
        follower_count:
          type: integer
          description: Principals holding a follower row. Responsible people and managers
            are notified too, and are named separately.
        name:
          type: string
        instructions:
          type: string
          description: Omitted from administrator metadata-only projections.
        kind:
          $ref: '#/components/schemas/RoutineKind'
        trigger:
          $ref: '#/components/schemas/RoutineTrigger'
        schedule:
          allOf:
          - $ref: '#/components/schemas/RoutineSchedule'
          description: Present when `trigger` is `schedule`.
        event:
          allOf:
          - $ref: '#/components/schemas/RoutineEventTrigger'
          description: Present when `trigger` is `event`.
        timezone:
          type: string
        status:
          $ref: '#/components/schemas/RoutineStatus'
        pause_reason:
          type: string
        next_fire_at:
          type: string
          format: date-time
          description: Absent on an event routine, which has no next fire to predict.
        last_fire_at:
          type: string
          format: date-time
        occurrence_count:
          type: integer
        completed_at:
          type: string
          format: date-time
        per_occurrence_ceiling_milli:
          type: integer
          format: int64
        daily_ceiling_milli:
          type: integer
          format: int64
        act_as_user_providers:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    RoutineList:
      type: object
      additionalProperties: false
      required:
      - items
      - has_more
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Routine'
        has_more:
          type: boolean
        next_cursor:
          type: string
    RoutineOccurrence:
      type: object
      additionalProperties: false
      required:
      - id
      - routine_id
      - scheduled_at
      - intake_at
      - lateness_milliseconds
      - trigger
      - status
      - credits_spent_milli
      description: One run of a routine, and the durable record of it. Status, outcome, error,
        credits, and timing all live here, so a run whose transcript is gone is still a complete
        row.
      properties:
        id:
          type: string
        routine_id:
          type: string
        routine_name:
          type: string
          description: The routine's current name, carried on the row so a cross-routine ledger
            renders without joining against every routine in the organization.
        session_id:
          type: string
          description: The conversation this run happened in, minted at admission. Absent
            for a run skipped before admission, and for one whose session has since been deleted.
        scheduled_at:
          type: string
          format: date-time
        intake_at:
          type: string
          format: date-time
        lateness_milliseconds:
          type: integer
          format: int64
        trigger:
          type: string
          enum:
          - schedule
          - manual
          - event
          description: 'What put this run on the ledger: the routine''s schedule, a principal
            asking for it now, or an integration event that matched the routine''s event trigger.
            Every kind is bounded and recorded the same way. Always present — a row written
            before manual runs existed reads as `schedule`, which is what it was.'
        triggered_by:
          type: string
          description: 'The principal who put this run on the ledger, named the same way the
            routine''s changelog names an actor: a human or an agent, either of which can
            ask for a run through the API. Always present when `trigger` is `manual`, because
            a manual run is somebody''s act and the record has to say whose. For a scheduled
            or event run it is the routine''s own custodian, and so absent under team custody,
            which has no custodian to name.'
        source_event_id:
          type: string
          description: The source event that started this run. Present only when `trigger`
            is `event`; it is the row the integration events list shows for the delivery.
        event_type:
          type: string
          description: The concrete event type that arrived (`github.issues.opened`), not
            the pattern the routine subscribed to. Present only when `trigger` is `event`.
        status:
          type: string
          enum:
          - pending
          - admitted
          - completed
          - failed
          - skipped
          - missed
        outcome:
          type: string
          description: 'A completed run''s headline: one line saying what it did, derived
            from the run''s own final message with markdown removed and length capped, falling
            back to the scheduled time when the run said nothing. Safe to render in a table
            cell as-is.'
        error_code:
          type: string
        error_message:
          type: string
        turn_id:
          type: string
        credits_spent_milli:
          type: integer
          format: int64
        unread:
          type: boolean
          description: Whether this run landed after the calling principal last opened its
            session. Computed per caller from their session read marks, never stored, and
            always false on a routine they do not follow.
        transcript_url:
          type: string
          description: 'Link to the run''s transcript, which is the whole of session_id''s
            conversation: one session holds exactly one occurrence. Absent whenever session_id
            is; render the row without it rather than as an error.'
    RoutineChange:
      type: object
      additionalProperties: false
      required:
      - id
      - action
      - status
      - created_at
      description: |-
        One recorded change to a routine, read from the audit trail.

        Deliberately narrower than an audit log entry: no IP address, no user agent, no request ID. This is a product surface a colleague reads, not a security investigation, and the operational fields would expose a person to everyone who can see the routine they touched.
      properties:
        id:
          type: string
        action:
          type: string
          description: 'What happened: create, update, delete, transfer, or run (a person
            asking for a run now).'
        actor_name:
          type: string
          description: The actor's display name as it stood when the change was made. An agent's
            name appears here exactly as a person's does.
        principal_id:
          type: string
          description: The human or agent who made the change.
        credential_name:
          type: string
          description: The credential or session the change came through, when one was recorded.
        changes:
          type: object
          additionalProperties: false
          description: The values before and after. Withheld fields read as `<redacted>` rather
            than disappearing.
          properties:
            before:
              type: object
              additionalProperties: true
            after:
              type: object
              additionalProperties: true
        status:
          type: string
          enum:
          - success
          - failure
        error_type:
          type: string
        created_at:
          type: string
          format: date-time
    RoutineChangeList:
      type: object
      additionalProperties: false
      required:
      - items
      - has_more
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RoutineChange'
        has_more:
          type: boolean
        next_cursor:
          type: string
    RoutineOccurrenceList:
      type: object
      additionalProperties: false
      required:
      - items
      - has_more
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RoutineOccurrence'
        has_more:
          type: boolean
        next_cursor:
          type: string
    RoutineProposal:
      type: object
      additionalProperties: false
      required:
      - id
      - session_id
      - agent_id
      - proposed_to
      - status
      - expires_at
      - payload
      properties:
        id:
          type: string
        session_id:
          type: string
        agent_id:
          type: string
        proposed_to:
          type: string
        status:
          type: string
          enum:
          - pending
          - approved
          - dismissed
          - expired
        routine_id:
          type: string
        expires_at:
          type: string
          format: date-time
        payload:
          type: object
          additionalProperties: true
    SkillRequest:
      type: object
      additionalProperties: false
      required:
      - name
      - instructions
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: Human-readable skill name.
        description:
          type: string
          maxLength: 1000
          description: Markdown description of the skill's purpose.
        instructions:
          type: string
          minLength: 1
          description: Markdown instructions loaded when the skill is active.
        allowed_tools:
          type: array
          default: []
          description: Tool selectors naming the actions this skill needs. The grant applies
            once an agent invokes the skill and lasts for the rest of that turn. Empty declares
            nothing and narrows nothing.
          items:
            type: string
        owner:
          $ref: '#/components/schemas/ResourceOwner'
          description: Optional explicit custodian. Omit to keep the default shown by the
            create surface.
        visibility:
          $ref: '#/components/schemas/ResourceVisibility'
          description: Optional declared audience. Omit for Only you.
        tags:
          $ref: '#/components/schemas/TagMap'
          description: Labels to apply to the skill.
      example:
        name: Pull request review
        description: Review pull requests for correctness and risk.
        instructions: Check the diff and leave concise findings.
        allowed_tools:
        - github.create_review_comment
        tags:
          owner: product
    ImportSkillRequest:
      type: object
      additionalProperties: false
      required:
      - content
      properties:
        content:
          type: string
          description: Full skill document, optionally with YAML frontmatter.
        name:
          type: string
          description: Optional name override.
    SkillListResponse:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          description: The list of results for this page.
          items:
            $ref: '#/components/schemas/Skill'
    BlueprintApplyMode:
      type: string
      description: '`apply` performs the change; `preview` validates and returns a plan without
        mutating resources.'
      enum:
      - preview
      - apply
    BlueprintResourceType:
      type: string
      description: The kind of Mobius resource a binding or change refers to.
      enum:
      - action
      - skill
      - agent
      - table
    BlueprintChangeAction:
      type: string
      description: 'What apply did (or, in preview, would do): `created` a new resource, `updated`
        a managed one, `adopted` a matching unmanaged one, or left an `unchanged` resource
        untouched.'
      enum:
      - created
      - updated
      - adopted
      - unchanged
    BlueprintResourceRef:
      type: object
      additionalProperties: false
      description: A reference to a Mobius resource by direct `id`, by blueprint `key` (resolved
        within this apply first, then against existing bindings), or by `blueprint_ref` (resolved
        by key; its namespace is recorded as provenance and is not used for reference resolution
        in this version).
      properties:
        id:
          type: string
          description: Direct resource id.
        key:
          type: string
          description: Blueprint-defined resource key.
        blueprint_ref:
          $ref: '#/components/schemas/BlueprintRef'
    BlueprintRef:
      type: object
      additionalProperties: false
      description: A namespaced blueprint key reference.
      required:
      - key
      properties:
        namespace:
          type: string
        key:
          type: string
    ApplyBlueprintRequest:
      type: object
      additionalProperties: false
      description: A desired blueprint plus the apply mode.
      required:
      - resources
      properties:
        namespace:
          type: string
          description: Optional namespace that forms part of the blueprint identity.
        blueprint_key:
          type: string
          description: Optional blueprint identifier that forms part of the blueprint identity.
        blueprint_version:
          type: string
          description: Optional blueprint version recorded as provenance.
        protect_resources:
          type: boolean
          description: When set, controls whether ordinary update and delete operations may
            change resources managed by this blueprint. Blueprint Apply and blueprint deletion
            remain allowed. Omit to preserve protection on existing bindings; new bindings
            default to unprotected.
        mode:
          $ref: '#/components/schemas/BlueprintApplyMode'
        resources:
          $ref: '#/components/schemas/BlueprintResources'
    BlueprintResources:
      type: object
      additionalProperties: false
      description: The desired resources grouped by type. All groups are optional.
      properties:
        actions:
          type: array
          items:
            $ref: '#/components/schemas/BlueprintActionInput'
        skills:
          type: array
          items:
            $ref: '#/components/schemas/BlueprintSkillInput'
        agents:
          type: array
          items:
            $ref: '#/components/schemas/BlueprintAgentInput'
        tables:
          type: array
          items:
            $ref: '#/components/schemas/BlueprintTableInput'
    BlueprintActionInput:
      type: object
      additionalProperties: false
      description: A desired action. `name` is its immutable org-unique identity.
      required:
      - key
      - name
      properties:
        key:
          type: string
          description: Blueprint-defined handle other resources use to reference it.
        name:
          type: string
        type:
          type: string
          description: Endpoint kind. Defaults to `http`. Immutable after create.
          enum:
          - http
          - worker
        endpoint:
          type: string
          description: Endpoint URL for http actions.
        title:
          type: string
        description:
          type: string
        input_schema:
          type: object
          additionalProperties: true
        output_schema:
          type: object
          additionalProperties: true
        annotations:
          $ref: '#/components/schemas/BlueprintActionAnnotations'
        tags:
          $ref: '#/components/schemas/TagMap'
    BlueprintActionAnnotations:
      type: object
      additionalProperties: false
      description: Behavioral annotations describing how an action may be used.
      properties:
        idempotent:
          type: boolean
        destructive:
          type: boolean
        read_only:
          type: boolean
        long_running:
          type: boolean
    BlueprintSkillInput:
      type: object
      additionalProperties: false
      description: A desired skill.
      required:
      - key
      - name
      properties:
        key:
          type: string
        name:
          type: string
        title:
          type: string
        description:
          type: string
        instructions:
          type: string
        allowed_tools:
          type: array
          description: Tool selectors naming the actions this skill needs. The grant applies
            once an agent invokes the skill and lasts for the rest of that turn. Empty declares
            nothing and narrows nothing.
          items:
            type: string
        tags:
          $ref: '#/components/schemas/TagMap'
    BlueprintAgentInput:
      type: object
      additionalProperties: false
      description: A desired agent. `skills`, when present, replaces the agent's full assignment
        set; omit it to leave existing assignments untouched.
      required:
      - key
      - name
      properties:
        key:
          type: string
        name:
          type: string
        description:
          type: string
        model:
          type: string
        model_route:
          $ref: '#/components/schemas/AgentModelRoute'
          description: Default route for model calls made by this agent.
        tool_presentation:
          $ref: '#/components/schemas/AgentToolPresentation'
          description: How granted actions are presented to the model.
        system_prompt:
          type: string
        timeout_seconds:
          type: integer
          format: int64
          minimum: 0
          description: Per-turn execution timeout; `0` uses the platform default.
        status:
          $ref: '#/components/schemas/AgentStatus'
          description: Desired agent lifecycle status.
        compaction_policy:
          $ref: '#/components/schemas/SessionCompactionPolicy'
          description: Default session-compaction policy inherited by new sessions.
        thinking_effort:
          $ref: '#/components/schemas/ThinkingEffort'
          description: Default reasoning-effort level for the agent's sessions.
        color:
          type: string
        skills:
          type: array
          items:
            $ref: '#/components/schemas/BlueprintResourceRef'
        tags:
          $ref: '#/components/schemas/TagMap'
    BlueprintTableInput:
      type: object
      additionalProperties: false
      description: A desired table. `key` is its stable Blueprint handle; `name` is org-unique
        (lower snake_case) and may be changed after binding. `schema` carries the full column
        and identity definition and is validated on apply. The identity column and the required-ness
        of existing columns are immutable after create, so a re-apply that changes them is
        rejected.
      required:
      - key
      - name
      - schema
      properties:
        key:
          type: string
          description: Blueprint-defined handle other resources use to reference it.
        name:
          type: string
        description:
          type: string
        instructions:
          type: string
          description: Optional author guidance for how this table should be used (e.g. surfaced
            to agents).
        schema:
          $ref: '#/components/schemas/TableSchema'
    BlueprintApplyResult:
      type: object
      additionalProperties: false
      description: The outcome of an apply or preview.
      required:
      - status
      - changes
      - bindings
      properties:
        status:
          type: string
          description: '`applied` for a mutating apply, `previewed` for a preview.'
          enum:
          - applied
          - previewed
        namespace:
          type: string
        blueprint_key:
          type: string
        blueprint_version:
          type: string
        changes:
          type: array
          items:
            $ref: '#/components/schemas/BlueprintChange'
        bindings:
          type: array
          items:
            $ref: '#/components/schemas/BlueprintBinding'
    BlueprintChange:
      type: object
      additionalProperties: false
      required:
      - resource_type
      - key
      - action
      properties:
        resource_type:
          $ref: '#/components/schemas/BlueprintResourceType'
        key:
          type: string
        action:
          $ref: '#/components/schemas/BlueprintChangeAction'
        resource_id:
          type: string
          description: The provisioned resource id. Empty for would-create entries in a preview.
    BlueprintBinding:
      type: object
      additionalProperties: false
      required:
      - resource_type
      - key
      - resource_id
      - protected
      - delete_on_destroy
      properties:
        resource_type:
          $ref: '#/components/schemas/BlueprintResourceType'
        key:
          type: string
        resource_id:
          type: string
        namespace:
          type: string
        blueprint_key:
          type: string
        blueprint_version:
          type: string
        protected:
          type: boolean
          description: Whether ordinary definition mutations are blocked.
        delete_on_destroy:
          type: boolean
          description: Whether deleting the blueprint will delete this resource instead of
            retaining it.
    BlueprintBindingListResponse:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BlueprintBinding'
    SetBlueprintProtectionRequest:
      type: object
      additionalProperties: false
      required:
      - protected
      properties:
        protected:
          type: boolean
    BlueprintDeleteResult:
      type: object
      additionalProperties: false
      required:
      - status
      - blueprint_key
      - deleted
      - retained
      properties:
        status:
          type: string
          enum:
          - deleted
        namespace:
          type: string
        blueprint_key:
          type: string
        deleted:
          type: array
          description: Resources deleted with the blueprint.
          items:
            $ref: '#/components/schemas/BlueprintBinding'
        retained:
          type: array
          description: Adopted or legacy resources retained after their bindings were removed.
          items:
            $ref: '#/components/schemas/BlueprintBinding'
    ColumnType:
      type: string
      enum:
      - string
      - number
      - boolean
      - date
      - object
      - array
      - any
      description: 'Column value type: `string`, `number`, `boolean`, `date`, `object`, `array`,
        or `any`.'
    ColumnDef:
      type: object
      additionalProperties: false
      required:
      - name
      - type
      description: One typed column in a table schema.
      properties:
        name:
          type: string
          description: Column name used as the key inside row `data`.
        type:
          $ref: '#/components/schemas/ColumnType'
          description: JSON-compatible value type accepted for this column.
        required:
          type: boolean
          default: false
          description: Whether inserts must include a non-null value for this column.
        indexed:
          type: boolean
          default: false
          deprecated: true
          description: Compatibility hint retained for older schemas. It does not create a
            physical database index.
        default:
          description: Default value applied when column is absent on insert
        description:
          type: string
          description: Human-readable explanation of the column's purpose.
        deprecated:
          type: boolean
          default: false
          description: Whether authors should avoid using this column in new rows.
    IndexDef:
      type: object
      additionalProperties: false
      required:
      - name
      - columns
      description: Compatibility metadata for older table schemas. Declared indexes do not
        create physical database indexes.
      properties:
        name:
          type: string
          description: Stable index name unique within the table schema.
        columns:
          type: array
          description: Column names included in the index, in order.
          items:
            type: string
    TableSchema:
      type: object
      required:
      - columns
      - identity_column
      additionalProperties: false
      description: Column definition for a virtual table. Each table has exactly one required
        string identity column and may nominate one optional string secondary key column.
      properties:
        identity_column:
          type: string
          minLength: 1
          description: Name of the required string column that uniquely identifies one row
            in this table.
        secondary_key_column:
          type: string
          description: Optional string column optimized for secondary lookups. It cannot be
            changed after creation.
        columns:
          type: array
          description: Ordered list of columns accepted in row data.
          items:
            $ref: '#/components/schemas/ColumnDef'
          minItems: 1
          maxItems: 200
        indexes:
          type: array
          deprecated: true
          description: Compatibility metadata retained for older schemas. Index declarations
            do not create physical database indexes.
          items:
            $ref: '#/components/schemas/IndexDef'
          maxItems: 20
        open:
          type: boolean
          default: false
          description: Allows rows to include undeclared keys while declared columns continue
            to be validated.
    PrincipalKind:
      type: string
      enum:
      - service
      - agent
      - system
      description: Machine principal kind. `service` is the standalone user-facing API client
        identity. `agent` and `system` are internal backing identities for agent execution
        and platform-internal work. (Human principals are managed as organization members,
        not on this surface.)
    PrincipalState:
      type: string
      enum:
      - active
      - disabled
      - deleted
      description: Canonical business-lifecycle state. `active` allows authentication and
        job claims; `disabled` is a reversible kill switch that blocks them but preserves
        the record and its assignments; `deleted` is the retained archived state used for
        audit, attribution, and history.
    Principal:
      type: object
      additionalProperties: false
      description: Non-human identity used by workers, agents, and API keys. A principal makes
        permissions, delegation, and credential rotation explicit without tying machine access
        to a human user. The `id` is the stable identity used by credentials, role assignments,
        and agent execution.
      required:
      - id
      - kind
      - state
      - name
      - created_at
      - updated_at
      properties:
        id:
          type: string
          description: Unique identifier for this principal.
        kind:
          $ref: '#/components/schemas/PrincipalKind'
          description: Machine kind of this principal.
        state:
          $ref: '#/components/schemas/PrincipalState'
          description: 'Current lifecycle state: `active`, `disabled`, or retained `deleted`.'
        name:
          type: string
          description: Human-readable name for this principal. Immutable after creation.
        description:
          type: string
          description: Optional human-readable description.
        handle:
          type: string
          description: Typed, human-readable stable reference for this machine principal (`svc:acme-ci`,
            `agent:harry`, `system`). Replaces the synthetic email for non-humans (PRD 2026-06-04
            FR-3).
        owner_id:
          type: string
          description: Optional human principal accountable for this machine principal.
        role_ids:
          type: array
          items:
            type: string
          uniqueItems: true
          description: Role IDs currently assigned to this principal in the org.
        metadata:
          type: object
          additionalProperties: true
          description: Arbitrary key-value metadata. Subject to size and nesting depth limits.
        tags:
          $ref: '#/components/schemas/TagMap'
        created_at:
          type: string
          format: date-time
          description: Timestamp when this principal was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when this principal was last updated.
    PrincipalListResponse:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          description: The list of results for this page.
          items:
            $ref: '#/components/schemas/Principal'
    CreatePrincipalRequest:
      type: object
      additionalProperties: false
      required:
      - name
      properties:
        name:
          type: string
          description: Human-readable name for this principal. Immutable after creation.
        description:
          type: string
          description: Optional human-readable description.
        owner_id:
          type: string
          description: Human principal accountable for this service principal.
        metadata:
          type: object
          additionalProperties: true
          description: Arbitrary metadata to attach to the principal.
        role_ids:
          type: array
          items:
            type: string
          minItems: 1
          uniqueItems: true
          description: One or more role IDs to assign at creation time. All assignments are
            created atomically with the principal. Requires `mobius.org.admin`. Each role
            must belong to this org or be system-defined.
        tags:
          $ref: '#/components/schemas/TagMap'
    UpdatePrincipalRequest:
      type: object
      additionalProperties: false
      properties:
        description:
          type: string
          description: Replacement description.
        state:
          $ref: '#/components/schemas/PrincipalState'
          description: 'Replacement lifecycle state: `active` or `disabled`.'
        owner_id:
          type: string
          description: Human principal accountable for this principal.
        metadata:
          type: object
          additionalProperties: true
          description: Replacement metadata.
        role_ids:
          type: array
          items:
            type: string
          uniqueItems: true
          description: Replacement role IDs for this principal in the org. Send an empty array
            to remove all org role assignments. Requires `mobius.org.admin`.
        tags:
          $ref: '#/components/schemas/TagMap'
    Table:
      type: object
      additionalProperties: false
      required:
      - id
      - owner
      - visibility
      - posture
      - name
      - schema
      - created_at
      - updated_at
      description: Table metadata and schema.
      properties:
        id:
          type: string
          description: Unique table identifier.
        owner:
          $ref: '#/components/schemas/ResourceOwner'
        visibility:
          $ref: '#/components/schemas/ResourceVisibility'
        container:
          $ref: '#/components/schemas/ResourceContainer'
        posture:
          $ref: '#/components/schemas/ResourcePosture'
        name:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
          maxLength: 64
          description: Lowercase snake_case table name, unique within the org.
        description:
          type: string
          description: Human-readable table description.
        instructions:
          type: string
          description: Optional author guidance for how this table should be used (e.g. surfaced
            to agents).
        schema:
          allOf:
          - $ref: '#/components/schemas/TableSchema'
          description: Column and index schema enforced for table rows.
        tags:
          $ref: '#/components/schemas/TagMap'
          description: Free-form labels used for filtering, ownership, or automation.
        created_by:
          type: string
          description: User ID of the principal who created this table.
        updated_by:
          type: string
          description: User ID of the principal who last updated this table.
        created_at:
          type: string
          format: date-time
          description: Time the table was created.
        updated_at:
          type: string
          format: date-time
          description: Time the table metadata or schema was last updated.
      example:
        id: table_2x7q5m9v3p8r4n6t
        name: review_findings
        description: Pull-request review findings.
        schema:
          columns:
          - name: pull_request_url
            type: string
            required: true
          - name: severity
            type: string
          - name: summary
            type: string
          identity_column: pull_request_url
        tags:
          team: product
        created_by: user_2f9s3k4m5n6p7q8r
        updated_by: user_2f9s3k4m5n6p7q8r
        created_at: '2026-06-15T14:30:00Z'
        updated_at: '2026-06-15T14:30:00Z'
    TableListResponse:
      type: object
      additionalProperties: false
      required:
      - items
      - has_more
      description: Cursor-paginated list of tables.
      properties:
        items:
          type: array
          description: Tables in the current page.
          items:
            $ref: '#/components/schemas/Table'
        has_more:
          type: boolean
          description: Whether another page is available.
        next_cursor:
          type: string
          description: Cursor to pass on the next request when `has_more` is true.
      example:
        items:
        - id: table_2x7q5m9v3p8r4n6t
          name: review_findings
          schema:
            columns:
            - name: pull_request_url
              type: string
              required: true
            identity_column: pull_request_url
          created_at: '2026-06-15T14:30:00Z'
          updated_at: '2026-06-15T14:30:00Z'
        has_more: false
    TableStats:
      type: object
      description: Point-in-time storage and indexing statistics for one table.
      required:
      - table_id
      - row_count
      - approx_data_bytes
      - approx_index_bytes
      - indexed_column_count
      - declared_index_count
      - search_index_present
      - generated_at
      additionalProperties: false
      properties:
        table_id:
          type: string
          description: Table these statistics describe.
        row_count:
          type: integer
          format: int64
          description: Approximate number of rows in the table.
        approx_data_bytes:
          type: integer
          format: int64
          description: Approximate bytes used by table data.
        approx_index_bytes:
          type: integer
          format: int64
          description: Approximate bytes used by secondary lookup indexes.
        indexed_column_count:
          type: integer
          description: Number of schema columns optimized for secondary lookup.
        declared_index_count:
          type: integer
          description: Number of compatibility index declarations stored in the table schema.
        search_index_present:
          type: boolean
          description: Whether the fixed shared full-text search index is present.
        generated_at:
          type: string
          format: date-time
          description: Time this statistics snapshot was generated.
        oldest_row_created_at:
          type: string
          format: date-time
          description: Creation time of the oldest row, when the table has rows.
        newest_row_updated_at:
          type: string
          format: date-time
          description: Update time of the newest changed row, when the table has rows.
    CreateTableRequest:
      type: object
      required:
      - name
      - schema
      additionalProperties: false
      properties:
        name:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
          maxLength: 64
          description: Table name (lowercase, snake_case); unique within the org.
        description:
          type: string
          maxLength: 1000
          description: Optional human-readable description of the table.
        instructions:
          type: string
          maxLength: 2000
          description: Optional author guidance for how this table should be used (e.g. surfaced
            to agents).
        owner:
          $ref: '#/components/schemas/ResourceOwner'
        visibility:
          $ref: '#/components/schemas/ResourceVisibility'
        schema:
          $ref: '#/components/schemas/TableSchema'
          description: Column and index definition for the new table.
      example:
        name: review_findings
        description: Pull-request review findings.
        schema:
          columns:
          - name: pull_request_url
            type: string
            required: true
          - name: severity
            type: string
          - name: summary
            type: string
          identity_column: pull_request_url
    UpdateTableRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
          maxLength: 64
          description: Table name (lowercase, snake_case); unique within the org.
        description:
          type: string
          maxLength: 1000
          description: Optional human-readable description of the table.
        instructions:
          type: string
          maxLength: 2000
          description: Optional author guidance for how this table should be used (e.g. surfaced
            to agents).
        schema:
          $ref: '#/components/schemas/TableSchema'
          description: Replacement column and index definition. The identity column and required
            column settings are immutable after creation; newly added columns must be optional.
    TableRow:
      type: object
      additionalProperties: false
      required:
      - id
      - table_id
      - data
      - version
      - created_at
      - updated_at
      description: One stored row in a table.
      properties:
        id:
          type: string
          description: Unique row identifier.
        table_id:
          type: string
          description: Table this row belongs to.
        data:
          type: object
          additionalProperties: true
          description: JSON object keyed by table column name.
        version:
          type: integer
          description: Optimistic-lock version incremented on each update.
        created_at:
          type: string
          format: date-time
          description: Time the row was inserted.
        updated_at:
          type: string
          format: date-time
          description: Time the row was last updated.
      example:
