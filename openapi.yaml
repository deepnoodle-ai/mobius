        schema:
          $ref: '#/components/schemas/AgentVisibility'
      - name: members
        in: query
        description: The audience being considered, as a comma-separated list of principal
          IDs. Omit to evaluate against the current member list.
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentVisibilityImpact'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
