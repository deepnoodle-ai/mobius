        has_more: false
    CreateArtifactRequest:
      type: object
      required:
      - file
      - name
      additionalProperties: false
      properties:
        file:
          type: string
          format: binary
          description: File bytes to upload into artifact storage. Multipart parts may be
            sent in any order; Mobius reads metadata fields and temporarily spools the file
            part when needed before streaming bytes to artifact storage.
        name:
          type: string
          maxLength: 256
          description: Display name or relative virtual path. Forward slash may be used to
            organize artifacts inside private or organization-visible space.
        mime:
          type: string
          description: Optional MIME type override. Defaults to the uploaded file part content
            type, then `application/octet-stream`.
        size_bytes:
          type: integer
          format: int64
          minimum: 0
          description: Optional declared file size. When supplied, Mobius verifies the streamed
            byte count exactly matches this value.
        metadata:
          type: object
          additionalProperties: true
          description: Optional caller metadata JSON object. Encoded as JSON in the multipart
            field and limited to 64 KiB.
        owner:
          $ref: '#/components/schemas/ResourceOwner'
          description: Optional custodian. Omit to keep the upload with the authenticated
            person.
        visibility:
          $ref: '#/components/schemas/ResourceVisibility'
          description: Optional audience. Omit to keep the upload private.
        convert:
          type: string
          enum:
          - 'true'
          - 'false'
          description: When "true" and the uploaded file is DOCX, XLSX, or PPTX, extract a
            Markdown rendition asynchronously for model delivery. Ignored for other file types.
    ArtifactSignedUrl:
      type: object
      description: Short-lived URL for downloading artifact content.
      required:
      - url
      - method
      - expires_at
      additionalProperties: false
      properties:
        url:
          type: string
          description: Signed URL to call before `expires_at`.
        method:
          type: string
          enum:
          - GET
          description: HTTP method to use with `url`; currently `GET`.
        expires_at:
          type: string
          format: date-time
          description: Time when the signed URL expires.
    ArtifactQuotaUsage:
      type: object
      description: Current artifact storage usage and quota snapshot.
      required:
      - used_bytes
      - limit_bytes
      - artifact_count
      - pending_count
      - generated_at
      additionalProperties: false
      properties:
        used_bytes:
          type: integer
          format: int64
          description: Bytes currently counted toward the artifact quota.
        limit_bytes:
          type: integer
          format: int64
          description: Maximum bytes allowed for artifacts.
        artifact_count:
          type: integer
          format: int64
          description: Number of artifacts currently counted.
        pending_count:
          type: integer
          format: int64
          description: Number of artifacts waiting for content upload.
        generated_at:
          type: string
          format: date-time
          description: Time this quota snapshot was generated.
