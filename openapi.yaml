      description: Creates an interaction. `consumer` names what is waiting on its resolution;
        omit it for a standalone request that records the response and nothing more.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInteractionRequest'
            example:
              target_user_ids:
