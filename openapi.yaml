    get:
      operationId: listRoutinePrincipals
      tags:
      - routines
      summary: List a routine's roster
      description: 'Returns every principal holding a relationship to the routine: the people
        it waits on (`responsible`), the principals who may change it (`manager`), and the
        principals who opted into its results (`follower`). One principal may appear more
        than once.'
      parameters:
      - $ref: '#/components/parameters/RoutineID'
      responses:
        '200':
          description: Roster.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutinePrincipalList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: addRoutinePrincipal
      tags:
      - routines
      summary: Add a principal to a routine's roster
      description: |-
        Idempotent: adding a relationship the principal already holds changes nothing.

        Two gates on one endpoint. Adding YOURSELF as a `follower` needs only read access to the routine — following is opt-in, and opting in is yours to do. Adding anyone else, or any `manager` or `responsible` row, needs manage rights on the routine.

        `responsible` is accepted only on a team-owned routine, and only for a person: a routine that waits on unattended work waits on nobody.
      parameters:
      - $ref: '#/components/parameters/RoutineID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddRoutinePrincipalRequest'
      responses:
        '200':
          description: The roster after the add.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutinePrincipalList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/routines/{routine_id}/principals/{principal_id}:
    delete:
      operationId: removeRoutinePrincipal
      tags:
      - routines
      summary: Remove a principal from a routine's roster
      description: |-
        Drops the principal's rows on this routine. Omit `relationship` to remove every relationship they hold.

        Removing YOURSELF as a `follower` needs only read access; removing anyone else, or any `manager` or `responsible` row, needs manage rights. Removing the last `responsible` person from a team-owned routine is refused — name a replacement first.
      parameters:
      - $ref: '#/components/parameters/RoutineID'
      - name: principal_id
        in: path
        required: true
        schema:
          type: string
      - name: relationship
        in: query
        description: Limit the removal to one relationship. Omit to remove all of them.
        schema:
          $ref: '#/components/schemas/RoutineRelationship'
      responses:
        '204':
          description: Removed.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
