        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      operationId: deleteTableRow
      tags:
      - tables
      summary: Delete row
      description: Deletes one row from the table by row ID.
      parameters:
      - $ref: '#/components/parameters/TableIDParam'
      - name: row_id
        in: path
        required: true
        description: Table row ID.
        schema:
          type: string
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/artifacts:
    get:
      operationId: listArtifacts
      tags:
      - artifacts
      summary: List artifacts
      description: Returns ready artifacts in the org, ordered (created_at desc, id desc).
        Optional filters narrow by mime prefix. Deleted or unfinished artifacts are excluded
        from API reads.
      parameters:
      - name: mime
        in: query
        required: false
        schema:
          type: string
        description: Mime prefix filter (e.g. `image/`)
      - $ref: '#/components/parameters/CursorParam'
      - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createArtifact
      tags:
      - artifacts
      summary: Create artifact
      description: |-
        Accepts an org-authorized multipart file upload. Without a worker lease, the caller needs `mobius.resource.build`; the artifact is private to the authenticated principal and has no run or step lineage. A worker may instead supply `X-Mobius-Lease-Token` with `mobius.job.execute`; Mobius then derives run, step, job, worker session, attempt, and shared visibility from the active claim. Caller-supplied lineage, ownership, and visibility fields are rejected in both modes.

        DOCX, XLSX, and PPTX uploads may pass `convert=true` to start asynchronous Markdown extraction for later model delivery.
      parameters:
      - name: X-Mobius-Lease-Token
        in: header
        required: false
        schema:
          type: string
        description: Active job lease token for worker-produced artifacts.
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
          maxLength: 255
        description: Optional durable retry key, unique within the authenticated principal's
          org scope.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateArtifactRequest'
      responses:
        '200':
          description: Existing artifact returned for an idempotent retry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Artifact'
        '201':
          description: Artifact uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Artifact'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          description: Payload too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: payload_too_large
                  message: artifact upload exceeds the maximum allowed size
  /v1/artifacts/{artifact_id}:
    get:
      operationId: getArtifact
      tags:
      - artifacts
      summary: Get artifact
      description: Returns artifact metadata after enforcing the caller's org and caller-authorized
        artifact audience.
      parameters:
      - $ref: '#/components/parameters/ArtifactIdParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Artifact'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteArtifact
      tags:
      - artifacts
      summary: Delete artifact
      description: Deletes the artifact and removes any Mobius-managed content before reporting
        success. Deleted artifacts are removed from public API visibility, and their content
        no longer counts toward artifact quota.
      parameters:
      - $ref: '#/components/parameters/ArtifactIdParam'
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/artifacts/{artifact_id}/content:
    get:
      operationId: getArtifactContent
      tags:
      - artifacts
      summary: Get artifact content
      description: 'Streams artifact bytes through the Mobius API after enforcing the caller''s
        artifact access scope. Safe preview mime types are returned inline; all other content
        is served as an attachment with `X-Content-Type-Options: nosniff`.'
      parameters:
      - $ref: '#/components/parameters/ArtifactIdParam'
      responses:
        '200':
          description: Streamed artifact bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/artifacts/{artifact_id}/signed-url:
    post:
      operationId: createArtifactSignedUrl
      tags:
      - artifacts
      summary: Create signed artifact URL
      description: Generates a fresh, time-boxed Mobius-managed storage URL for the artifact
        after enforcing the caller's artifact access scope. Use `getArtifactContent` when
        bytes should flow through the Mobius API instead of a signed storage URL.
      parameters:
      - $ref: '#/components/parameters/ArtifactIdParam'
      - name: ttl_seconds
        in: query
        required: false
        schema:
          type: integer
          format: int64
          minimum: 1
        description: Requested signed URL TTL. The server caps this at the maximum supported
          artifact download TTL.
      responses:
        '200':
          description: Signed URL created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactSignedUrl'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/settings/artifact-storage/quota:
    get:
      operationId: getArtifactStorageQuota
      tags:
      - artifacts
      summary: Get artifact storage quota
      description: Returns Mobius-managed artifact quota usage for the current org.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactQuotaUsage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: |-
        Bearer credential supplied via the `Authorization: Bearer <credential>` header. Two credential types are accepted:

        - **API keys** — prefix `mbx_`. Issued from the Mobius app or via the
        API key endpoints. API keys authenticate as a machine principal in
        one org. Send the raw `mbx_...` secret.
        - **CLI credentials** — prefix `mbc_`. Issued by the device-auth
        flow on behalf of a user, org-scoped, sent as the raw token.
  parameters:
    IDParam:
      name: resource_id
      in: path
      required: true
      description: Resource ID.
      schema:
        type: string
    SessionIdParam:
      name: session_id
      in: path
      required: true
      description: Identifier of the conversation session.
      schema:
        type: string
    TurnIdParam:
      name: turn_id
      in: path
      required: true
      description: Identifier of a turn within a session.
      schema:
        type: string
    ActionNameParam:
      name: action_name
      in: path
      required: true
      description: Action name as registered in the catalog.
      schema:
        type: string
    principal_id:
      name: principal_id
      in: path
      required: true
      description: Principal ID.
      schema:
        type: string
    CursorParam:
      name: cursor
      in: query
      description: Cursor for pagination (opaque string from previous response)
      schema:
        type: string
    LimitParam:
      name: limit
      in: query
      description: Maximum number of items to return
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
    AfterSequenceParam:
      name: after_sequence
      in: query
      description: Continuation cursor for sequence-ordered lists. Only include rows whose
        monotonic per-resource sequence is strictly greater than this value. Pass the `next_sequence`
        from the previous response to fetch the next page.
      schema:
        type: integer
        format: int64
        minimum: 0
    BeforeSequenceParam:
      name: before_sequence
      in: query
      description: Backward continuation cursor for sequence-ordered lists. Only include rows
        whose monotonic per-resource sequence is strictly less than this value. Combine with
        `order=desc` to page toward older rows from a known position; pass the `prev_sequence`
        from the previous response to fetch the next older page.
      schema:
        type: integer
        format: int64
        minimum: 1
    OrderParam:
      name: order
      in: query
      description: Scan direction for the page. `asc` (the default) returns oldest-first;
        `desc` returns newest-first — the way to fetch the latest rows of a long list (the
        tail) in a single request. Items in the response are always ordered ascending regardless
        of this value; `order` only selects which end of the list the page is taken from.
      schema:
        type: string
        enum:
        - asc
        - desc
        default: asc
    LastEventIDParam:
      name: Last-Event-ID
      in: header
      required: false
      description: SSE reconnect cursor. The browser EventSource API replays the last event's
        `id` in this header on automatic reconnect; the server resumes the stream after that
        sequence number. When both this header and the `after_sequence` query parameter are
        supplied, the larger sequence wins, so an explicit `after_sequence` never rewinds
        a live reconnect. Ignored for non-streaming (JSON) requests.
      schema:
        type: integer
        format: int64
        minimum: 0
    OrgIDParam:
      name: org_id
      in: path
      required: true
      description: Organization ID.
      schema:
        type: string
    EnvironmentIDParam:
      name: environment_id
      in: path
      required: true
      description: Environment ID.
      schema:
        type: string
    ReferenceTypeParam:
      name: reference_type
      in: path
      required: true
      description: Reference type name, such as `slack.channel` or `table.table`.
      schema:
        type: string
    IntegrationIDParam:
      name: integration_id
      in: path
      required: true
      description: Integration record ID.
      schema:
        type: string
        pattern: ^intg_[A-Za-z0-9]+$
    IntegrationEventIDParam:
      name: event_id
      in: path
      required: true
      description: Integration event receipt ID.
      schema:
        type: string
        pattern: ^ievt_[A-Za-z0-9]+$
    IntegrationProviderParam:
      name: provider
      in: path
      required: true
      description: Framework provider identifier from the integration provider catalog.
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Stable caller-generated key. Reusing it returns the original operation.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    MemoryKeyParam:
      name: memory_key
      in: path
      required: true
      description: 'The key identifying a memory entry. Restricted to a path-safe character
        set (letters, numbers, and `. _ : -`) so it stays reliably addressable.'
      schema:
        type: string
        minLength: 1
        maxLength: 256
        pattern: ^[A-Za-z0-9._:-]+$
    MemoryUserIDParam:
      name: user_id
      in: query
      description: User principal ID for a private memory partition. It must identify a current
        human member of this organization. Omit for shared memory.
      schema:
        type: string
        maxLength: 200
    ContextIncludeParam:
      name: include
      in: query
      required: false
      description: Set to `context` to include caller-supplied runtime context rows whose
        model-visible names begin with `app-`. Platform-owned runtime context remains hidden.
      schema:
        $ref: '#/components/schemas/ContextIncludeParam'
    TerminalPartialsIncludeParam:
      name: include_terminal_partials
      in: query
      required: false
      description: Set to `true` to include durable transcript rows salvaged from a failed
        or cancelled turn. These rows carry `partial` and `terminal_outcome` metadata and
        remain excluded from future model context.
      schema:
        type: boolean
        default: false
    NudgeIdParam:
      name: nudge_id
      in: path
      required: true
      description: Session nudge identifier.
      schema:
        type: string
    ArtifactIdParam:
      name: artifact_id
      in: path
      required: true
      schema:
        type: string
        pattern: ^art_[A-Za-z0-9]+$
      description: ID of the artifact
    RoutineID:
      name: routine_id
      in: path
      required: true
      schema:
        type: string
    RoutineProposalID:
      name: proposal_id
      in: path
      required: true
      schema:
        type: string
    TableIDParam:
      name: table_id
      in: path
      required: true
      description: Table ID.
      schema:
        type: string
        pattern: ^table_[A-Za-z0-9]+$
    TableNameQueryParam:
      name: name
      in: query
      schema:
        type: string
        pattern: ^[a-z][a-z0-9_]*$
        maxLength: 64
      description: Filter tables by name. Table names are unique within an org; use this as
        a discovery filter and use the returned table `id` for follow-up operations.
  responses:
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: Service Unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Rate limit exceeded. Retry after the delay indicated in the `Retry-After`
        header.
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait before retrying.
        X-RateLimit-Limit:
          schema:
            type: integer
          description: Limit of the tightest active rate-limit bucket.
        X-RateLimit-Remaining:
          schema:
            type: integer
          description: Requests remaining in the tightest bucket's current window.
        X-RateLimit-Reset:
          schema:
            type: integer
          description: Unix timestamp (seconds) when the tightest bucket resets.
        X-RateLimit-Scope:
          schema:
            type: string
            enum:
            - key
            - org
          description: Scope of the tightest bucket.
        X-RateLimit-Policy:
          schema:
            type: string
          description: All active windows for the selected scope, in `limit;w=seconds` form.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NoContent:
      description: No Content
  schemas:
    ErrorResponse:
      type: object
      additionalProperties: false
      description: Standard error envelope returned by API endpoints.
      required:
      - error
      properties:
        error:
          type: object
          additionalProperties: false
          description: Error detail.
          required:
          - code
          - message
          properties:
            code:
              type: string
              description: 'Stable, machine-readable error code in lower_snake_case. The cross-cutting
                codes clients can rely on across endpoints are: `bad_request` (malformed input
                / failed validation), `unauthorized`, `permission_denied`, `forbidden`, `not_found`,
                `conflict` / `already_exists`, `rate_limit_exceeded`, and `service_unavailable`.
                Direct session invocation conflicts use `session_turn_active` with the blocking
                `turn_id` and `status` in `details`. Session-key lookups without an agent
                scope use `session_key_scope_required`; supplying both agent ID and name uses
                `session_agent_ref_conflict`. API-key creation for a principal with no role
                assignments uses `principal_has_no_roles`. Authenticated callers missing a
                permission receive `permission_denied` with the required permission in `details`.
                Endpoint-specific codes (e.g. `invalid_signature`) extend this set; an unrecognized
                code should be handled by its HTTP status family.'
            message:
              type: string
              description: Human-readable error message
            details:
              type: object
              additionalProperties: true
              description: Optional structured details specific to a `code`. Endpoints that
                set this document the per-code shape inline. Absent for codes whose `code`
                + `message` are sufficient.
    GenerationDeltaFrame:
      type: object
      additionalProperties: true
      required:
      - event_type
      - delta
      description: Live-only token preview frame that can appear on session SSE streams. It
        is not persisted, does not carry an SSE `id:`, and cannot be replayed with `after_sequence`
        or `Last-Event-ID`.
      properties:
        event_type:
          type: string
          enum:
          - generation.delta
        session_id:
          type: string
          nullable: true
        turn_id:
          type: string
          nullable: true
        job_id:
          type: string
          nullable: true
        tool_call_id:
          type: string
          nullable: true
        live_sequence:
          type: integer
          format: int64
          nullable: true
          description: Monotonic per-turn sequence across all live-only session frames; use
            to detect dropped live frames.
        delta_sequence:
          type: integer
          format: int64
          nullable: true
          description: Publisher-local ordering hint for deltas within a turn, not a replay
            cursor.
        emitted_at:
          type: string
          format: date-time
          nullable: true
          description: Server timestamp when this live preview frame was emitted.
        delta:
          type: object
          additionalProperties: true
          description: 'Token preview payload. Normal answer text arrives as `{ "text": "..."
            }`; summarized reasoning/thinking arrives as `{ "type": "thinking", "thinking":
            "..." }`.'
        worker_id:
          type: string
          nullable: true
        model:
          type: string
          nullable: true
          description: Model producing the generation, e.g. `claude-sonnet-4-6`.
    ResourceOwner:
      type: object
      additionalProperties: false
      required:
      - kind
      description: The human or team responsible for this resource.
      properties:
        kind:
          type: string
          enum:
          - person
          - team
        id:
          type: string
          nullable: true
          description: Human principal ID when kind is person; null for the team.
    ResourceVisibility:
      type: string
      enum:
      - private
      - organization
      description: Who the custodian chose to share the resource with.
    ResourceContainer:
      type: object
      additionalProperties: false
      required:
      - kind
      - id
      nullable: true
      description: The agent that contains this resource and may further narrow who can reach
        it.
      properties:
        kind:
          type: string
          enum:
          - agent
        id:
          type: string
    ResourcePosture:
      type: string
      enum:
      - only_you
      - shared_by_you
      - shared_with_group
      - team
      - someone_else
      description: Employee-facing effective ownership and audience posture for the current
        caller.
    CapabilityReadiness:
      type: string
      enum:
      - ready
      - needs_setup
      description: Whether a catalog capability — an action, an event source, or an integration
        provider — is usable right now. `ready` means it can be used as-is; `needs_setup`
        means it is known and supported but blocked by configuration, credentials, permissions,
        provider runtime availability, or implementation status. This is catalog *readiness*,
        and is deliberately separate from a resource's lifecycle state (such as integration
        `status` or artifact lifecycle).
    CapabilityReadinessReason:
      type: string
      enum:
      - not_configured
      - inactive
      - expired
      - provider_unavailable
      - permission_missing
      - not_implemented
      - credentials_unreadable
      - agent_owned_only
      description: Why a capability is `needs_setup`. Present only when readiness is `needs_setup`.
        `not_configured` — no integration or credential is connected yet. `inactive` — the
        backing integration is manually disabled. `expired` — the backing credential has expired.
        `provider_unavailable` — the provider runtime is not currently available. `permission_missing`
        — the caller lacks permission to use it. `not_implemented` — a placeholder for a capability
        that is not yet available. `credentials_unreadable` — the stored credential cannot
        be decrypted by the running platform; reconnect the integration.
    TagMap:
      type: object
      description: Key/value tags for organizing and filtering resources. Up to 8 per resource;
        keys 1–128 characters, values up to 256. Keys prefixed `mobius:` are system-managed
        and cannot be set by callers.
      additionalProperties:
        type: string
        maxLength: 256
      maxProperties: 8
      example:
        owner: product
    IfExists:
      type: string
      enum:
      - error
      - adopt
      default: error
      description: Create-or-adopt behavior when a request's `external_ref` matches an existing
        resource. `error` (the default) rejects the request with 409. `adopt` returns the
        existing resource unchanged instead — mutable fields in the request are ignored, since
        no write happens — and requires `external_ref` to be set; omitting it returns 400.
    ResourceOwnershipTransitionRequest:
      type: object
      additionalProperties: false
      properties:
        owner:
          $ref: '#/components/schemas/ResourceOwner'
        visibility:
          $ref: '#/components/schemas/ResourceVisibility'
        detach_container:
          type: boolean
          default: false
          description: Clear the agent container when the resource supports detachment.
        confirm_audience_expansion:
          type: boolean
          default: false
          description: Required before sharing, handing custody to the team, or detaching
            a container.
      anyOf:
      - required:
        - owner
      - required:
        - visibility
      - required:
        - detach_container
    ResourceOwnershipState:
      type: object
      additionalProperties: false
      required:
      - owner
      - visibility
      - container
      - posture
      properties:
        owner:
          $ref: '#/components/schemas/ResourceOwner'
        visibility:
          $ref: '#/components/schemas/ResourceVisibility'
        container:
          $ref: '#/components/schemas/ResourceContainer'
        posture:
          $ref: '#/components/schemas/ResourcePosture'
    RoutineStatus:
      type: string
      enum:
      - active
      - paused
      - completed
      - cancelled
    AgentStatus:
      type: string
      enum:
      - active
      - inactive
      description: Administrative status. Inactive agents cannot claim new jobs. Deleted agents
        are excluded from normal reads.
    AgentModelRouteMode:
      type: string
      enum:
      - managed
      - worker
      description: 'Model-call route mode: `managed` or `worker`.'
    AgentModelRoute:
      type: object
      additionalProperties: false
      description: Default model route used by built-in messaging and by any turn that does
        not override the route.
      required:
      - mode
      properties:
        mode:
          $ref: '#/components/schemas/AgentModelRouteMode'
          description: Where this model call should run.
        environment_id:
          type: string
          description: Environment to use for worker-backed model calls.
        provider:
          type: string
          description: Provider id advertised by a local worker when `mode` is `worker`.
        model:
          type: string
          description: Model identifier to use for this route.
    AgentToolPresentation:
      type: string
      enum:
      - flat
      - meta
      description: |-
        Controls how granted actions are surfaced to the model in Mobius-hosted agent turns. `flat` (the default) exposes one tool per action, while `meta` groups related actions behind compact command routers.

        The two modes pay the same cost in different places. `meta` keeps the tool definitions small no matter how many actions are granted, but the router advertises command names only, so the model spends extra calls on `help` to discover arguments — every turn. `flat` puts every action's schema in the tool definitions, which are sent once and cached, and removes the discovery calls entirely. Prefer `meta` when the action count is large enough that the schemas would crowd the context window; prefer `flat` otherwise. Existing agents retain their stored mode; the default applies when creating an agent without one.
    ActionSelectorType:
      type: string
      description: How one entry in an agent's tool grant names the actions it covers. `exact`
        is a single action name; `group` a dotted prefix; `platform` every action of an integration;
        `custom` org-defined actions; `wildcard` everything. Omitting the type means `exact`.
      enum:
      - exact
      - group
      - platform
      - custom
      - wildcard
    ActionSelector:
      type: object
      additionalProperties: false
      required:
      - selector
      description: 'One entry in an agent''s tool grant. Selectors are expanded against the
        live action catalog at every build, so `platform: gmail` keeps meaning "every Gmail
        action" as the catalog grows.'
      properties:
        selector_type:
          $ref: '#/components/schemas/ActionSelectorType'
          description: Defaults to `exact` when omitted.
        selector:
          type: string
          maxLength: 512
          description: The selector value, read according to `selector_type`. Ignored for
            `wildcard`.
    AgentIntegrationAccess:
      type: object
      additionalProperties: false
      required:
      - provider
      description: One provider's connection rules for an agent. Both fields are decisions
        about the agent, not about any one connection.
      properties:
        provider:
          type: string
          description: The provider these rules apply to (`gmail`, `slack`, …).
        act_as_user:
          type: boolean
          default: false
          description: 'Whether the agent may resolve the personal connection of the person
            it is acting for. Defaults to false and is never implied: reaching somebody''s
            own account is what a person consents to when they talk to this agent, so it is
            shown on its page as "acts through your Gmail".'
        pin:
          type: string
          description: The one connection this agent uses for this provider, which also suppresses
            the runtime account choice. May name only an org-shared or agent-owned connection
            — a shared agent pinned to one person's mailbox would send as that person for
            everybody.
    SessionCompactionThreshold:
      type: string
      enum:
      - xs
      - sm
      - md
      - lg
      - xl
      description: 'T-shirt size selecting when `auto` compaction triggers as a percentage
        of the session model''s input context window: `xs` 10%, `sm` 20%, `md` 40%, `lg` 60%,
        and `xl` 80%. Unknown/custom models use a conservative 200k-token context window.
        `sm` is the default.'
    SessionCompactionPolicy:
      type: object
      additionalProperties: false
      description: Controls how a session's transcript is automatically summarized as it grows.
        On create the supplied fields are merged over the owning agent's default policy and
        the server defaults; on update they patch the session's current policy. Omitted fields
        keep their resolved values.
      properties:
        strategy:
          type: string
          enum:
          - auto
          - manual
          - disabled
          - none
          description: '`auto` (default) compacts automatically when the transcript crosses
            the model-relative `threshold` or exact `threshold_tokens` trigger. `manual` only
            compacts on an explicit compact request. `disabled` (alias `none`) never compacts.'
        threshold:
          $ref: '#/components/schemas/SessionCompactionThreshold'
          description: Model-relative size at which `auto` compacts. Each preset is a percentage
            of the session model's input context window; `sm` is the default. Mutually exclusive
            with `threshold_tokens`.
        threshold_tokens:
          type: integer
          format: int64
          minimum: 1
          maximum: 10000000
          description: Exact estimated-token count at which `auto` compacts. Use this for
            advanced workloads that need a specific threshold rather than a model-relative
            preset. Mutually exclusive with `threshold`.
        summary_model:
          type: string
          description: Model used to produce compaction summaries.
      example:
        strategy: auto
        threshold: sm
        summary_model: claude-haiku-4-5-20251001
    MemoryContextMode:
      type: string
      enum:
      - index
      - full
      - 'off'
      description: Automatic memory delivery mode for agent turns.
    MemoryContextPolicy:
      type: object
      additionalProperties: false
      description: Automatic memory delivery policy. The JSON object requires `mode` (`index`,
        `full`, or `off`) and optionally accepts `max_bytes`, for example `{"mode":"full","max_bytes":131072}`.
      required:
      - mode
      properties:
        mode:
          $ref: '#/components/schemas/MemoryContextMode'
        max_bytes:
          type: integer
          minimum: 0
          maximum: 245760
          description: UTF-8 byte budget for the rendered memory reminder. Omit for the mode
            default (1536 bytes for index, 131072 bytes for full); `0` also selects that default.
            Full mode fails the turn rather than truncating when the snapshot does not fit.
            Off mode ignores this field and injects no automatic memory context.
    ThinkingEffort:
      type: string
      enum:
      - inherit
      - low
      - medium
      - high
      - xhigh
      - max
      description: Reasoning-effort level for a turn, lowest (`low`) to highest (`max`). Higher
        effort spends more tokens on reasoning, improving quality on hard tasks at the cost
        of latency and credits. Levels above what the resolved model supports are clamped
        down. Set on an agent it is the default; set on a session it overrides the agent default.
        `inherit` (or omitting the field) defers to the layer below — the agent default for
        a session, or the provider's own default when nothing sets a level.
    AgentVisibility:
      type: string
      enum:
      - organization
      - restricted
      - private
      description: |-
        Who, inside the org that owns this agent, may reach it at all.

        `organization` (the default) is reachable by any org member — the behavior every agent had before visibility existed. `restricted` is reachable only by the agent's listed members. `private` is reachable only by its single member.

        Visibility is not a permission: what a member may DO with an agent stays governed by their org role. A principal outside an agent's audience gets `404` from every path — list, read, session, invoke, memory — so an agent's existence never leaks through a status code.

        Because agent memory is keyed by `(org, agent, user, key)` and every read is scoped to one agent, narrowing who can reach an agent narrows its shared memory layer by construction. Group memory needs no separate store.
    Agent:
      type: object
      additionalProperties: false
      description: AI actor identity. An agent IS a principal (its permissions are role grants
        on that principal) with instructions, configuration, and session presence.
      required:
      - id
      - principal_id
      - name
      - status
      - owner
      - posture
      - visibility
      - created_at
      - updated_at
      - memory_enabled
      properties:
        id:
          type: string
          description: Unique identifier for this agent.
        principal_id:
          type: string
          description: The machine principal (principals.id, kind `agent`) this agent IS.
            Created atomically with the agent and immutable. It is an execution identity,
            never the human custodian of an ordinary resource.
        owner:
          $ref: '#/components/schemas/ResourceOwner'
        posture:
          $ref: '#/components/schemas/ResourcePosture'
        name:
          type: string
          description: Mutable unique name within the org. Free-form human-readable label;
            use `id` for stable references and job targeting.
          minLength: 1
          maxLength: 63
        external_ref:
          type: string
          minLength: 1
          maxLength: 200
          description: 'Client-owned durable identity key for this agent. Unique within the
            org when present, and assign-once: create requests may set it; update requests
            may set it only while the agent has no existing external_ref, or repeat the current
            value idempotently. Use it to reconcile the same agent across systems while allowing
            the display name to change.'
        description:
          type: string
          description: Optional human-readable description.
          maxLength: 500
        color:
          type: string
          description: Display color for this agent in UI surfaces. One of the Mantine color
            palette keys (e.g. `indigo`, `teal`, `grape`); empty string falls back to a hash-derived
            color.
          maxLength: 24
        model:
          type: string
          description: Model identifier for agents. Accepts any id returned by `GET /v1/catalog/models`
            (including slash-bearing OpenRouter catalog ids), optionally `provider/`-prefixed
            (e.g. `xai/grok-4`); bare known ids (e.g. `claude-sonnet-4-6`) are auto-detected
            to their provider. Empty string falls back to the platform default.
        model_route:
          $ref: '#/components/schemas/AgentModelRoute'
          description: Default route for model calls made by this agent.
        tool_presentation:
          $ref: '#/components/schemas/AgentToolPresentation'
          description: Default tool presentation used by this agent's turns and built-in channel-message
            replies.
        tool_selectors:
          type: array
          description: 'The agent''s tool grant: the action selectors it may call, expanded
            against the live action catalog at each build.'
          items:
            $ref: '#/components/schemas/ActionSelector'
        integration_access:
          type: array
          description: 'Per-provider connection rules. Absent means the defaults: the agent
            reaches org-shared and its own connections, and nothing is pinned.'
          items:
            $ref: '#/components/schemas/AgentIntegrationAccess'
        system_prompt:
          type: string
          description: Custom system prompt for agents. Empty string uses the generated default
            based on the agent name.
        timeout_seconds:
          type: integer
          format: int64
          minimum: 0
          description: Execution timeout, in seconds, for a single turn of this agent. `0`
            (or omitted) uses the platform default (600s / 10 minutes). A request's `operation.timeout_seconds`
            overrides this for that turn.
        compaction_policy:
          $ref: '#/components/schemas/SessionCompactionPolicy'
          description: Default session-compaction policy. New sessions opened against this
            agent inherit it (below server defaults, above explicit per-session overrides).
            Absent when the agent has no default.
        memory_enabled:
          type: boolean
          description: Hard gate for runtime memory. When false, memory tools and automatic
            memory context are absent for every session, and nothing at invocation time can
            re-enable them. Stored entries remain available to administrators.
        memory_context:
          $ref: '#/components/schemas/MemoryContextPolicy'
          description: Automatic memory delivery policy. Absent means the bounded index default.
        thinking_effort:
          $ref: '#/components/schemas/ThinkingEffort'
          description: Default reasoning-effort level. New sessions inherit it, above the
            provider default and below an explicit per-session override. Absent when the agent
            has no default.
        status:
          $ref: '#/components/schemas/AgentStatus'
          description: 'Current agent status: `active` or `inactive`.'
        visibility:
          $ref: '#/components/schemas/AgentVisibility'
          description: 'Who may reach this agent. Read from the stored agent row at every
            gate: it is never supplied by a definition document, an invoke `definition_config`,
            or a client-side list filter.'
        member_count:
          type: integer
          description: How many principals are in this agent's audience. Zero for an `organization`
            agent, which carries no member rows.
        email_address:
          type: string
          description: Inbox address provisioned via POST /v1/agents/{resource_id}/inbox (opt-in;
            not created automatically at agent creation). The field is populated only after
            a successful provisioning call. Use this address to add the agent as a member
            on external platforms (Linear, GitHub, Slack, etc.) so the platform can deliver
            notifications to the agent.
        tags:
          $ref: '#/components/schemas/TagMap'
          description: Free-form labels used for filtering, ownership, or automation.
        created_by:
          type: string
          description: ID of the principal who created this agent.
        updated_by:
          type: string
          description: ID of the principal who last updated this agent.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this agent was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when this agent was last updated.
      example:
        id: agent_5n8p2q7m4x9r3v6t
        principal_id: agent_5n8p2q7m4x9r3v6t
        name: PR reviewer
        description: Reviews pull requests for risky changes.
        color: teal
        model: claude-sonnet-4-6
        tool_presentation: flat
        memory_enabled: true
        status: active
        tags:
          owner: product
        created_by: user_2f9s3k4m5n6p7q8r
        updated_by: user_2f9s3k4m5n6p7q8r
        created_at: '2026-06-15T14:30:00Z'
        updated_at: '2026-06-15T14:30:00Z'
    AgentListResponse:
      type: object
      additionalProperties: false
      required:
      - items
      - has_more
      properties:
        items:
          type: array
          description: The list of results for this page.
          items:
            $ref: '#/components/schemas/Agent'
        has_more:
          type: boolean
          description: Whether more matching agents remain after this page.
        next_cursor:
          type: string
          description: Opaque cursor to pass as `cursor` on the next request. Absent when
            `has_more` is false.
    SessionStatus:
      type: string
      enum:
      - active
      - archived
      - deleted
      description: 'Durable conversation session status: `active`, `archived`, or `deleted`.'
    AgentTurnStatus:
      type: string
      enum:
      - queued
      - running
      - waiting
      - completed
      - failed
      - cancelled
      description: 'Agent turn lifecycle status: `queued`, `running`, `waiting`, `completed`,
        `failed`, or `cancelled`.'
    SessionOrigin:
      type: string
      enum:
      - manual
      - api
      - interaction
      description: 'Surface that created the session: `manual`, `api`, or `interaction`.'
    SessionScope:
      type: string
      enum:
      - agent
      description: Boundary used to resolve named sessions.
    SessionRetentionPolicy:
      type: object
      additionalProperties: false
      required:
      - mode
      description: |-
        Controls how long a session is retained. Applied only when the session is first created (like `compaction_policy`); ignored when an existing session is resolved. `standard` is the default and keeps the session forever. `bounded` expires the session — pruning its transcript from every read path — once it has been idle past `ttl_seconds`. Kept for audit after expiry: a tombstone session row with its token totals, and the turn rows with their status, error, usage, and timings.

        `ttl_seconds` is required when `mode` is `bounded` and ignored for `standard`; the server validates this (a `oneOf` encoding was dropped because it only produced untyped union codegen without adding runtime enforcement in the generated Go/TypeScript clients).
      properties:
        mode:
          type: string
          enum:
          - standard
          - bounded
          description: '`standard` (default) retains the session indefinitely. `bounded` expires
            the session after it has been idle for `ttl_seconds`.'
        ttl_seconds:
          type: integer
          format: int64
          minimum: 3600
          maximum: 2592000
          description: 'Idle lifetime in seconds; required when `mode` is `bounded` and ignored
            otherwise. Measured from the last message activity (`last_message_at`), not session
            creation — continuing the session before it expires simply extends its life. Minimum
            1 hour, maximum 30 days. The 1-hour floor keeps a caller''s idempotency window
            comfortably inside the retention window: after expiry a retried idempotency key
            mints a fresh session rather than deduplicating against a pruned one.'
      example:
        mode: bounded
        ttl_seconds: 86400
    SessionCompactionBoundary:
      type: object
      additionalProperties: false
      description: Pointer to the latest compaction marker in a session's transcript. The
        marker is itself a transcript message (role `compaction`); everything at or below
        `covers_through_sequence` is summarized history.
      required:
      - message_id
      - sequence
      - covers_through_sequence
      properties:
        message_id:
          type: string
          description: Id of the compaction summary message in the transcript.
        sequence:
          type: integer
          description: Transcript sequence of the compaction marker itself.
        covers_through_sequence:
          type: integer
          description: Highest message sequence this summary covers — the before/after boundary.
    SessionCompactionProgress:
      type: object
      additionalProperties: false
      description: |-
        Whether a compaction pass is running on this session right now, and the threshold that will trigger the next one.

        This is the poll-side counterpart to the `compaction.started` / `compaction.created` / `compaction.failed` stream events: those events are live-only, so a client that connects mid-pass reads this instead. On the single-session read the object is always present, so a client binds one shape — an idle session reports `in_progress: false` and nothing else but the threshold. List entries omit it entirely.

        Paired with `token_input_total` (or a client-side estimate over the transcript it already renders), `threshold_tokens` supports a context-capacity gauge rather than a spinner that appears without warning.
      required:
      - in_progress
      properties:
        in_progress:
          type: boolean
          description: 'True while a summarization pass is running. Derived: a pass that dies
            without clearing its marker reads false once its `deadline` passes.'
        started_at:
          type: string
          format: date-time
          description: When the running pass started. Absent when no pass is running.
        deadline:
          type: string
          format: date-time
          description: When the running pass gives up. Absent when no pass is running. A pass
            still marked in progress past this point has died.
        from_sequence:
          type: integer
          description: Lowest transcript sequence the running pass is summarizing.
        through_sequence:
          type: integer
          description: Highest transcript sequence the running pass is summarizing.
        message_count:
          type: integer
          description: Number of transcript messages the running pass is folding into its
            summary.
        threshold_tokens:
          type: integer
          description: Estimated-token size at which this session compacts automatically,
            resolved from its policy and model. Absent when the session does not compact automatically
            (`manual`, `disabled`).
      example:
        in_progress: true
        started_at: '2026-08-02T15:04:05Z'
        deadline: '2026-08-02T15:04:35Z'
        from_sequence: 412
        through_sequence: 987
        message_count: 63
        threshold_tokens: 150000
    Session:
      type: object
      additionalProperties: false
      description: Durable conversation transcript owned by an agent.
      required:
      - id
      - owner
      - agent_id
      - title
      - status
      - origin
      - scope
      - scope_ref_id
      - scope_name
      - session_key
      - visibility
      - posture
      - message_count
      - token_input_total
      - token_output_total
      - cache_read_input_total
      - cache_creation_input_total
      - version
      - created_at
      - updated_at
      properties:
        id:
          type: string
          description: Stable session identifier.
        owner:
          $ref: '#/components/schemas/ResourceOwner'
        agent_id:
          type: string
          description: Agent that contains and executes this session. The agent never owns
            it.
        container:
          $ref: '#/components/schemas/ResourceContainer'
        title:
          type: string
          description: Human-readable session title.
        status:
          $ref: '#/components/schemas/SessionStatus'
          description: Lifecycle status of the session.
        origin:
          $ref: '#/components/schemas/SessionOrigin'
          description: Surface that created the session.
        scope:
          $ref: '#/components/schemas/SessionScope'
          description: Boundary used to resolve the session key.
        scope_ref_id:
          type: string
          description: Advanced provenance identifying the resource that owns the session
            namespace. Mobius derives this from `agent_id` for normal agent sessions.
        scope_name:
          type: string
          deprecated: true
          description: Deprecated legacy alias of `session_key`. Kept for compatibility while
            clients migrate to the canonical conversation-key field.
        session_key:
          type: string
          description: Stable caller-assigned conversation key, unique within one agent.
        visibility:
          $ref: '#/components/schemas/ResourceVisibility'
        posture:
          $ref: '#/components/schemas/ResourcePosture'
        model_override:
          type: string
          description: Model selected for this session. Omitted when the session inherits
            the agent's model.
        model:
          type: string
          description: Model the session most recently exchanged tokens with.
        model_provider:
          type: string
          description: Provider for the recorded `model`.
        compaction_policy:
          $ref: '#/components/schemas/SessionCompactionPolicy'
          description: Resolved message-compaction policy in effect for this session.
        retention:
          $ref: '#/components/schemas/SessionRetentionPolicy'
          description: Resolved retention policy in effect for this session. `standard` for
            ordinary permanent sessions.
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: When a `bounded` session will expire if it stays idle, computed from
            its last message activity (`last_message_at`) and the retention TTL. Null for
            `standard` sessions and for bounded sessions with no activity yet. After this
            time the transcript is pruned and the session reads as deleted.
        thinking_effort:
          $ref: '#/components/schemas/ThinkingEffort'
          description: This session's reasoning-effort override, or absent when the session
            inherits the agent default. Turns resolve the effective level as agent default
            then this override.
        latest_compaction:
          $ref: '#/components/schemas/SessionCompactionBoundary'
          nullable: true
          description: The most recent compaction marker in the transcript, or null when the
            session has never been compacted. Delineates summarized history (sequences at
            or below `covers_through_sequence`) from the live tail. Returned on the single-session
            read; absent from list entries.
        compaction:
          $ref: '#/components/schemas/SessionCompactionProgress'
          description: Live compaction progress plus the threshold that triggers the next
            pass. Returned on the single-session read; absent from list entries.
        message_count:
          type: integer
          description: Total messages currently in the session, including compaction summaries.
        token_input_total:
          type: integer
          description: Lifetime fresh (uncached) input-token total for this session. Prompt-cache
            tokens are reported separately in `cache_read_input_total` and `cache_creation_input_total`.
        token_output_total:
          type: integer
          description: Lifetime output-token total reported for this session.
        cache_read_input_total:
          type: integer
          description: Lifetime prompt-cache-read input-token total for this session.
        cache_creation_input_total:
          type: integer
          description: Lifetime prompt-cache-write (cache creation) input-token total for
            this session.
        version:
          type: integer
          description: Optimistic-concurrency version. Increments on every mutation.
        last_message_at:
          type: string
          format: date-time
          nullable: true
          description: Timestamp of the most recent message append; null before any messages
            are stored.
        forked_from_session_id:
          type: string
          description: Source session this one was forked from, if any.
        forked_from_sequence:
          type: integer
          description: Sequence number in the source session at which the fork was taken.
        created_by:
          type: string
          description: User who created this session, if attribution was captured.
        metadata:
          type: object
          additionalProperties: true
          description: Free-form caller metadata.
        created_at:
          type: string
          format: date-time
          description: Record creation timestamp.
        updated_at:
          type: string
          format: date-time
          description: Last update timestamp.
    SessionMessageRole:
      type: string
      enum:
      - system
      - user
      - assistant
      - tool
      - compaction
      description: 'Message role: `system`, `user`, `assistant`, `tool`, or `compaction`.'
    SessionMessageEntryType:
      type: string
      enum:
      - message
      - compaction
      description: 'Transcript entry type: `message` or `compaction`.'
    APIKey:
      type: object
      additionalProperties: false
      description: Stored API credential metadata for agent and service access. The raw secret
        is never returned here; use this object to list, audit, expire, or identify keys by
        prefix without exposing tokens.
      required:
      - id
      - name
      - key_prefix
      - principal_id
      - created_at
      - updated_at
      properties:
        id:
          type: string
          description: Unique identifier for this API key.
        name:
          type: string
          description: Human-readable label, unique within the organization.
        key_prefix:
          type: string
          description: First 8 characters of the key, used to identify it without exposing
            the secret.
        principal_id:
          type: string
          description: Principal this key authenticates as.
        scope_role_id:
          type: string
          description: Optional role whose permissions cap this key below its principal's
            full grants.
        org_role:
          type: string
          description: The system role this key acts as, when it is not bound to a specific
            principal (e.g. `Admin`). Absent for principal-bound keys.
        expires_at:
          type: string
          format: date-time
          description: Hard expiry timestamp. Requests using an expired key receive 401.
        last_used_at:
          type: string
          format: date-time
          description: Timestamp of the most recent authenticated request using this key.
        tags:
          $ref: '#/components/schemas/TagMap'
          description: Free-form labels used for filtering, ownership, or rotation policy.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this key was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when this key was last updated.
      example:
