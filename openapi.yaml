      - sessions
      summary: Nudge a session
      description: 'Adds user direction to the newest turn that can still absorb it. The agent
        receives it as contextual runtime input at the turn''s next safe boundary, after any
        in-flight provider request or tool call finishes — including one final boundary as
        the turn is about to complete. When no such turn exists (the session is idle), the
        input converts to a regular user message carried by a fresh direct-session turn, exactly
        as if it had been sent to the session; the acknowledgement then reports `delivery:
        new_turn` and `status: delivered`. The same conversion re-homes input whose target
        turn ends without absorbing it, so accepted input is never lost. Reusing an `idempotency_key`
        with identical content returns the original acknowledgement; reusing it with different
        content returns `409 Conflict`. Requires the `mobius.resource.use` permission (or
        the agent''s own backing principal).'
      parameters:
