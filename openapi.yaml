      description: |-
        Reports what changing this agent's audience would do, without writing anything: how many shared memory entries a widening republishes, which member rows it drops, and which principals a narrowing would strand.

        It is what makes the confirmation specific — "everyone in the org will be able to read the 14 things it knows" rather than a generic warning.
      parameters:
